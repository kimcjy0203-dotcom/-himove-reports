<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HiMove — 회원 현황</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html { background: #e8f0fb; }
body {
  font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
  background: #e8f0fb; color: #1a1a2e;
  max-width: 480px; margin: 0 auto;
  padding: 40px 18px 72px; position: relative;
}
body::before {
  content: ''; position: fixed; top: -160px; left: 50%;
  transform: translateX(-50%); width: 600px; height: 600px;
  background: radial-gradient(circle, #cfe4ff 0%, #edf5ff 45%, transparent 70%);
  filter: blur(60px); opacity: 0.9; pointer-events: none; z-index: 0;
}
body > * { position: relative; z-index: 1; }

.header {
  background: rgba(255,255,255,0.52); backdrop-filter: blur(48px); -webkit-backdrop-filter: blur(48px);
  border-radius: 32px; padding: 32px 28px 28px; margin-bottom: 18px;
  border: 1px solid rgba(255,255,255,0.85);
  box-shadow: 0 8px 48px rgba(100,150,230,0.10), inset 0 1px 0 rgba(255,255,255,0.95);
}
.header h1 {
  font-size: 38px; font-weight: 800; letter-spacing: -2px;
  background: linear-gradient(135deg, #5aaae8 0%, #3a8fd4 45%, #7acef5 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  margin-bottom: 4px; line-height: 1;
}
.header .sub { font-size: 13px; color: #a0b2c8; margin-top: 6px; }

.section-label {
  font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase;
  color: #b8c8da; margin: 20px 4px 10px;
}

.member-card {
  background: rgba(255,255,255,0.58); backdrop-filter: blur(48px); -webkit-backdrop-filter: blur(48px);
  border-radius: 24px; padding: 20px 22px; margin-bottom: 10px;
  border: 1px solid rgba(255,255,255,0.82);
  box-shadow: 0 4px 24px rgba(100,150,230,0.07), inset 0 1px 0 rgba(255,255,255,0.95);
  text-decoration: none; display: block;
  -webkit-tap-highlight-color: transparent;
}

.mc-top { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.mc-avatar {
  width: 42px; height: 42px; border-radius: 50%;
  background: linear-gradient(135deg, #667eea, #764ba2);
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; font-weight: 800; color: white; flex-shrink: 0;
}
.mc-name { font-size: 16px; font-weight: 800; color: #1a2a40; letter-spacing: -0.3px; }
.mc-month { font-size: 11px; color: #a0b8d0; margin-top: 2px; }
.mc-arrow { margin-left: auto; font-size: 20px; color: #c0d0e0; }

.mc-week-row { display: flex; gap: 6px; }
.mc-week-pill {
  flex: 1; padding: 8px 4px; border-radius: 12px; text-align: center;
  font-size: 11px; font-weight: 700;
  background: rgba(255,255,255,0.5); border: 1px solid rgba(160,190,230,0.25);
  color: #c0d0e0;
}
.mc-week-pill.done {
  background: rgba(100,155,220,0.10); border-color: rgba(100,155,220,0.3);
  color: #6a9ac4;
}
.mc-week-pill.current {
  background: rgba(100,155,220,0.2); border-color: rgba(100,155,220,0.55);
  color: #2a5a8a; font-weight: 800;
  box-shadow: 0 2px 8px rgba(100,150,230,0.15);
}
.mc-week-num  { display: block; font-size: 12px; font-weight: 800; margin-bottom: 2px; }
.mc-week-date { display: block; font-size: 10px; font-weight: 400; opacity: 0.8; }

.mc-purposes { display: flex; flex-wrap: nowrap; gap: 5px; margin-top: 10px; overflow: hidden; }
.mc-purpose-chip {
  padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; white-space: nowrap;
}
.mc-status { display: flex; gap: 6px; margin-top: 10px; align-items: center; }
.mc-status-chip { font-size: 10px; font-weight: 700; padding: 3px 9px; border-radius: 20px; background: rgba(255,255,255,0.6); border: 1px solid rgba(160,190,230,0.3); color: #6a9ac4; }
.mc-comment { font-size: 12px; color: #6a8aaa; margin-top: 8px; line-height: 1.6; padding: 8px 10px; background: rgba(255,255,255,0.5); border-radius: 10px; border-left: 2px solid rgba(100,155,220,0.3); }
.mc-inbody { font-size: 10px; font-weight: 700; color: #e07060; background: rgba(230,100,80,0.08); border: 1px solid rgba(230,100,80,0.2); border-radius: 20px; padding: 3px 9px; margin-left: auto; }

.empty-card {
  background: rgba(255,255,255,0.4); border-radius: 24px; padding: 40px 24px;
  text-align: center; color: #b0c0d4; font-size: 13px; line-height: 1.8;
  border: 1px dashed rgba(160,190,230,0.4);
}
.spinner { width: 28px; height: 28px; border: 2px solid rgba(160,190,230,0.3); border-top-color: rgba(90,154,210,0.8); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px; }
@keyframes spin { to { transform: rotate(360deg); } }

.footer { text-align: center; font-size: 11px; color: #b0c0d8; margin-top: 16px; line-height: 2; }
</style>
</head>
<body>

<div class="header">
  <h1>himove</h1>
  <div class="sub" id="member-count">불러오는 중...</div>
</div>

<div class="section-label">등록 회원</div>
<div id="member-list">
  <div class="empty-card"><div class="spinner"></div>데이터 불러오는 중...</div>
</div>

<div class="footer">HiMove &nbsp;·&nbsp; 트레이너 대시보드 &nbsp;·&nbsp; <a href="log.html" style="color:#7a9ab8;text-decoration:none">세션 로그</a></div>

<script>
const PURPOSE_META = {
  '체중감량': { bg: 'rgba(255,243,224,0.9)', color: '#e65100', icon: '🔥' },
  '근육증가': { bg: 'rgba(232,245,233,0.9)', color: '#2e7d32', icon: '💪' },
  '근력강화': { bg: 'rgba(227,242,253,0.9)', color: '#1565c0', icon: '⚡' },
  '체력향상': { bg: 'rgba(255,253,231,0.9)', color: '#f57f17', icon: '🏃' },
  '건강관리': { bg: 'rgba(243,229,245,0.9)', color: '#6a1b9a', icon: '❤️' },
  '재활/회복':{ bg: 'rgba(252,228,236,0.9)', color: '#880e4f', icon: '🌱' },
  '자세교정': { bg: 'rgba(224,247,250,0.9)', color: '#006064', icon: '🎯' },
  '유지':     { bg: 'rgba(245,245,245,0.9)', color: '#616161', icon: '⚖️' },
};

function currentWeekIdx(weeks) {
  for (let i = weeks.length - 1; i >= 0; i--) {
    if (weeks[i].mainMessage) return i;
  }
  return 0;
}

const CONDITION_COLOR = { '매우 좋음':'#5aaa7a','좋음':'#6aaa8a','보통':'#8aaac8','피곤함':'#c8944a','매우 피곤함':'#c06050' };
const SLEEP_COLOR     = { '매우 좋음':'#5aaa7a','좋음':'#6aaa8a','보통':'#8aaac8','나쁨':'#c8944a','매우 나쁨':'#c06050' };

function calcInbody(lastMeasured) {
  if (!lastMeasured) return null;
  const next = new Date(lastMeasured);
  next.setDate(next.getDate() + 14);
  const days = Math.ceil((next - new Date()) / 86400000);
  return days;
}

function renderCard(member, data) {
  const weeks  = data.weeks || [];
  const curIdx = currentWeekIdx(weeks);
  const cur    = weeks[curIdx] || {};
  const avatar = data.name?.[0] || '?';

  const weekPills = weeks.map((w, i) => {
    const isCurrent = i === curIdx && !!w.mainMessage;
    const isDone    = !!w.mainMessage && i < curIdx;
    const cls       = isCurrent ? 'current' : isDone ? 'done' : '';
    return `<div class="mc-week-pill ${cls}">
      <span class="mc-week-num">${w.label}</span>
      <span class="mc-week-date">${!w.mainMessage ? '미입력' : w.date}</span>
    </div>`;
  }).join('');

  const purposes = (data.purposes || []).slice(0, 3).map(p => {
    const m = PURPOSE_META[p] || { bg: 'rgba(240,240,240,0.9)', color: '#555', icon: '•' };
    return `<span class="mc-purpose-chip" style="background:${m.bg};color:${m.color}">${m.icon} ${p}</span>`;
  }).join('');

  const statusChips = [
    cur.condition ? `<span class="mc-status-chip" style="color:${CONDITION_COLOR[cur.condition]||'#8aaac8'}">컨디션 ${cur.condition}</span>` : '',
    cur.sleep     ? `<span class="mc-status-chip" style="color:${SLEEP_COLOR[cur.sleep]||'#8aaac8'}">수면 ${cur.sleep}</span>` : '',
    cur.pain      ? `<span class="mc-status-chip">불편 ${cur.pain}</span>` : '',
  ].filter(Boolean).join('');

  const lastMeasured = cur.bodyData?.lastMeasured;
  const daysLeft = calcInbody(lastMeasured);
  const inbodyBadge = daysLeft !== null
    ? `<span class="mc-inbody">${daysLeft <= 0 ? '인바디 측정 필요' : `인바디 D-${daysLeft}`}</span>`
    : '';

  const comment = cur.memberComment
    ? `<div class="mc-comment">💬 ${cur.memberComment}</div>` : '';

  return `<a class="member-card" href="report.html?id=${member.id}">
    <div class="mc-top">
      <div class="mc-avatar">${avatar}</div>
      <div>
        <div class="mc-name">${data.name}</div>
        <div class="mc-month">${data.month}</div>
      </div>
      <span class="mc-arrow">›</span>
    </div>
    <div class="mc-week-row">${weekPills}</div>
    ${statusChips ? `<div class="mc-status">${statusChips}${inbodyBadge}</div>` : ''}
    ${comment}
    ${purposes ? `<div class="mc-purposes">${purposes}</div>` : ''}
  </a>`;
}

fetch(`data/members.json?v=${Date.now()}`)
  .then(r => r.json())
  .then(members => {
    document.getElementById('member-count').textContent = `총 ${members.length}명 등록`;
    return Promise.all(
      members.map(m =>
        fetch(`data/${m.id}.json?v=${Date.now()}`)
          .then(r => r.json())
          .then(data => ({ member: m, data }))
          .catch(() => null)
      )
    );
  })
  .then(results => {
    const valid = results.filter(Boolean);
    document.getElementById('member-list').innerHTML = valid.length
      ? valid.map(({ member, data }) => renderCard(member, data)).join('')
      : '<div class="empty-card">등록된 회원이 없습니다.</div>';
  })
  .catch(() => {
    document.getElementById('member-list').innerHTML =
      '<div class="empty-card">데이터를 불러올 수 없습니다.</div>';
  });
</script>
</body>
</html>
