<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HiMove 월간 리포트 — 테스트</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html { background: #e8f0fb; }
body {
  font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
  background: #e8f0fb; color: #1a1a2e;
  max-width: 430px; margin: 0 auto;
  padding: 40px 18px 72px; position: relative;
}
body::before {
  content: ''; position: fixed; top: -160px; left: 50%;
  transform: translateX(-50%); width: 600px; height: 600px;
  background: radial-gradient(circle, #cfe4ff 0%, #edf5ff 45%, transparent 70%);
  filter: blur(60px); opacity: 0.9; pointer-events: none; z-index: 0;
}
body::after {
  content: ''; position: fixed; bottom: -100px; right: -80px;
  width: 380px; height: 380px;
  background: radial-gradient(circle, #daeeff 0%, transparent 65%);
  filter: blur(55px); opacity: 0.7; pointer-events: none; z-index: 0;
}
body > * { position: relative; z-index: 1; }

/* ── Header ── */
.header {
  background: rgba(255,255,255,0.52); backdrop-filter: blur(48px); -webkit-backdrop-filter: blur(48px);
  border-radius: 32px; padding: 36px 28px 30px; margin-bottom: 18px;
  border: 1px solid rgba(255,255,255,0.85);
  box-shadow: 0 8px 48px rgba(100,150,230,0.10), inset 0 1px 0 rgba(255,255,255,0.95);
}
.header h1 {
  font-size: 42px; font-weight: 800; letter-spacing: -2px;
  background: linear-gradient(135deg, #5aaae8 0%, #3a8fd4 45%, #7acef5 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  margin-bottom: 4px; line-height: 1;
}
.header .subtitle { font-size: 13px; color: #a0b2c8; font-weight: 400; margin-bottom: 22px; }
.header .meta { display: flex; flex-wrap: wrap; gap: 8px; }
.header .meta span {
  background: rgba(160,190,230,0.15); border: 1px solid rgba(160,190,230,0.3);
  border-radius: 100px; padding: 5px 14px; font-size: 12px; color: #5a7a9a; font-weight: 500;
}

/* ── 카드 ── */
.card {
  background: rgba(255,255,255,0.58); backdrop-filter: blur(48px); -webkit-backdrop-filter: blur(48px);
  border-radius: 28px; padding: 28px 24px; margin-bottom: 12px;
  border: 1px solid rgba(255,255,255,0.82);
  box-shadow: 0 6px 36px rgba(100,150,230,0.08), inset 0 1px 0 rgba(255,255,255,0.95);
}
.card:has(.card-title.gold) { background: rgba(232,241,255,0.65); border-color: rgba(180,210,250,0.55); }
.card-title {
  font-size: 13px; font-weight: 700; letter-spacing: 0.5px; color: #7a95b8;
  margin-bottom: 18px; display: flex; align-items: center; justify-content: space-between;
}
.card-title.gold::after {
  content: 'TRAINER'; font-size: 9px; font-weight: 700; letter-spacing: 1.5px; color: #6a9ac4;
  background: rgba(100,160,220,0.1); border: 1px solid rgba(100,160,220,0.2);
  border-radius: 100px; padding: 2px 9px;
}
.msg {
  background: rgba(255,255,255,0.78); backdrop-filter: blur(32px); -webkit-backdrop-filter: blur(32px);
  border: 1px solid rgba(195,218,255,0.6); border-radius: 20px; padding: 16px 18px;
  font-size: 14px; line-height: 1.9; color: #2a3a50; white-space: pre-line; font-weight: 400;
  box-shadow: 0 4px 20px rgba(100,150,230,0.08), inset 0 1px 0 rgba(255,255,255,1);
}
.note { font-size: 13px; color: #a0b2c8; line-height: 1.8; white-space: pre-line; }
.sub-label { font-size: 10px; font-weight: 700; margin-bottom: 8px; letter-spacing: 1.5px; text-transform: uppercase; color: #b8c8da; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { padding: 0 0 10px; text-align: left; font-size: 10px; font-weight: 700; color: #c0ccd8; letter-spacing: 1.5px; text-transform: uppercase; border-bottom: 1px solid rgba(160,190,230,0.2); }
td { padding: 13px 0; border-bottom: 1px solid rgba(160,190,230,0.15); color: #2a3a50; vertical-align: top; line-height: 1.7; }
tr:last-child td { border-bottom: none; }
.check-row { display: flex; flex-wrap: nowrap; gap: 6px; margin-bottom: 14px; }
.chip { flex: 1; min-width: 0; text-align: center; background: rgba(255,255,255,0.45); border: 1px solid rgba(160,190,230,0.3); border-radius: 100px; padding: 7px 4px; font-size: 11px; color: #a0b8d0; font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip.on { background: rgba(100,155,220,0.15); border-color: rgba(100,155,220,0.45); color: #3a6a9a; font-weight: 700; }
.stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat-box { background: rgba(255,255,255,0.78); backdrop-filter: blur(32px); -webkit-backdrop-filter: blur(32px); border-radius: 22px; padding: 20px 10px; text-align: center; border: 1px solid rgba(195,218,255,0.6); box-shadow: 0 4px 20px rgba(100,150,230,0.10), inset 0 1px 0 rgba(255,255,255,1); }
.stat-box .lbl { font-size: 10px; color: #b0c0d4; margin-bottom: 6px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; }
.stat-box .val { font-size: 28px; font-weight: 700; color: #1a2a40; letter-spacing: -1.5px; line-height: 1; }
.stat-box .unt { font-size: 11px; color: #b0c0d4; margin-top: 4px; }
.delta-row { margin-top: 14px; display: flex; gap: 10px; flex-wrap: wrap; }
.delta-box { display: flex; flex-direction: column; background: rgba(255,255,255,0.55); border: 1px solid rgba(255,255,255,0.8); border-radius: 14px; padding: 10px 14px; flex: 1; min-width: 80px; text-align: center; }
.dlbl { font-size: 10px; color: #b0c0d4; font-weight: 700; letter-spacing: 0.5px; margin-bottom: 4px; }
.dval { font-size: 15px; font-weight: 700; color: #2a3a50; }
.dval.up { color: #e07070; } .dval.down { color: #5a9a7a; }
.countdown-wrap { background: rgba(255,255,255,0.5); border: 1px solid rgba(255,255,255,0.8); border-radius: 16px; padding: 14px 16px; }
.countdown-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.countdown-label { font-size: 11px; font-weight: 700; letter-spacing: 1px; color: #a0b8d0; text-transform: uppercase; }
.countdown-days { font-size: 13px; font-weight: 700; color: #3a6a9a; }
.countdown-days.urgent { color: #d07070; }
.countdown-bar-bg { background: rgba(160,190,230,0.2); border-radius: 100px; height: 6px; overflow: hidden; }
.countdown-bar-fill { height: 100%; border-radius: 100px; background: linear-gradient(90deg, rgba(90,154,210,0.6), rgba(120,180,240,0.9)); }
.countdown-bar-fill.urgent { background: linear-gradient(90deg, rgba(210,120,110,0.6), rgba(230,150,140,0.9)); }
.countdown-sub { font-size: 11px; color: #b0c0d4; margin-top: 7px; }
.exercise-grid { display: flex; flex-direction: column; gap: 10px; }
.exercise-item { background: rgba(255,255,255,0.78); backdrop-filter: blur(32px); -webkit-backdrop-filter: blur(32px); border: 1px solid rgba(195,218,255,0.6); border-radius: 20px; padding: 16px 18px; box-shadow: 0 4px 20px rgba(100,150,230,0.10), inset 0 1px 0 rgba(255,255,255,1); }
.ei-name { font-size: 13px; font-weight: 800; color: #2a3a50; letter-spacing: -0.3px; margin-bottom: 6px; }
.ei-feedback { font-size: 13px; font-weight: 400; color: #6a80a0; line-height: 1.65; margin-bottom: 6px; }
.ei-next { font-size: 12px; font-weight: 400; color: #a0b8d0; }
.ei-next::before { content: '→  '; }
.lift-grid { display: flex; flex-direction: column; gap: 10px; }
.lift-box { background: rgba(255,255,255,0.78); backdrop-filter: blur(32px); -webkit-backdrop-filter: blur(32px); border: 1px solid rgba(195,218,255,0.6); border-radius: 20px; padding: 16px 18px; display: flex; align-items: center; gap: 14px; box-shadow: 0 4px 20px rgba(100,150,230,0.10), inset 0 1px 0 rgba(255,255,255,1); }
.lb-name { font-size: 13px; font-weight: 800; color: #2a3a50; width: 72px; flex-shrink: 0; }
.lb-current { font-size: 24px; font-weight: 700; color: #1a2a40; letter-spacing: -1px; flex: 1; line-height: 1; }
.lb-current span { font-size: 12px; font-weight: 400; color: #b0c0d4; margin-left: 1px; }
.lb-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.lb-goal { font-size: 11px; color: #b0c0d4; }
.lb-gap { font-size: 12px; font-weight: 700; color: #6a9ac4; }
.weekly-cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-bottom: 14px; }
.cal-day { background: rgba(255,255,255,0.45); border: 1px solid rgba(160,190,230,0.3); border-radius: 14px; padding: 12px 4px 10px; text-align: center; cursor: pointer; user-select: none; }
.cd-weekday { font-size: 10px; font-weight: 700; color: #b0c0d4; letter-spacing: 0.5px; margin-bottom: 4px; }
.cd-workout { font-size: 10px; color: #a0b8d0; font-weight: 500; }
.cd-check { font-size: 12px; margin-top: 4px; color: #3a6a9a; opacity: 0; }
.cal-day.checked { background: rgba(100,155,220,0.14); border-color: rgba(100,155,220,0.45); }
.cal-day.checked .cd-weekday, .cal-day.checked .cd-workout { color: #3a6a9a; font-weight: 700; }
.cal-day.checked .cd-check { opacity: 1; }
.cal-day.rest-day { opacity: 0.5; cursor: default; }
.wk-count { font-size: 11px; font-weight: 600; color: #6a9ac4; background: rgba(100,155,220,0.1); border: 1px solid rgba(100,155,220,0.2); border-radius: 100px; padding: 2px 10px; }
.body-map-container { display: flex; gap: 8px; justify-content: center; margin-bottom: 4px; }
.body-map-wrap { display: flex; flex-direction: column; align-items: center; flex: 1; }
.body-map-svg { width: 100%; max-width: 118px; display: block; }
.body-map-lbl { font-size: 10px; font-weight: 700; letter-spacing: 1.5px; color: #b8c8da; text-align: center; margin-top: 6px; }
.muscle-area { cursor: pointer; transition: filter 0.15s; }
.muscle-popup { position: fixed; background: rgba(255,255,255,0.97); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border: 1px solid rgba(195,218,255,0.8); border-radius: 18px; padding: 14px 16px 12px; box-shadow: 0 10px 40px rgba(100,150,230,0.2); z-index: 200; min-width: 160px; max-width: 200px; }
.popup-close { position: absolute; top: 9px; right: 13px; font-size: 17px; color: #b0c0d4; cursor: pointer; }
.popup-name { font-size: 13px; font-weight: 800; color: #2a3a50; margin-bottom: 8px; padding-right: 18px; }
.popup-exercises { font-size: 12px; color: #6a80a0; line-height: 1.9; }
.final-card { background: rgba(232,241,255,0.65); border: 1px solid rgba(180,210,250,0.55); border-radius: 28px; padding: 32px 26px; margin-bottom: 12px; box-shadow: 0 6px 36px rgba(100,150,230,0.10), inset 0 1px 0 rgba(255,255,255,0.9); }
.final-card > div:first-child { font-size: 10px; letter-spacing: 2px; color: #8aabcc; margin-bottom: 12px; font-weight: 700; }
.final-card > div:last-child { font-size: 16px; line-height: 1.85; font-weight: 500; color: #2a3a50; }
.footer { text-align: center; font-size: 11px; color: #b0c0d8; margin-top: 10px; padding-bottom: 20px; line-height: 2; letter-spacing: 0.5px; }

/* ── 운동 목적 ── */
.purpose-grid { margin-top: 14px; display: flex; flex-wrap: nowrap; gap: 7px; }
.purpose-chip { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; padding: 9px 10px; border-radius: 14px; font-size: 12px; font-weight: 700; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.75); box-shadow: 0 2px 10px rgba(100,150,230,0.09), inset 0 1px 0 rgba(255,255,255,0.9); white-space: nowrap; overflow: hidden; }
.purpose-chip-icon { font-size: 15px; line-height: 1; flex-shrink: 0; }

/* ── 장중단기 타임라인 ── */
.goal-timeline { position: relative; padding-left: 32px; margin-top: 2px; }
.goal-timeline::before { content: ''; position: absolute; left: 10px; top: 10px; bottom: 10px; width: 2px; background: linear-gradient(to bottom, rgba(76,175,80,0.6), rgba(33,150,243,0.6), rgba(156,39,176,0.6)); border-radius: 2px; }
.gt-item { position: relative; margin-bottom: 10px; }
.gt-item:last-child { margin-bottom: 0; }
.gt-dot { position: absolute; left: -26px; top: 12px; width: 12px; height: 12px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.9); }
.gt-card { background: rgba(255,255,255,0.52); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); padding: 11px 14px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.82); box-shadow: 0 3px 14px rgba(100,150,230,0.07), inset 0 1px 0 rgba(255,255,255,0.9); }
.gt-header { display: flex; align-items: center; gap: 7px; margin-bottom: 4px; }
.gt-badge { font-size: 9px; font-weight: 800; letter-spacing: 1.2px; text-transform: uppercase; padding: 2px 8px; border-radius: 20px; }
.gt-period { font-size: 11px; color: #a0b2c8; margin-left: auto; }
.gt-text { font-size: 13px; font-weight: 600; color: #2a3a50; line-height: 1.5; }
.gt-short .gt-dot  { background: rgba(76,175,80,0.85); box-shadow: 0 0 0 2px rgba(76,175,80,0.3); }
.gt-short .gt-card { border-left: 3px solid rgba(76,175,80,0.6); }
.gt-short .gt-badge{ background: rgba(76,175,80,0.12); color: #2e7d32; }
.gt-mid .gt-dot    { background: rgba(33,150,243,0.85); box-shadow: 0 0 0 2px rgba(33,150,243,0.3); }
.gt-mid .gt-card   { border-left: 3px solid rgba(33,150,243,0.6); }
.gt-mid .gt-badge  { background: rgba(33,150,243,0.10); color: #1565c0; }
.gt-long .gt-dot   { background: rgba(156,39,176,0.8); box-shadow: 0 0 0 2px rgba(156,39,176,0.25); }
.gt-long .gt-card  { border-left: 3px solid rgba(156,39,176,0.55); }
.gt-long .gt-badge { background: rgba(156,39,176,0.09); color: #6a1b9a; }

/* ── 수업 요약 리스트 ── */
.summary-list { display: flex; flex-direction: column; }
.summary-item { display: flex; gap: 8px; padding: 10px 0; border-bottom: 1px solid rgba(160,190,230,0.15); align-items: baseline; }
.summary-item:last-child { border-bottom: none; padding-bottom: 0; }
.si-name   { font-size: 12px; font-weight: 800; color: #3a6a9a; min-width: 80px; flex-shrink: 0; }
.si-sep    { font-size: 12px; color: #c0d0e0; flex-shrink: 0; }
.si-detail { font-size: 13px; color: #2a3a50; line-height: 1.6; }

/* ── 주차 탭 ── */
.week-nav {
  position: sticky; top: 0; z-index: 100;
  display: flex; gap: 8px; padding: 12px 0 10px;
  background: rgba(232,240,251,0.88); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  margin-bottom: 4px;
}
.wt-btn {
  flex: 1; padding: 10px 6px; border-radius: 16px;
  border: 1px solid rgba(160,190,230,0.3);
  background: rgba(255,255,255,0.45);
  font-size: 12px; font-weight: 700; color: #a0b8d0;
  cursor: pointer; text-align: center; transition: all 0.2s;
  -webkit-tap-highlight-color: transparent;
}
.wt-btn .wt-week { display: block; font-size: 13px; font-weight: 800; margin-bottom: 2px; }
.wt-btn .wt-date { display: block; font-size: 10px; font-weight: 400; opacity: 0.8; }
.wt-btn.active {
  background: rgba(100,155,220,0.18); border-color: rgba(100,155,220,0.5);
  color: #3a6a9a; box-shadow: 0 3px 14px rgba(100,150,230,0.12);
}
.wt-btn.empty { opacity: 0.38; cursor: default; }

/* ── 주차 패널 ── */
.week-panel { display: none; }
.week-panel.active { display: block; }
.week-empty {
  background: rgba(255,255,255,0.4); border-radius: 24px; padding: 48px 24px;
  text-align: center; color: #b0c0d4; border: 1px dashed rgba(160,190,230,0.4);
  margin-top: 8px;
}
.week-empty .we-num { font-size: 32px; font-weight: 800; color: #d0dcea; margin-bottom: 8px; }
.week-empty .we-msg { font-size: 13px; line-height: 1.8; }

/* ── 유산소 존 ── */
.tool-inputs { display: flex; gap: 10px; margin-bottom: 18px; }
.ti-group { flex: 1; display: flex; flex-direction: column; gap: 5px; }
.ti-group label { font-size: 10px; font-weight: 700; color: #a0b8d0; letter-spacing: 0.5px; text-transform: uppercase; }
.ti-row { display: flex; align-items: center; gap: 6px; }
.ti-input {
  width: 100%; background: rgba(255,255,255,0.6); border: 1px solid rgba(160,190,230,0.35);
  border-radius: 10px; padding: 8px 12px; font-size: 15px; font-weight: 700;
  color: #2a3a50; text-align: center; outline: none;
  font-family: -apple-system, 'Apple SD Gothic Neo', sans-serif;
}
.ti-unit { font-size: 12px; color: #a0b8d0; white-space: nowrap; }
.zone-table { display: flex; flex-direction: column; gap: 7px; }
.zone-row {
  display: flex; align-items: center; gap: 10px;
  background: rgba(255,255,255,0.5); border-radius: 14px; padding: 11px 14px;
  border: 1px solid rgba(255,255,255,0.8);
}
.zone-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.zone-label { font-size: 11px; font-weight: 800; letter-spacing: 0.5px; width: 44px; flex-shrink: 0; }
.zone-range { font-size: 14px; font-weight: 700; color: #1a2a40; flex: 1; letter-spacing: -0.3px; }
.zone-range span { font-size: 11px; font-weight: 400; color: #b0c0d4; margin-left: 2px; }
.zone-desc { font-size: 11px; color: #a0b8d0; text-align: right; }
.zone-meta { font-size: 11px; color: #b0c0d4; margin-top: 4px; padding: 0 2px; }

/* ── 1RM ── */
.orm-inputs { display: flex; gap: 8px; margin-bottom: 14px; align-items: flex-end; }
.orm-inputs .ti-group { flex: 1; }
.orm-calc-btn {
  padding: 10px 16px; border-radius: 12px; background: rgba(100,155,220,0.15);
  border: 1px solid rgba(100,155,220,0.35); color: #3a6a9a; font-size: 13px; font-weight: 700;
  cursor: pointer; white-space: nowrap; height: 38px; align-self: flex-end;
  font-family: -apple-system, 'Apple SD Gothic Neo', sans-serif;
}
.orm-result-card {
  background: rgba(255,255,255,0.5); border-radius: 18px; padding: 16px;
  border: 1px solid rgba(195,218,255,0.5);
}
.orm-1rm-val { font-size: 32px; font-weight: 800; color: #1a2a40; letter-spacing: -1.5px; line-height: 1; margin-bottom: 4px; }
.orm-1rm-val span { font-size: 14px; font-weight: 400; color: #b0c0d4; margin-left: 2px; }
.orm-1rm-sub { font-size: 11px; color: #a0b8d0; margin-bottom: 14px; }
.orm-zone-list { display: flex; flex-direction: column; gap: 6px; }
.ozl-row { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 12px; background: rgba(255,255,255,0.45); }
.ozl-row.target { background: rgba(100,155,220,0.12); border: 1px solid rgba(100,155,220,0.3); }
.ozl-name { font-size: 12px; font-weight: 800; color: #3a6a9a; width: 56px; flex-shrink: 0; }
.ozl-weight { font-size: 14px; font-weight: 700; color: #1a2a40; flex: 1; }
.ozl-reps { font-size: 11px; color: #a0b8d0; }
.ozl-row.target .ozl-name { color: #1565c0; }
.ozl-row.target .ozl-weight { color: #0d47a1; }
.ozl-row.target .ozl-reps { color: #1565c0; }
.target-badge { font-size: 9px; font-weight: 800; background: rgba(33,150,243,0.12); color: #1565c0; border-radius: 20px; padding: 2px 7px; letter-spacing: 0.5px; }
</style>
</head>
<body>

<div class="header">
  <h1>himove</h1>
  <div class="subtitle" id="report-subtitle"></div>
  <div class="meta" id="report-meta"></div>
  <div id="purpose-grid" class="purpose-grid"></div>
</div>

<div class="card" id="goals-card" style="display:none"></div>

<!-- 유산소 존 -->
<div class="card">
  <div class="card-title blue">유산소 심박 존</div>
  <div class="tool-inputs">
    <div class="ti-group">
      <label>나이</label>
      <div class="ti-row">
        <input class="ti-input" type="number" id="input-age" min="10" max="80" value="28">
        <span class="ti-unit">세</span>
      </div>
    </div>
    <div class="ti-group">
      <label>안정시 심박수</label>
      <div class="ti-row">
        <input class="ti-input" type="number" id="input-rest-hr" min="40" max="100" value="62">
        <span class="ti-unit">bpm</span>
      </div>
    </div>
  </div>
  <div id="cardio-zone-meta" class="zone-meta"></div>
  <div class="zone-table" id="zone-table" style="margin-top:10px"></div>

function buildCountdown(lastMeasured) {
  if (!lastMeasured) return '';
  const last = new Date(lastMeasured);
  const next = new Date(last); next.setDate(next.getDate() + 14);
  const today = new Date(); today.setHours(0,0,0,0);
  const daysLeft = Math.ceil((next - today) / 86400000);
  const elapsed  = 14 - Math.max(daysLeft, 0);
  const pct      = Math.min(Math.round((elapsed / 14) * 100), 100);
  const isUrgent = daysLeft <= 3;
  const nextStr  = next.toLocaleDateString('ko-KR', { month: 'long', day: 'numeric' });
  const daysText = daysLeft <= 0 ? '측정이 필요해요' : `${daysLeft}일 남음`;
  return `<div class="countdown-wrap">
    <div class="countdown-top">
      <span class="countdown-label">다음 인바디 측정</span>
      <span class="countdown-days${isUrgent ? ' urgent' : ''}">${daysText}</span>
    </div>
    <div class="countdown-bar-bg"><div class="countdown-bar-fill${isUrgent ? ' urgent' : ''}" style="width:${pct}%"></div></div>
    <div class="countdown-sub">2주 주기 &nbsp;·&nbsp; 다음 예정: ${nextStr}</div>
  </div>`;
}

/* ── 주차 패널 빌드 ── */
function buildWeekPanel(w, idx) {
  if (!w.mainMessage) {
    return `<div class="week-panel" data-idx="${idx}">
      <div class="week-empty">
        <div class="we-num">${w.week}주차</div>
        <div class="we-msg">아직 입력 전입니다.<br>수업 후 트레이너가 업데이트해요.</div>
      </div></div>`;
  }

  const bd = w.bodyData;
  const lastW = bd.weight.filter(v => v !== null).at(-1);
  const lastF = bd.fat.filter(v => v !== null).at(-1);
  const lastM = bd.muscle.filter(v => v !== null).at(-1);
  const prevW = bd.weight.filter(v => v !== null).at(-2) ?? null;
  const prevF = bd.fat.filter(v => v !== null).at(-2) ?? null;
  const prevM = bd.muscle.filter(v => v !== null).at(-2) ?? null;
  function delta(curr, prev) {
    if (curr == null || prev == null) return { text: '—', cls: '' };
    const d = (curr - prev).toFixed(1);
    return { text: (d > 0 ? '+' : '') + d + ' kg', cls: d > 0 ? 'up' : d < 0 ? 'down' : '' };
  }
  const dW = delta(lastW, prevW), dF = delta(lastF, prevF), dM = delta(lastM, prevM);

  const condOpts  = ['매우 좋음','좋음','보통','피곤함','매우 피곤함'];
  const sleepOpts = ['매우 나쁨','나쁨','보통','좋음','매우 좋음'];
  const nutrOpts  = ['매우 나쁨','나쁨','보통','좋음','매우 좋음'];
  const painOpts  = ['없음','있음'];

  function chips(opts, active) {
    return opts.map(o => `<div class="chip${o === active ? ' on' : ''}">${o}</div>`).join('');
  }

  const summaryItems = (w.summary?.items || []).map(it =>
    `<div class="summary-item"><span class="si-name">${it.name}</span><span class="si-sep">=</span><span class="si-detail">${it.detail}</span></div>`
  ).join('');

  const exerciseItems = (w.exercises || []).map(e =>
    `<div class="exercise-item"><div class="ei-name">${e.name}</div><div class="ei-feedback">${e.note}</div>${e.next ? `<div class="ei-next">${e.next}</div>` : ''}</div>`
  ).join('') || '<div class="exercise-item"><div class="ei-name">—</div><div class="ei-feedback">피드백이 여기에 표시됩니다.</div></div>';

  const liftItems = (w.lifts || []).map(l =>
    `<div class="lift-box"><div class="lb-name">${l.name}</div><div class="lb-current">${l.current}<span>kg</span></div><div class="lb-meta"><div class="lb-goal">목표 ${l.goal}kg</div><div class="lb-gap">−${l.goal - l.current}kg</div></div></div>`
  ).join('');

  const r = w.weeklyRoutine;
  const calKey = `hm_${r.weekKey}_${idx}`;
  const calDays = r.days.map((d, i) =>
    `<div class="cal-day${d.rest ? ' rest-day' : ''}" data-idx="${i}" data-cal="${calKey}"><div class="cd-weekday">${d.day}</div><div class="cd-workout">${d.workout}</div><div class="cd-check">✓</div></div>`
  ).join('');

  return `<div class="week-panel" data-idx="${idx}">
    <div class="card"><div class="card-title gold">이번 주 핵심 메시지</div>
      <div class="msg gold">${w.mainMessage}</div></div>

    <div class="card"><div class="card-title blue">최근 수업 요약</div>
      <div style="font-size:12px;color:#a8bcd0;margin-bottom:12px;">수업일: ${w.summary?.date || ''}</div>
      <div class="summary-list">${summaryItems}</div></div>

    <div class="card"><div class="card-title blue">이번 수업 피드백</div>
      <div class="exercise-grid">${exerciseItems}</div></div>

    <div class="card"><div class="card-title blue">주요 리프트 현황</div>
      <div class="lift-grid">${liftItems}</div></div>

    <div class="card"><div class="card-title green">체성분 현황</div>
      ${buildCountdown(bd.lastMeasured)}
      <div class="stat-grid" style="margin-top:14px">
        <div class="stat-box"><div class="lbl">체중</div><div class="val">${lastW ?? '—'}</div><div class="unt">kg</div></div>
        <div class="stat-box"><div class="lbl">체지방량</div><div class="val">${lastF ?? '—'}</div><div class="unt">kg</div></div>
        <div class="stat-box"><div class="lbl">골격근량</div><div class="val">${lastM ?? '—'}</div><div class="unt">kg</div></div>
      </div>
      <div class="delta-row">
        <div class="delta-box"><span class="dlbl">체중 변화</span><span class="dval ${dW.cls}">${dW.text}</span></div>
        <div class="delta-box"><span class="dlbl">체지방 변화</span><span class="dval ${dF.cls}">${dF.text}</span></div>
        <div class="delta-box"><span class="dlbl">근육 변화</span><span class="dval ${dM.cls}">${dM.text}</span></div>
      </div></div>

    <div class="card"><div class="card-title green">체성분 변화 추이</div>
      <div style="position:relative;height:220px;margin-bottom:20px"><canvas id="bodyChart-${idx}"></canvas></div>
      <div class="sub-label">변화 분석</div>
      <div class="msg">${bd.comment}</div></div>

    <div class="card"><div class="card-title blue">이번 주 컨디션</div>
      <div class="check-row">${chips(condOpts, w.condition)}</div>
      <div class="note">${w.conditionNote || ''}</div></div>

    <div class="card"><div class="card-title blue">수면 품질</div>
      <div class="check-row">${chips(sleepOpts, w.sleep)}</div>
      <div class="note">${w.sleepNote || ''}</div></div>

    <div class="card"><div class="card-title blue">이번 주 트레이닝 <span class="wk-count" id="wk-count-${idx}">주 0회</span></div>
      <div class="weekly-cal" id="weekly-cal-${idx}">${calDays}</div>
      <div class="note">${r.note || ''}</div></div>

    <div class="card"><div class="card-title blue">오늘의 운동 부위</div>
      <div class="body-map-container" id="body-map-${idx}">
        <div class="body-map-wrap">${FRONT_SVG}<div class="body-map-lbl">앞</div></div>
        <div class="body-map-wrap">${BACK_SVG}<div class="body-map-lbl">뒤</div></div>
      </div></div>

    <div class="card"><div class="card-title blue">신체 불편 여부</div>
      <div class="check-row">${chips(painOpts, w.pain)}</div>
      <div class="note">${w.painNote || ''}</div></div>

    <div class="card"><div class="card-title blue">영양 상태</div>
      <div class="check-row">${chips(nutrOpts, w.nutrition)}</div>
      <div class="note">${w.nutritionNote || ''}</div></div>

    <div class="card"><div class="card-title green">종합 리뷰</div>
      <div style="margin-bottom:14px"><div class="sub-label">✓ 잘 하고 있는 점</div><div class="msg green">${w.review.good}</div></div>
      <div style="margin-bottom:14px"><div class="sub-label">⚠ 주의할 점</div><div class="msg gold">${w.review.caution}</div></div>
      <div><div class="sub-label">→ 권장 사항</div><div class="msg">${w.review.suggest}</div></div></div>

    <div class="card"><div class="card-title gold">트레이너 코멘트</div>
      <div class="msg gold" style="margin-bottom:16px">${w.trainerComment}</div>
      <div class="sub-label" style="margin-bottom:8px">트레이닝 방향</div>
      <div class="msg">${w.trainerDirection}</div></div>

    <div class="final-card">
      <div>FINAL MESSAGE</div>
      <div>${w.finalMessage}</div>
    </div>
  </div>`;
}

  });
});

/* ── 달력 체크 ── */
function initCalendars() {
  document.querySelectorAll('.weekly-cal').forEach(cal => {
    const calKey = cal.querySelector('.cal-day')?.dataset.cal;
    if (!calKey) return;
    let checked = JSON.parse(localStorage.getItem(calKey) || '[]');
    function renderCal() {
      cal.querySelectorAll('.cal-day').forEach((el, i) => {
        el.classList.toggle('checked', checked.includes(i));
      });
      const panelIdx = parseInt(cal.id.replace('weekly-cal-', ''));
      const countEl = document.getElementById(`wk-count-${panelIdx}`);
      if (countEl) countEl.textContent = `주 ${checked.length}회`;
    }
    renderCal();
    cal.querySelectorAll('.cal-day:not(.rest-day)').forEach(el => {
      el.addEventListener('click', function() {
        const i = parseInt(this.dataset.idx);
        if (checked.includes(i)) checked = checked.filter(x => x !== i);
        else checked.push(i);
        localStorage.setItem(calKey, JSON.stringify(checked));
        renderCal();
      });
    });
  });
}
initCalendars();

/* ── 바디맵 색칠 & 팝업 ── */
function initBodyMaps() {
  weeks.forEach((w, idx) => {
    const container = document.getElementById(`body-map-${idx}`);
    if (!container) return;
    const worked = new Set(w.musclesWorked || []);
    const aC = 'rgba(210,60,60,0.45)', aS = 'rgba(185,30,30,0.9)';
    const iC = 'rgba(210,224,238,0.55)', iS = 'rgba(175,200,225,0.6)';
    container.querySelectorAll('.muscle-area').forEach(el => {
      const m = el.dataset.muscle;
      if (worked.has(m)) { el.setAttribute('fill', aC); el.setAttribute('stroke', aS); el.setAttribute('stroke-width', '1.5'); }
      else                { el.setAttribute('fill', iC); el.setAttribute('stroke', iS); el.setAttribute('stroke-width', '1'); }
    });
  });
  const popup = document.getElementById('muscle-popup');
  let lastMuscle = null;
  document.getElementById('popup-close-btn').addEventListener('click', e => { e.stopPropagation(); popup.style.display = 'none'; lastMuscle = null; });
  document.querySelectorAll('.muscle-area').forEach(el => {
    el.addEventListener('click', function(e) {
      e.stopPropagation();
      const m = this.dataset.muscle, data = MUSCLE_DATA[m];
      if (!data) return;
      if (lastMuscle === m && popup.style.display !== 'none') { popup.style.display = 'none'; lastMuscle = null; return; }
      lastMuscle = m;
      popup.querySelector('.popup-name').textContent = data.name;
      popup.querySelector('.popup-exercises').innerHTML = data.exercises.map(x => '· ' + x).join('<br>');
      popup.style.display = 'block';
      const r = this.getBoundingClientRect(), pw = 175;
      const left = Math.max(10, Math.min(r.left + r.width / 2 - pw / 2, window.innerWidth - pw - 10));
      popup.style.left = left + 'px';
      const ph = 50 + data.exercises.length * 24;
      popup.style.top = (r.top > ph + 20 ? r.top - ph - 10 : r.bottom + 10) + 'px';
    });
  });
  document.addEventListener('click', () => { popup.style.display = 'none'; lastMuscle = null; });
}
initBodyMaps();
</script>
</body>
</html>
