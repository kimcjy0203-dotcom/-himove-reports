<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HiMove — 세션 로그</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
  background: #f0f4f8; color: #1a2a3a;
  max-width: 600px; margin: 0 auto; padding: 32px 18px 64px;
}
h1 { font-size: 22px; font-weight: 800; color: #1a2a40; letter-spacing: -1px; margin-bottom: 4px; }
.sub { font-size: 12px; color: #a0b8d0; margin-bottom: 28px; }

.member-block { margin-bottom: 32px; }
.member-name {
  font-size: 13px; font-weight: 800; color: #3a6a9a;
  letter-spacing: 0.3px; text-transform: uppercase;
  border-bottom: 2px solid rgba(100,150,210,0.2);
  padding-bottom: 6px; margin-bottom: 12px;
}
.entry {
  background: white; border-radius: 12px;
  padding: 12px 14px; margin-bottom: 8px;
  border: 1px solid rgba(160,190,230,0.2);
}
.entry-empty { opacity: 0.4; }
.entry-header {
  display: flex; align-items: baseline; gap: 8px; margin-bottom: 6px;
}
.entry-date { font-size: 13px; font-weight: 700; color: #1a2a40; }
.entry-week { font-size: 11px; color: #a0b8d0; }
.entry-stats {
  font-size: 11px; color: #7a95b0;
  display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 5px;
}
.entry-stats span { display: flex; align-items: center; gap: 3px; }
.dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.note { font-size: 12px; color: #5a7a9a; margin-bottom: 5px; font-style: italic; }
.comment {
  font-size: 12px; color: #3a5a7a;
  background: rgba(100,150,210,0.06); border-radius: 6px;
  padding: 5px 8px; margin-bottom: 5px;
}
.exercises { display: flex; flex-direction: column; gap: 2px; }
.ex-row { font-size: 11px; color: #6a8aa8; padding-left: 2px; }
.ex-row::before { content: '· '; color: #b0c8e0; }
.body-stats {
  display: flex; gap: 12px; margin-top: 5px;
  font-size: 11px; color: #8aa8c8;
}
.body-stats strong { color: #3a5a80; font-weight: 700; }
.empty-msg { font-size: 11px; color: #c0d0e0; padding: 2px 0; }
#loading { text-align: center; padding: 60px 0; color: #a0b8d0; font-size: 14px; }
</style>
</head>
<body>
<h1>himove</h1>
<div class="sub" id="updated"></div>
<div id="loading">불러오는 중…</div>
<div id="log"></div>

<script>
const COND_COLOR = { '좋음': '#6abf69', '매우 좋음': '#4caf50', '보통': '#ffa726', '피곤함': '#ef5350', '피로': '#ef5350', '매우 피곤함': '#e53935' };
const SLEEP_COLOR = { '좋음': '#6abf69', '매우 좋음': '#4caf50', '보통': '#ffa726', '나쁨': '#ef5350', '매우 나쁨': '#e53935' };

function dot(color) {
  return `<span class="dot" style="background:${color||'#c0d0e0'}"></span>`;
}

function renderEntry(w) {
  const hasData = w.condition || w.summary?.date || w.memberComment || w.conditionNote;
  if (!hasData) {
    return `<div class="entry entry-empty">
      <div class="entry-header">
        <span class="entry-week">${w.label}</span>
        <span class="empty-msg">기록 없음</span>
      </div>
    </div>`;
  }

  const statsHtml = [
    w.condition && `<span>${dot(COND_COLOR[w.condition])}컨디션 ${w.condition}</span>`,
    w.sleep     && `<span>${dot(SLEEP_COLOR[w.sleep])}수면 ${w.sleep}</span>`,
    w.stress    && `<span>${dot('#ab47bc')}스트레스 ${w.stress}</span>`,
    w.pain && w.pain !== '없음' && `<span>${dot('#ef5350')}통증 ${w.pain}</span>`,
  ].filter(Boolean).join('');

  const noteHtml    = w.conditionNote ? `<div class="note">${w.conditionNote}</div>` : '';
  const commentHtml = w.memberComment ? `<div class="comment">💬 ${w.memberComment}</div>` : '';

  const items = w.summary?.items || [];
  const exHtml = items.length
    ? `<div class="exercises">${items.map(it => `<div class="ex-row">${it.name} <span style="color:#b0c8e0">${it.detail}</span></div>`).join('')}</div>`
    : '';

  const bd = w.bodyData;
  const lW = bd?.weight?.filter(v=>v!=null).at(-1);
  const lF = bd?.fat?.filter(v=>v!=null).at(-1);
  const lM = bd?.muscle?.filter(v=>v!=null).at(-1);
  const bodyHtml = lW
    ? `<div class="body-stats"><span>체중 <strong>${lW}kg</strong></span><span>체지방 <strong>${lF}kg</strong></span><span>골격근 <strong>${lM}kg</strong></span></div>`
    : '';

  return `<div class="entry">
    <div class="entry-header">
      <span class="entry-date">${w.summary?.date || w.label}</span>
      <span class="entry-week">${w.summary?.date ? w.label : ''}</span>
    </div>
    ${statsHtml ? `<div class="entry-stats">${statsHtml}</div>` : ''}
    ${noteHtml}${commentHtml}${exHtml}${bodyHtml}
  </div>`;
}

function renderMember(member, data) {
  const weeks = (data.weeks || []).slice().reverse();
  const entries = weeks.map(renderEntry).join('');
  return `<div class="member-block">
    <div class="member-name">${data.name}</div>
    ${entries}
  </div>`;
}

fetch(`data/members.json?v=${Date.now()}`)
  .then(r => r.json())
  .then(members => Promise.all(
    members.map(m =>
      fetch(`data/${m.id}.json?v=${Date.now()}`)
        .then(r => r.json())
        .then(data => ({ member: m, data }))
        .catch(() => null)
    )
  ))
  .then(results => {
    document.getElementById('loading').style.display = 'none';
    const valid = results.filter(Boolean);
    document.getElementById('updated').textContent = `${valid.length}명 · ${new Date().toLocaleDateString('ko-KR', { month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' })} 기준`;
    document.getElementById('log').innerHTML = valid
      .map(({ member, data }) => renderMember(member, data))
      .join('');
  })
  .catch(() => {
    document.getElementById('loading').textContent = '불러오기 실패';
  });
</script>
</body>
</html>
