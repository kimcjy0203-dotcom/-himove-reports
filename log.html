<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HiMove — 세션 로그</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
  background: #eef2f8; color: #1a2a3a; font-size: 12px;
}
.page-header {
  padding: 20px 20px 12px;
  background: #eef2f8;
  position: sticky; top: 0; z-index: 100;
  border-bottom: 1px solid rgba(160,190,230,0.2);
}
.page-header h1 { font-size: 18px; font-weight: 800; color: #1a2a40; letter-spacing: -0.5px; }
.page-sub { font-size: 10px; color: #a0b8d0; margin-top: 2px; }

/* 테이블 래퍼 */
.table-wrap { overflow-x: auto; padding: 16px 0 40px; }
table { border-collapse: separate; border-spacing: 0; min-width: 100%; }

/* 헤더 */
thead th {
  position: sticky; top: 64px; z-index: 50;
  background: #eef2f8; padding: 10px 12px 8px;
  text-align: left; white-space: nowrap;
}
thead th:first-child {
  position: sticky; left: 0; z-index: 60;
  width: 72px; min-width: 72px;
}

/* 회원 헤더 카드 */
.member-header-cell {
  background: white; border-radius: 12px; padding: 10px 12px;
  border: 1px solid rgba(160,190,230,0.25);
  min-width: 200px; max-width: 220px;
}
.mh-name { font-size: 14px; font-weight: 800; color: #1a2a40; margin-bottom: 4px; }
.mh-month { font-size: 10px; color: #a0b8d0; margin-bottom: 8px; }
.progress-wrap { display: flex; align-items: center; gap: 6px; }
.progress-bar {
  flex: 1; height: 6px; background: rgba(160,190,230,0.25);
  border-radius: 10px; overflow: hidden;
}
.progress-fill { height: 100%; border-radius: 10px; background: linear-gradient(90deg, #5aaae8, #3a8fd4); }
.progress-text { font-size: 10px; font-weight: 700; color: #4a7ab0; white-space: nowrap; }

/* 주차 라벨 열 */
.week-label-cell {
  position: sticky; left: 0; z-index: 10;
  background: #eef2f8; padding: 8px 10px;
  vertical-align: top;
}
.wl-inner {
  background: white; border-radius: 8px; padding: 6px 8px;
  border: 1px solid rgba(160,190,230,0.2); text-align: center;
}
.wl-label { font-size: 10px; font-weight: 700; color: #4a7ab0; }
.wl-date  { font-size: 9px; color: #b0c8e0; margin-top: 1px; }

/* 주차 데이터 셀 */
td.data-cell { padding: 8px 6px; vertical-align: top; }
.cell-inner {
  background: white; border-radius: 10px; padding: 10px 11px;
  border: 1px solid rgba(160,190,230,0.2);
  min-width: 200px; max-width: 220px;
  min-height: 60px;
}
.cell-inner.empty { opacity: 0.4; text-align: center; padding: 14px; }
.cell-empty-msg { font-size: 10px; color: #c0d0e0; }

/* 뱃지 */
.badges { display: flex; flex-wrap: wrap; gap: 3px; margin-bottom: 6px; }
.badge {
  font-size: 9px; font-weight: 700; border-radius: 4px;
  padding: 1px 5px; white-space: nowrap;
}
.badge-pain { background: #fce4ec; color: #c62828; }
.badge-weight { font-size: 10px; font-weight: 700; color: #3a5a80; }

/* 계획/실제 */
.session-row { display: flex; gap: 4px; margin-bottom: 5px; flex-wrap: wrap; }
.s-badge { font-size: 9px; font-weight: 700; border-radius: 4px; padding: 1px 6px; }
.s-plan   { background: rgba(100,150,210,0.1); color: #4a7aa8; }
.s-actual { background: rgba(80,180,120,0.12); color: #2e7d52; }

/* 운동 목록 */
.ex-list { font-size: 10px; color: #7a9ab8; margin-bottom: 5px; line-height: 1.7; }
.ex-list::before { content: ''; }

/* 회원 코멘트 */
.comment { font-size: 10px; color: #4a6a8a; background: rgba(100,150,210,0.06); border-radius: 5px; padding: 3px 6px; margin-bottom: 5px; }

/* 다음 수업 메모 */
.memo {
  font-size: 10px; color: #7a5020;
  background: rgba(220,160,60,0.08);
  border-left: 2px solid rgba(220,160,60,0.45);
  border-radius: 0 5px 5px 0;
  padding: 4px 7px; margin-top: 5px;
  line-height: 1.6;
}
.memo-label { font-size: 9px; font-weight: 700; color: #b07030; margin-bottom: 2px; }

#loading { text-align: center; padding: 60px 0; color: #a0b8d0; font-size: 13px; }
</style>
</head>
<body>
<div class="page-header">
  <h1>himove</h1>
  <div class="page-sub" id="page-sub">불러오는 중…</div>
</div>
<div id="loading">⋯</div>
<div class="table-wrap" id="table-wrap" style="display:none">
  <table id="log-table"></table>
</div>

<script>
const COND_MAP = {
  '매우 좋음':['#e8f5e9','#2e7d32'], '좋음':['#e8f5e9','#388e3c'],
  '보통':['#fff8e1','#f57c00'], '피곤함':['#fce4ec','#c62828'],
  '피로':['#fce4ec','#c62828'], '매우 피곤함':['#fce4ec','#b71c1c'],
};
const SLEEP_MAP = {
  '매우 좋음':['#e8f5e9','#2e7d32'], '좋음':['#e8f5e9','#388e3c'],
  '보통':['#fff8e1','#f57c00'], '나쁨':['#fce4ec','#c62828'],
  '매우 나쁨':['#fce4ec','#b71c1c'],
};
const STRESS_MAP = {
  '낮음':['#e8f5e9','#388e3c'], '보통':['#fff8e1','#f57c00'],
  '높음':['#fce4ec','#c62828'], '매우 높음':['#fce4ec','#b71c1c'],
};

function badge(val, map) {
  if (!val) return '';
  const [bg, color] = map[val] || ['#f0f4f8','#7a95b0'];
  return `<span class="badge" style="background:${bg};color:${color}">${val}</span>`;
}

function planBadge(w) {
  const days = w.weeklyRoutine?.days || [];
  const lesson = days.filter(d => d.workout?.includes('레슨')).length;
  const self   = days.filter(d => !d.rest && d.workout && !['','-','휴식'].includes(d.workout) && !d.workout.includes('레슨')).length;
  const total  = lesson + self;
  if (!total) return '';
  return `<span class="s-badge s-plan">계획 ${total}회</span>`;
}

function actualBadge(w) {
  const n = w.sessionDates?.length;
  if (!n) return '';
  return `<span class="s-badge s-actual">✓ 실제 ${n}회</span>`;
}

function renderCell(w) {
  const hasData = w.mainMessage || w.summary?.date || w.memberComment || w.sessionDates?.length;
  if (!hasData) {
    return `<div class="cell-inner empty"><div class="cell-empty-msg">미입력</div></div>`;
  }

  const bd = w.bodyData || {};
  const lastW = (bd.weight||[]).filter(v=>v!=null).at(-1);

  const badges = [
    badge(w.condition, COND_MAP),
    badge(w.sleep, SLEEP_MAP),
    badge(w.stress, STRESS_MAP),
    (w.pain && w.pain !== '없음') ? `<span class="badge badge-pain">⚠ ${w.conditionNote||'통증'}</span>` : '',
    lastW ? `<span class="badge-weight">${lastW}kg</span>` : '',
  ].filter(Boolean).join('');

  const sessions = [planBadge(w), actualBadge(w)].filter(Boolean).join('');

  const items = (w.summary?.items||[]).map(it=>it.name).join(' · ');
  const exHtml = items ? `<div class="ex-list">· ${items}</div>` : '';

  const commentHtml = w.memberComment
    ? `<div class="comment">💬 ${w.memberComment}</div>` : '';

  // 다음 수업 메모 — 짧게 처리
  const memoText = w.nextSessionMemo
    ? w.nextSessionMemo.split('/')[0].trim() + (w.nextSessionMemo.includes('/') ? ' …' : '')
    : '';
  const memoHtml = memoText
    ? `<div class="memo"><div class="memo-label">📌 다음 수업</div>${memoText}</div>` : '';

  return `<div class="cell-inner">
    ${sessions ? `<div class="session-row">${sessions}</div>` : ''}
    ${badges ? `<div class="badges">${badges}</div>` : ''}
    ${commentHtml}${exHtml}${memoHtml}
  </div>`;
}

function memberHeaderCell(data) {
  const s = data.sessions || {};
  const total = s.total || 0;
  const done  = s.completed || 0;
  const pct   = total ? Math.round(done / total * 100) : 0;
  return `<div class="member-header-cell">
    <div class="mh-name">${data.name}</div>
    <div class="mh-month">${data.month || ''}</div>
    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="progress-text">${done}/${total}회</div>
    </div>
  </div>`;
}

fetch(`data/members.json?v=${Date.now()}`)
  .then(r => r.json())
  .then(members => Promise.all(
    members.map(m =>
      fetch(`data/${m.id}.json?v=${Date.now()}`).then(r=>r.json()).then(data=>({member:m,data})).catch(()=>null)
    )
  ))
  .then(results => {
    const valid = results.filter(Boolean);
    document.getElementById('loading').style.display = 'none';
    document.getElementById('table-wrap').style.display = 'block';
    document.getElementById('page-sub').textContent =
      `${valid.length}명 · ${new Date().toLocaleDateString('ko-KR',{month:'long',day:'numeric',hour:'2-digit',minute:'2-digit'})} 기준`;

    const maxWeeks = Math.max(...valid.map(v => v.data.weeks?.length || 0));

    let thead = '<thead><tr><th></th>' +
      valid.map(({data}) => `<th>${memberHeaderCell(data)}</th>`).join('') +
      '</tr></thead>';

    let tbody = '<tbody>';
    for (let wi = 0; wi < maxWeeks; wi++) {
      // 첫 번째 회원의 week 라벨 기준
      const sampleWeek = valid.find(v => v.data.weeks?.[wi])?.data.weeks[wi];
      const label = sampleWeek?.label || `${wi+1}주차`;
      const date  = sampleWeek?.date  || '';

      tbody += `<tr>
        <td class="week-label-cell">
          <div class="wl-inner">
            <div class="wl-label">${label}</div>
            ${date ? `<div class="wl-date">${date}</div>` : ''}
          </div>
        </td>`;

      for (const {data} of valid) {
        const w = data.weeks?.[wi];
        tbody += `<td class="data-cell">${w ? renderCell(w) : '<div class="cell-inner empty"><div class="cell-empty-msg">—</div></div>'}</td>`;
      }
      tbody += '</tr>';
    }
    tbody += '</tbody>';

    document.getElementById('log-table').innerHTML = thead + tbody;
  })
  .catch(() => { document.getElementById('loading').textContent = '불러오기 실패'; });
</script>
</body>
</html>
