<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HiMove — 세션 로그</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
  background: #eef2f8; color: #1a2a3a;
  max-width: 640px; margin: 0 auto; padding: 24px 16px 64px;
}
h1 { font-size: 20px; font-weight: 800; color: #1a2a40; letter-spacing: -0.8px; }
.page-sub { font-size: 11px; color: #a0b8d0; margin-top: 3px; margin-bottom: 14px; }
.search-wrap { position: relative; margin-bottom: 20px; }
.search-input {
  width: 100%; background: white; border: 1px solid rgba(160,190,230,0.4);
  border-radius: 12px; padding: 10px 16px 10px 38px;
  font-size: 14px; color: #1a2a40; outline: none; font-family: inherit;
}
.search-input:focus { border-color: #5aaae8; box-shadow: 0 0 0 3px rgba(90,170,232,0.1); }
.search-icon { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); font-size: 14px; color: #a0b8d0; pointer-events: none; }
.search-clear {
  position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
  font-size: 16px; color: #b0c8e0; cursor: pointer; display: none;
  background: none; border: none; line-height: 1;
}
.member-block.hidden { display: none; }

.member-block { background: white; border-radius: 16px; margin-bottom: 16px; overflow: hidden; border: 1px solid rgba(160,190,230,0.2); }

.member-header { padding: 14px 16px 12px; border-bottom: 1px solid rgba(160,190,230,0.15); }
.mh-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.mh-name { font-size: 15px; font-weight: 800; color: #1a2a40; }
.mh-month { font-size: 11px; color: #a0b8d0; }
.mh-report-btn { font-size: 10px; font-weight: 700; color: #5aaae8; background: rgba(90,170,232,0.09); border: 1px solid rgba(90,170,232,0.25); border-radius: 20px; padding: 3px 10px; text-decoration: none; white-space: nowrap; }
.mh-trainer-btn { font-size: 10px; font-weight: 700; color: #9a7ac8; background: rgba(154,122,200,0.09); border: 1px solid rgba(154,122,200,0.25); border-radius: 20px; padding: 3px 10px; text-decoration: none; white-space: nowrap; margin-top: 5px; display: inline-block; }
.mh-btns { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.goal-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
.goal-pill {
  font-size: 10px; color: #6a8aa8;
  background: rgba(100,150,210,0.07); border: 1px solid rgba(100,150,210,0.15);
  border-radius: 20px; padding: 3px 8px; display: flex; align-items: center; gap: 4px;
}
.goal-pill .curr { font-weight: 700; color: #2a4a6a; }
.goal-pill .rem  { color: #e06060; font-weight: 700; }
.progress-wrap { display: flex; align-items: center; gap: 8px; }
.progress-bar  { flex: 1; height: 5px; background: rgba(160,190,230,0.25); border-radius: 10px; overflow: hidden; }
.progress-fill { height: 100%; border-radius: 10px; background: linear-gradient(90deg, #5aaae8, #3a8fd4); }
.progress-text { font-size: 10px; font-weight: 700; color: #4a7ab0; white-space: nowrap; }

.week-row { padding: 10px 16px; border-bottom: 1px solid rgba(160,190,230,0.1); }
.week-row:last-child { border-bottom: none; }
.week-row.empty { opacity: 0.35; }

.wr-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
.wr-label { font-size: 11px; font-weight: 700; color: #3a5a80; min-width: 52px; }
.wr-date  { font-size: 10px; color: #b0c8e0; }
.badges { display: flex; gap: 4px; flex-wrap: wrap; }
.badge { font-size: 9px; font-weight: 700; border-radius: 5px; padding: 2px 6px; white-space: nowrap; }
.badge-pain { background: #fce4ec; color: #c62828; }
.badge-weight { font-size: 10px; font-weight: 700; color: #3a5a80; }

.s-badge { font-size: 9px; font-weight: 700; border-radius: 4px; padding: 2px 6px; }
.s-plan   { background: rgba(100,150,210,0.1); color: #4a7aa8; }
.s-actual { background: rgba(80,180,120,0.12); color: #2e7d52; }

.wr-detail { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; }

.wr-comment {
  font-size: 12px; color: #3a5a7a; line-height: 1.7;
  background: rgba(100,150,210,0.06); border-radius: 6px; padding: 6px 10px;
}

.wr-exercises { font-size: 11px; color: #6a8aaa; line-height: 1.8; }

.wr-memo {
  font-size: 11px; color: #6a4010; line-height: 1.7;
  background: rgba(220,160,60,0.08);
  border-left: 2px solid rgba(220,160,60,0.5);
  border-radius: 0 6px 6px 0; padding: 6px 10px;
}
.wr-memo-label { font-size: 9px; font-weight: 700; color: #b07030; margin-bottom: 3px; }

#loading { text-align: center; padding: 48px 0; color: #a0b8d0; font-size: 13px; }
.ci-row { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; margin-top: 8px; padding-top: 8px; border-top: 1px solid rgba(160,190,230,0.15); }
.ci-row-label { font-size: 9px; font-weight: 700; color: #b0c0d4; letter-spacing: 0.5px; margin-right: 2px; }
</style>
</head>
<body>
<h1>himove</h1>
<div class="page-sub" id="page-sub">불러오는 중…</div>
<div class="search-wrap">
  <span class="search-icon">🔍</span>
  <input class="search-input" id="search-input" type="text" placeholder="회원 이름 검색…" oninput="handleSearch(this.value)">
  <button class="search-clear" id="search-clear" onclick="clearSearch()">✕</button>
</div>
<div id="ci-banner" style="display:none;position:sticky;top:0;z-index:200;background:#e8f5e9;border-bottom:2px solid #4caf50;padding:12px 16px;font-size:13px;font-weight:700;color:#2e7d32"></div>
<div id="loading">⋯</div>
<div id="log"></div>
<div id="pat-setup" style="display:none;margin-top:24px;padding:14px 16px;background:white;border-radius:12px;border:1px solid rgba(160,190,230,0.3)">
  <div style="font-size:12px;font-weight:700;color:#3a5a80;margin-bottom:8px">체크인 자동저장 설정</div>
  <div style="font-size:11px;color:#a0b8d0;margin-bottom:10px">GitHub PAT을 한 번 입력하면 이후 링크 클릭 시 자동 저장됩니다.</div>
  <input id="pat-input" type="password" placeholder="github_pat_..." style="width:100%;border:1px solid rgba(160,190,230,0.4);border-radius:8px;padding:8px 12px;font-size:12px;outline:none;font-family:inherit;margin-bottom:8px">
  <button onclick="savePat()" style="width:100%;background:rgba(90,154,210,0.15);border:1px solid rgba(90,154,210,0.3);border-radius:8px;padding:8px;font-size:12px;font-weight:700;color:#2a5a8a;cursor:pointer">저장</button>
</div>

<script>
// ── GitHub API 자동저장 설정 ──────────────────────────────
const GH_TOKEN  = localStorage.getItem('hm_gh_pat') || '';
const GH_OWNER  = 'kimcjy0203-dotcom';
const GH_REPO   = '-himove-reports';
// ─────────────────────────────────────────────────────────

// 회원 체크인 링크 수신 처리
window._ci = null;
(function() {
  const ci = new URLSearchParams(window.location.search).get('ci');
  if (!ci) return;
  try {
    // 구형 링크(공백으로 깨진 +) + 신형 URL-safe(-/_) 모두 처리
    const b64 = ci.replace(/ /g,'+').replace(/-/g,'+').replace(/_/g,'/');
    const b64p = b64 + '='.repeat((4 - b64.length % 4) % 4);
    const d = JSON.parse(decodeURIComponent(escape(atob(b64p))));
    window._ci = d;
    // localStorage에도 저장 (같은 브라우저에서 재방문 시)
    if (d.wk && d.d) {
      try {
        const key = `hm-week-${d.wk}`;
        const wd = JSON.parse(localStorage.getItem(key) || '{}');
        if (!wd[d.d]) wd[d.d] = {};
        if (d.c)  wd[d.d].condition      = d.c;
        if (d.s)  wd[d.d].sleep          = d.s;
        if (d.p)  wd[d.d].pain           = d.p;
        if (d.n)  wd[d.d].nutrition      = d.n;
        if (d.cn) wd[d.d].condition_note = d.cn;
        if (d.sn) wd[d.d].sleep_note     = d.sn;
        if (d.pn) wd[d.d].pain_note      = d.pn;
        if (d.wouts?.length) wd._workouts = d.wouts;
        localStorage.setItem(key, JSON.stringify(wd));
        if (d.wm) localStorage.setItem(`hm-wmemo-${d.wk}`, d.wm);
      } catch(e) {}
    }
  } catch(e) {
    console.error('ci 파라미터 파싱 실패:', e);
  }
})();

// GitHub API로 체크인 데이터를 JSON 파일에 영구저장
async function saveCheckinToGitHub(ci) {
  if (!GH_TOKEN || !ci?.id || !ci?.wk || !ci?.d) return false;
  try {
    const apiBase = `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/data/${ci.id}.json`;
    const res = await fetch(apiBase, { headers: { Authorization: `token ${GH_TOKEN}`, Accept: 'application/vnd.github+json' } });
    if (!res.ok) throw new Error(`GET 실패: ${res.status}`);
    const { content, sha } = await res.json();
    const bytes = Uint8Array.from(atob(content.replace(/\n/g, '')), c => c.charCodeAt(0));
    const data = JSON.parse(new TextDecoder().decode(bytes));

    // 해당 주차 찾기
    const week = data.weeks?.find(w => w.weeklyRoutine?.weekKey === ci.wk);
    if (!week) throw new Error(`weekKey ${ci.wk} 없음`);

    // 체크인 데이터 반영
    if (ci.c) week.condition = ci.c;
    if (ci.s) week.sleep = ci.s;
    if (ci.p && ci.p !== '없음') week.pain = ci.p;
    if (ci.cn) week.conditionNote = ci.cn;
    if (ci.sn) week.sleepNote = ci.sn;
    if (ci.pn) week.painNote = ci.pn;
    if (ci.wm) week.memberComment = ci.wm;
    if (!week.sessionDates) week.sessionDates = [];
    if (!week.sessionDates.includes(ci.d)) week.sessionDates.unshift(ci.d);

    const jsonBytes = new TextEncoder().encode(JSON.stringify(data, null, 2));
    let binary = ''; jsonBytes.forEach(b => binary += String.fromCharCode(b));
    const updated = btoa(binary);
    const putRes = await fetch(apiBase, {
      method: 'PUT',
      headers: { Authorization: `token ${GH_TOKEN}`, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: `체크인 저장: ${ci.id} ${ci.d}`, content: updated, sha }),
    });
    if (!putRes.ok) throw new Error(`PUT 실패: ${putRes.status}`);
    return true;
  } catch(e) {
    console.error('GitHub 저장 실패:', e);
    return false;
  }
}

const COND = {
  '매우 좋음':['#e8f5e9','#2e7d32'],'좋음':['#e8f5e9','#388e3c'],
  '보통':['#fff8e1','#f57c00'],'피곤함':['#fce4ec','#c62828'],
  '피로':['#fce4ec','#c62828'],'매우 피곤함':['#fce4ec','#b71c1c'],
};
const SLEEP = {
  '매우 좋음':['#e8f5e9','#2e7d32'],'좋음':['#e8f5e9','#388e3c'],
  '보통':['#fff8e1','#f57c00'],'나쁨':['#fce4ec','#c62828'],'매우 나쁨':['#fce4ec','#b71c1c'],
};
const STRESS = {
  '낮음':['#e8f5e9','#388e3c'],'보통':['#fff8e1','#f57c00'],
  '높음':['#fce4ec','#c62828'],'매우 높음':['#fce4ec','#b71c1c'],
};

function badge(label, val, map) {
  if (!val) return '';
  const [bg, color] = map[val] || ['#f0f4f8','#7a95b0'];
  return `<span class="badge" style="background:${bg};color:${color}">${label} ${val}</span>`;
}

function renderWeek(w) {
  // localStorage + ci 파라미터 병합으로 브라우저 무관하게 체크인 표시
  const wk    = `hm-week-${w.weeklyRoutine?.weekKey}`;
  const wmKey = `hm-wmemo-${w.weeklyRoutine?.weekKey}`;
  let checkins = {};
  let wmText = '';
  try { checkins = JSON.parse(localStorage.getItem(wk) || '{}'); } catch(e) {}
  try { wmText = (localStorage.getItem(wmKey) || '').trim(); } catch(e) {}
  // ci 링크로 받은 데이터가 이 주차 것이면 덮어써서 확실히 표시
  const ci = window._ci;
  if (ci && ci.wk === w.weeklyRoutine?.weekKey) {
    if (!checkins[ci.d]) checkins[ci.d] = {};
    if (ci.c)  checkins[ci.d].condition      = ci.c;
    if (ci.s)  checkins[ci.d].sleep          = ci.s;
    if (ci.p)  checkins[ci.d].pain           = ci.p;
    if (ci.n)  checkins[ci.d].nutrition      = ci.n;
    if (ci.cn) checkins[ci.d].condition_note = ci.cn;
    if (ci.sn) checkins[ci.d].sleep_note     = ci.sn;
    if (ci.pn) checkins[ci.d].pain_note      = ci.pn;
    if (ci.wouts?.length) checkins._workouts  = ci.wouts;
    if (ci.wm) wmText = ci.wm;
  }
  function getCounts(field) {
    const cnt = {};
    Object.values(checkins).forEach(day => {
      if (day[field]) cnt[day[field]] = (cnt[day[field]] || 0) + 1;
    });
    return cnt;
  }
  function countBadges(field, map) {
    const cnt = getCounts(field);
    return Object.entries(cnt).map(([k,v]) => {
      const [bg, color] = map[k] || ['#f0f4f8','#7a95b0'];
      return `<span class="badge" style="background:${bg};color:${color}">${k} ${v}</span>`;
    }).join('');
  }
  const hasCheckins = Object.keys(checkins).length > 0 || !!wmText;
  const hasData = w.mainMessage || w.summary?.date || w.summaries?.length || w.memberComment || w.sessionDates?.length || hasCheckins;

  const days   = w.weeklyRoutine?.days || [];
  const lesson = days.filter(d => d.workout?.includes('레슨')).length;
  const self   = days.filter(d => !d.rest && d.workout && !['','-','휴식'].includes(d.workout) && !d.workout.includes('레슨')).length;
  const total  = lesson + self;
  const actual = w.sessionDates?.length || 0;

  const sessionBadges = [
    total  ? `<span class="s-badge s-plan">계획 ${total}회 (레슨 ${lesson}·자율 ${self})</span>` : '',
    actual ? `<span class="s-badge s-actual">✓ 실제 ${actual}회</span>` : '',
  ].filter(Boolean).join('');

  const bd = w.bodyData || {};
  const lastW = (bd.weight||[]).filter(v=>v!=null).at(-1);

  // 트레이너 입력 뱃지
  const trainerBadges = [
    badge('컨디션', w.condition, COND),
    badge('수면', w.sleep, SLEEP),
    badge('스트레스', w.stress, STRESS),
    (w.pain && w.pain !== '없음') ? `<span class="badge badge-pain">⚠ ${w.conditionNote||'통증'}</span>` : '',
    lastW ? `<span class="badge-weight">${lastW}kg</span>` : '',
  ].filter(Boolean).join('');

  // 회원 체크인 뱃지 (localStorage 누적)
  const workoutBadge = checkins._workouts?.length
    ? `<span class="badge" style="background:#e8f5e9;color:#2e7d32">운동 ${checkins._workouts.join(' · ')} ✓</span>`
    : '';
  const checkinBadges = [
    countBadges('condition', COND),
    countBadges('sleep', SLEEP),
    workoutBadge,
  ].filter(Boolean).join('');

  const badgeHtml = trainerBadges || checkinBadges
    ? `${trainerBadges}${checkinBadges ? `<span style="font-size:9px;color:#b0c0d4;margin:0 4px">│</span>${checkinBadges}` : ''}` : '';

  const commentHtml = w.memberComment
    ? `<div class="wr-comment">💬 ${w.memberComment}</div>` : '';

  // 회원이 오늘 남긴 메모 (localStorage)
  const NOTE_LABELS = {condition_note:'컨디션', sleep_note:'수면', pain_note:'신체 불편', nutrition_note:'영양'};
  const latestDate = Object.keys(checkins).sort().at(-1);
  const latestDay = latestDate ? checkins[latestDate] : {};
  const memberNotes = Object.entries(NOTE_LABELS)
    .filter(([k]) => latestDay[k]?.trim())
    .map(([k, label]) => `${label}: ${latestDay[k]}`).join(' · ');
  const memberNoteHtml = memberNotes
    ? `<div class="wr-comment" style="margin-top:6px;color:#5a7a9a">📝 ${latestDate ? latestDate.slice(5).replace('-','/') + ' ' : ''}${memberNotes}</div>` : '';

  const wmHtml = wmText
    ? `<div class="wr-comment" style="margin-top:6px;color:#3a7a5a;white-space:pre-line">✏️ 개인운동: ${wmText}</div>` : '';

  const allItems = (w.summaries||[]).flatMap(s=>s.items||[]).concat(w.summary?.items||[]);
  const items = allItems.map(it => `· ${it.name}　${it.detail}`).join('<br>');
  const exHtml = items ? `<div class="wr-exercises">${items}</div>` : '';

  const memoHtml = w.nextSessionMemo
    ? `<div class="wr-memo"><div class="wr-memo-label">📌 다음 수업 체크</div>${w.nextSessionMemo}</div>` : '';

  const hasDetail = commentHtml || memberNoteHtml || wmHtml || exHtml || memoHtml;

  if (!hasData) return '';
  return `<div class="week-row">
    <div class="wr-top">
      <span class="wr-label">${w.label}</span>
      <span class="wr-date">${w.date||''}</span>
      ${sessionBadges ? `<div class="badges">${sessionBadges}</div>` : ''}
    </div>
    ${badgeHtml ? `<div class="badges">${badgeHtml}</div>` : ''}
    ${hasDetail ? `<div class="wr-detail">${commentHtml}${memberNoteHtml}${wmHtml}${exHtml}${memoHtml}</div>` : ''}
  </div>`;
}

function renderMember(member, data) {
  const s = data.sessions || {};
  const pct = s.total ? Math.round((s.completed||0)/s.total*100) : 0;

  const bg = data.bodyGoals;
  const latestW = (data.weeks||[]).flatMap(w=>(w.bodyData?.weight||[]).filter(v=>v!=null)).at(-1);
  let goalHtml = '';
  if (bg?.weight) {
    const curr = latestW ?? bg.weight.start;
    const rem  = (curr - bg.weight.goal).toFixed(1);
    goalHtml = `<div class="goal-row"><div class="goal-pill">체중 <span class="curr">${curr}kg</span> → ${bg.weight.goal}kg${rem>0?`<span class="rem"> -${rem}kg 남음</span>`:' ✓'}</div></div>`;
  }

  const header = `<div class="member-header">
    <div class="mh-top"><span class="mh-name">${data.name}</span><span class="mh-month">${data.month||''}</span><div class="mh-btns"><a class="mh-report-btn" href="report.html?token=${member.token}" target="_blank">리포트 →</a><a class="mh-trainer-btn" href="report.html?id=${member.id}" target="_blank">트레이너 →</a></div></div>
    ${goalHtml}
    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="progress-text">${s.completed||0} / ${s.total||0}회 진행</div>
    </div>
  </div>`;

  const weeks = (data.weeks||[]).slice().reverse();
  return `<div class="member-block" data-name="${data.name}">${header}${weeks.map(renderWeek).join('')}</div>`;
}

const RAW = `https://raw.githubusercontent.com/${GH_OWNER}/${GH_REPO}/main`;
const fetchData = url => fetch(`${url}?v=${Date.now()}`).then(r=>r.json());

fetchData(`${RAW}/data/members.json`)
  .then(members => Promise.all(
    members.map(m =>
      fetchData(`${RAW}/data/${m.id}.json`).then(data=>({member:m,data})).catch(()=>null)
    )
  ))
  .then(results => {
    document.getElementById('loading').style.display = 'none';
    const valid = results.filter(Boolean);
    document.getElementById('page-sub').textContent =
      `${valid.length}명 · ${new Date().toLocaleDateString('ko-KR',{month:'long',day:'numeric',hour:'2-digit',minute:'2-digit'})} 기준`;
    document.getElementById('log').innerHTML = valid
      .map(({member, data}) => renderMember(member, data)).join('');
    // ci 수신 배너 표시 + GitHub 자동저장
    if (window._ci) {
      const ci = window._ci;
      const memberName = valid.find(({member}) => member.id === ci.id)?.data?.name || ci.id;
      const parts = [];
      if (ci.c) parts.push(`컨디션 ${ci.c}`);
      if (ci.s) parts.push(`수면 ${ci.s}`);
      if (ci.p) parts.push(`신체 불편 ${ci.p}`);
      if (ci.n) parts.push(`영양 ${ci.n}`);
      if (ci.wm) parts.push(`운동: ${ci.wm.split('\n')[0]}`);
      const banner = document.getElementById('ci-banner');

      if (GH_TOKEN) {
        // GitHub 자동저장 시도
        banner.innerHTML = `⏳ ${memberName}님 체크인 저장 중...`;
        banner.style.display = 'block';
        saveCheckinToGitHub(ci).then(ok => {
          banner.innerHTML = ok
            ? `✅ ${memberName}님 체크인 저장 완료 · ${parts.join(' · ')}`
            : `⚠️ ${memberName}님 체크인 수신 (저장 실패 — 화면에는 표시) · ${parts.join(' · ')}`;
          // 새로고침 없이 URL만 정리 — 데이터는 이미 화면에 표시됨
          if (ok) history.pushState({}, '', location.pathname);
        });
      } else {
        // 토큰 없음 — 화면 표시만
        banner.innerHTML = `✅ ${memberName}님 체크인 수신 · ${parts.join(' · ')}`;
        banner.style.display = 'block';
      }

      // 해당 회원 섹션으로 스크롤
      setTimeout(() => {
        const block = document.querySelector(`[data-name="${memberName}"]`);
        if (block) block.scrollIntoView({behavior:'smooth', block:'start'});
      }, 300);
    }
  })
  .catch(() => { document.getElementById('loading').textContent = '불러오기 실패'; });

// PAT 설정 UI
if (!localStorage.getItem('hm_gh_pat')) {
  document.getElementById('pat-setup').style.display = 'block';
}
function savePat() {
  const v = document.getElementById('pat-input').value.trim();
  if (!v) return;
  localStorage.setItem('hm_gh_pat', v);
  location.reload();
}

function handleSearch(val) {
  const q = val.trim();
  document.getElementById('search-clear').style.display = q ? 'block' : 'none';
  const blocks = document.querySelectorAll('.member-block');
  const log = document.getElementById('log');
  if (!q) {
    blocks.forEach(b => { b.classList.remove('hidden'); log.prepend(b); });
    // 원래 순서 복원
    [...blocks].reverse().forEach(b => log.prepend(b));
    return;
  }
  const matched = [], rest = [];
  blocks.forEach(b => {
    const name = b.dataset.name || '';
    name.includes(q) ? matched.push(b) : rest.push(b);
  });
  matched.forEach(b => { b.classList.remove('hidden'); log.prepend(b); });
  rest.forEach(b => b.classList.add('hidden'));
}

function clearSearch() {
  const input = document.getElementById('search-input');
  input.value = '';
  handleSearch('');
  input.focus();
}
</script>
