<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HiMove — 세션 로그</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
  background: #eef2f8; color: #1a2a3a;
  max-width: 640px; margin: 0 auto; padding: 24px 16px 64px;
}
h1 { font-size: 20px; font-weight: 800; color: #1a2a40; letter-spacing: -0.8px; }
.page-sub { font-size: 11px; color: #a0b8d0; margin-top: 3px; margin-bottom: 14px; }
.search-wrap { position: relative; margin-bottom: 20px; }
.search-input {
  width: 100%; background: white; border: 1px solid rgba(160,190,230,0.4);
  border-radius: 12px; padding: 10px 16px 10px 38px;
  font-size: 14px; color: #1a2a40; outline: none; font-family: inherit;
}
.search-input:focus { border-color: #5aaae8; box-shadow: 0 0 0 3px rgba(90,170,232,0.1); }
.search-icon { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); font-size: 14px; color: #a0b8d0; pointer-events: none; }
.search-clear {
  position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
  font-size: 16px; color: #b0c8e0; cursor: pointer; display: none;
  background: none; border: none; line-height: 1;
}
.member-block.hidden { display: none; }

.member-block { background: white; border-radius: 16px; margin-bottom: 16px; overflow: hidden; border: 1px solid rgba(160,190,230,0.2); }

.member-header { padding: 14px 16px 12px; border-bottom: 1px solid rgba(160,190,230,0.15); }
.mh-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.mh-name { font-size: 15px; font-weight: 800; color: #1a2a40; }
.mh-month { font-size: 11px; color: #a0b8d0; }
.mh-report-btn { font-size: 10px; font-weight: 700; color: #5aaae8; background: rgba(90,170,232,0.09); border: 1px solid rgba(90,170,232,0.25); border-radius: 20px; padding: 3px 10px; text-decoration: none; white-space: nowrap; }
.goal-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
.goal-pill {
  font-size: 10px; color: #6a8aa8;
  background: rgba(100,150,210,0.07); border: 1px solid rgba(100,150,210,0.15);
  border-radius: 20px; padding: 3px 8px; display: flex; align-items: center; gap: 4px;
}
.goal-pill .curr { font-weight: 700; color: #2a4a6a; }
.goal-pill .rem  { color: #e06060; font-weight: 700; }
.progress-wrap { display: flex; align-items: center; gap: 8px; }
.progress-bar  { flex: 1; height: 5px; background: rgba(160,190,230,0.25); border-radius: 10px; overflow: hidden; }
.progress-fill { height: 100%; border-radius: 10px; background: linear-gradient(90deg, #5aaae8, #3a8fd4); }
.progress-text { font-size: 10px; font-weight: 700; color: #4a7ab0; white-space: nowrap; }

.week-row { padding: 10px 16px; border-bottom: 1px solid rgba(160,190,230,0.1); }
.week-row:last-child { border-bottom: none; }
.week-row.empty { opacity: 0.35; }

.wr-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
.wr-label { font-size: 11px; font-weight: 700; color: #3a5a80; min-width: 52px; }
.wr-date  { font-size: 10px; color: #b0c8e0; }
.badges { display: flex; gap: 4px; flex-wrap: wrap; }
.badge { font-size: 9px; font-weight: 700; border-radius: 5px; padding: 2px 6px; white-space: nowrap; }
.badge-pain { background: #fce4ec; color: #c62828; }
.badge-weight { font-size: 10px; font-weight: 700; color: #3a5a80; }

.s-badge { font-size: 9px; font-weight: 700; border-radius: 4px; padding: 2px 6px; }
.s-plan   { background: rgba(100,150,210,0.1); color: #4a7aa8; }
.s-actual { background: rgba(80,180,120,0.12); color: #2e7d52; }

.wr-detail { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; }

.wr-comment {
  font-size: 12px; color: #3a5a7a; line-height: 1.7;
  background: rgba(100,150,210,0.06); border-radius: 6px; padding: 6px 10px;
}

.wr-exercises { font-size: 11px; color: #6a8aaa; line-height: 1.8; }

.wr-memo {
  font-size: 11px; color: #6a4010; line-height: 1.7;
  background: rgba(220,160,60,0.08);
  border-left: 2px solid rgba(220,160,60,0.5);
  border-radius: 0 6px 6px 0; padding: 6px 10px;
}
.wr-memo-label { font-size: 9px; font-weight: 700; color: #b07030; margin-bottom: 3px; }

#loading { text-align: center; padding: 48px 0; color: #a0b8d0; font-size: 13px; }
</style>
</head>
<body>
<h1>himove</h1>
<div class="page-sub" id="page-sub">불러오는 중…</div>
<div class="search-wrap">
  <span class="search-icon">🔍</span>
  <input class="search-input" id="search-input" type="text" placeholder="회원 이름 검색…" oninput="handleSearch(this.value)">
  <button class="search-clear" id="search-clear" onclick="clearSearch()">✕</button>
</div>
<div id="loading">⋯</div>
<div id="log"></div>

<script>
const COND = {
  '매우 좋음':['#e8f5e9','#2e7d32'],'좋음':['#e8f5e9','#388e3c'],
  '보통':['#fff8e1','#f57c00'],'피곤함':['#fce4ec','#c62828'],
  '피로':['#fce4ec','#c62828'],'매우 피곤함':['#fce4ec','#b71c1c'],
};
const SLEEP = {
  '매우 좋음':['#e8f5e9','#2e7d32'],'좋음':['#e8f5e9','#388e3c'],
  '보통':['#fff8e1','#f57c00'],'나쁨':['#fce4ec','#c62828'],'매우 나쁨':['#fce4ec','#b71c1c'],
};
const STRESS = {
  '낮음':['#e8f5e9','#388e3c'],'보통':['#fff8e1','#f57c00'],
  '높음':['#fce4ec','#c62828'],'매우 높음':['#fce4ec','#b71c1c'],
};

function badge(label, val, map) {
  if (!val) return '';
  const [bg, color] = map[val] || ['#f0f4f8','#7a95b0'];
  return `<span class="badge" style="background:${bg};color:${color}">${label} ${val}</span>`;
}

function renderWeek(w) {
  const hasData = w.mainMessage || w.summary?.date || w.memberComment || w.sessionDates?.length;

  const days   = w.weeklyRoutine?.days || [];
  const lesson = days.filter(d => d.workout?.includes('레슨')).length;
  const self   = days.filter(d => !d.rest && d.workout && !['','-','휴식'].includes(d.workout) && !d.workout.includes('레슨')).length;
  const total  = lesson + self;
  const actual = w.sessionDates?.length || 0;

  const sessionBadges = [
    total  ? `<span class="s-badge s-plan">계획 ${total}회 (레슨 ${lesson}·자율 ${self})</span>` : '',
    actual ? `<span class="s-badge s-actual">✓ 실제 ${actual}회</span>` : '',
  ].filter(Boolean).join('');

  const bd = w.bodyData || {};
  const lastW = (bd.weight||[]).filter(v=>v!=null).at(-1);

  const badgeHtml = [
    badge('컨디션', w.condition, COND),
    badge('수면', w.sleep, SLEEP),
    badge('스트레스', w.stress, STRESS),
    (w.pain && w.pain !== '없음') ? `<span class="badge badge-pain">⚠ ${w.conditionNote||'통증'}</span>` : '',
    lastW ? `<span class="badge-weight">${lastW}kg</span>` : '',
  ].filter(Boolean).join('');

  const commentHtml = w.memberComment
    ? `<div class="wr-comment">💬 ${w.memberComment}</div>` : '';

  const items = (w.summary?.items||[]).map(it => `· ${it.name}　${it.detail}`).join('<br>');
  const exHtml = items ? `<div class="wr-exercises">${items}</div>` : '';

  const memoHtml = w.nextSessionMemo
    ? `<div class="wr-memo"><div class="wr-memo-label">📌 다음 수업 체크</div>${w.nextSessionMemo}</div>` : '';

  const hasDetail = commentHtml || exHtml || memoHtml;

  return `<div class="week-row${hasData ? '' : ' empty'}">
    <div class="wr-top">
      <span class="wr-label">${w.label}</span>
      <span class="wr-date">${w.date||''}</span>
      ${sessionBadges ? `<div class="badges">${sessionBadges}</div>` : ''}
    </div>
    ${badgeHtml ? `<div class="badges">${badgeHtml}</div>` : ''}
    ${hasDetail ? `<div class="wr-detail">${commentHtml}${exHtml}${memoHtml}</div>` : ''}
  </div>`;
}

function renderMember(member, data) {
  const s = data.sessions || {};
  const pct = s.total ? Math.round((s.completed||0)/s.total*100) : 0;

  const bg = data.bodyGoals;
  const latestW = (data.weeks||[]).flatMap(w=>(w.bodyData?.weight||[]).filter(v=>v!=null)).at(-1);
  let goalHtml = '';
  if (bg?.weight) {
    const curr = latestW ?? bg.weight.start;
    const rem  = (curr - bg.weight.goal).toFixed(1);
    goalHtml = `<div class="goal-row"><div class="goal-pill">체중 <span class="curr">${curr}kg</span> → ${bg.weight.goal}kg${rem>0?`<span class="rem"> -${rem}kg 남음</span>`:' ✓'}</div></div>`;
  }

  const header = `<div class="member-header">
    <div class="mh-top"><span class="mh-name">${data.name}</span><span class="mh-month">${data.month||''}</span><a class="mh-report-btn" href="report.html?token=${member.token}" target="_blank">리포트 →</a></div>
    ${goalHtml}
    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="progress-text">${s.completed||0} / ${s.total||0}회 진행</div>
    </div>
  </div>`;

  const weeks = (data.weeks||[]).slice().reverse();
  return `<div class="member-block" data-name="${data.name}">${header}${weeks.map(renderWeek).join('')}</div>`;
}

fetch(`data/members.json?v=${Date.now()}`)
  .then(r => r.json())
  .then(members => Promise.all(
    members.map(m =>
      fetch(`data/${m.id}.json?v=${Date.now()}`).then(r=>r.json()).then(data=>({member:m,data})).catch(()=>null)
    )
  ))
  .then(results => {
    document.getElementById('loading').style.display = 'none';
    const valid = results.filter(Boolean);
    document.getElementById('page-sub').textContent =
      `${valid.length}명 · ${new Date().toLocaleDateString('ko-KR',{month:'long',day:'numeric',hour:'2-digit',minute:'2-digit'})} 기준`;
    document.getElementById('log').innerHTML = valid
      .map(({member, data}) => renderMember(member, data)).join('');
  })
  .catch(() => { document.getElementById('loading').textContent = '불러오기 실패'; });
function handleSearch(val) {
  const q = val.trim();
  document.getElementById('search-clear').style.display = q ? 'block' : 'none';
  const blocks = document.querySelectorAll('.member-block');
  const log = document.getElementById('log');
  if (!q) {
    blocks.forEach(b => { b.classList.remove('hidden'); log.prepend(b); });
    // 원래 순서 복원
    [...blocks].reverse().forEach(b => log.prepend(b));
    return;
  }
  const matched = [], rest = [];
  blocks.forEach(b => {
    const name = b.dataset.name || '';
    name.includes(q) ? matched.push(b) : rest.push(b);
  });
  matched.forEach(b => { b.classList.remove('hidden'); log.prepend(b); });
  rest.forEach(b => b.classList.add('hidden'));
}

function clearSearch() {
  const input = document.getElementById('search-input');
  input.value = '';
  handleSearch('');
  input.focus();
}
</script>
</body>
</html>
