<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HiMove — 세션 로그</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
  background: #eef2f8; color: #1a2a3a;
  max-width: 640px; margin: 0 auto; padding: 28px 16px 64px;
}
h1 { font-size: 20px; font-weight: 800; color: #1a2a40; letter-spacing: -0.8px; }
.page-sub { font-size: 11px; color: #a0b8d0; margin-top: 3px; margin-bottom: 24px; }

.member-block { background: white; border-radius: 16px; margin-bottom: 16px; overflow: hidden; border: 1px solid rgba(160,190,230,0.2); }

.member-header {
  padding: 14px 16px 12px;
  border-bottom: 1px solid rgba(160,190,230,0.15);
}
.mh-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.mh-name { font-size: 15px; font-weight: 800; color: #1a2a40; }
.mh-month { font-size: 11px; color: #a0b8d0; }
.goal-row { display: flex; gap: 10px; flex-wrap: wrap; }
.goal-pill {
  font-size: 10px; color: #6a8aa8;
  background: rgba(100,150,210,0.07);
  border: 1px solid rgba(100,150,210,0.15);
  border-radius: 20px; padding: 3px 8px;
  display: flex; align-items: center; gap: 4px;
}
.goal-pill .curr { font-weight: 700; color: #2a4a6a; }
.goal-pill .arrow { color: #b0c8e0; }
.goal-pill .goal { font-weight: 700; color: #4a7aa8; }
.goal-pill .rem { color: #e06060; font-weight: 700; }

.week-row {
  padding: 8px 16px;
  border-bottom: 1px solid rgba(160,190,230,0.1);
}
.week-row:last-child { border-bottom: none; }
.week-row.empty { opacity: 0.35; }
.wr-main { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.wr-label { font-size: 11px; font-weight: 700; color: #3a5a80; min-width: 52px; }
.wr-date { font-size: 10px; color: #b0c8e0; min-width: 30px; }
.badges { display: flex; gap: 4px; flex-wrap: wrap; flex: 1; }
.badge {
  font-size: 9px; font-weight: 700; letter-spacing: 0.2px;
  border-radius: 5px; padding: 2px 5px; white-space: nowrap;
}
.badge-weight { font-size: 10px; font-weight: 700; color: #3a5a80; margin-left: auto; white-space: nowrap; }
.wr-detail { margin-top: 5px; display: flex; flex-direction: column; gap: 3px; padding-left: 2px; }
.wr-comment { font-size: 11px; color: #4a6a8a; background: rgba(100,150,210,0.06); border-radius: 5px; padding: 3px 7px; }
.wr-exercises { font-size: 10px; color: #7a9ab8; line-height: 1.6; }
.wr-memo {
  font-size: 10px; color: #7a6030;
  background: rgba(220,160,60,0.08); border-left: 2px solid rgba(220,160,60,0.4);
  border-radius: 0 5px 5px 0; padding: 3px 7px;
}

#loading { text-align: center; padding: 48px 0; color: #a0b8d0; font-size: 13px; }
</style>
</head>
<body>
<h1>himove</h1>
<div class="page-sub" id="page-sub">불러오는 중…</div>
<div id="loading">⋯</div>
<div id="log"></div>

<script>
const COND = {
  '매우 좋음': ['#e8f5e9','#2e7d32'], '좋음': ['#e8f5e9','#388e3c'],
  '보통': ['#fff8e1','#f57c00'], '피곤함': ['#fce4ec','#c62828'],
  '피로': ['#fce4ec','#c62828'], '매우 피곤함': ['#fce4ec','#b71c1c'],
};
const SLEEP = {
  '매우 좋음': ['#e8f5e9','#2e7d32'], '좋음': ['#e8f5e9','#388e3c'],
  '보통': ['#fff8e1','#f57c00'], '나쁨': ['#fce4ec','#c62828'],
  '매우 나쁨': ['#fce4ec','#b71c1c'],
};
const STRESS = {
  '낮음': ['#e8f5e9','#388e3c'], '보통': ['#fff8e1','#f57c00'],
  '높음': ['#fce4ec','#c62828'], '매우 높음': ['#fce4ec','#b71c1c'],
};

function badge(label, val, map) {
  if (!val) return '';
  const [bg, color] = map[val] || ['#f0f4f8', '#7a95b0'];
  return `<span class="badge" style="background:${bg};color:${color}">${label} ${val}</span>`;
}

function painBadge(pain, note) {
  if (!pain || pain === '없음') return '';
  const tip = note ? ` (${note})` : '';
  return `<span class="badge" style="background:#fce4ec;color:#c62828">⚠ 통증${tip}</span>`;
}

function goalRow(bodyGoals, currentWeight) {
  if (!bodyGoals) return '';
  const pills = [];
  const wg = bodyGoals.weight;
  if (wg) {
    const curr = currentWeight ?? wg.start;
    const rem = (curr - wg.goal).toFixed(1);
    pills.push(`<div class="goal-pill">체중 <span class="curr">${curr}kg</span><span class="arrow">→</span><span class="goal">${wg.goal}kg</span>${rem > 0 ? `<span class="rem">-${rem}kg 남음</span>` : '<span style="color:#388e3c;font-weight:700">달성!</span>'}</div>`);
  }
  const mg = bodyGoals.muscle;
  if (mg) {
    const diff = (mg.goal - mg.start).toFixed(1);
    pills.push(`<div class="goal-pill">골격근 목표 <span class="goal">${mg.goal}kg</span>${diff > 0 ? `<span class="rem">+${diff}kg</span>` : ''}</div>`);
  }
  return pills.length ? `<div class="goal-row">${pills.join('')}</div>` : '';
}

function renderWeek(w) {
  const hasData = w.condition || w.summary?.date || w.memberComment;
  const bd = w.bodyData || {};
  const lastW = (bd.weight || []).filter(v => v != null).at(-1);

  const mainBadges = [
    badge('컨디션', w.condition, COND),
    badge('수면', w.sleep, SLEEP),
    badge('스트레스', w.stress, STRESS),
    painBadge(w.pain, w.conditionNote),
    w.nutrition && w.nutrition !== '보통' ? badge('영양', w.nutrition, SLEEP) : '',
  ].filter(Boolean).join('');

  const weightHtml = lastW ? `<span class="badge-weight">${lastW}kg</span>` : '';

  const items = (w.summary?.items || []).map(it => it.name).join(' · ');
  const exHtml = items ? `<div class="wr-exercises">· ${items}</div>` : '';
  const commentHtml = w.memberComment ? `<div class="wr-comment">💬 ${w.memberComment}</div>` : '';
  const memoHtml = w.nextSessionMemo ? `<div class="wr-memo">📌 다음 수업: ${w.nextSessionMemo}</div>` : '';

  const hasDetail = commentHtml || exHtml || memoHtml;

  return `<div class="week-row${hasData ? '' : ' empty'}">
    <div class="wr-main">
      <span class="wr-label">${w.label}</span>
      <span class="wr-date">${w.date || ''}</span>
      <div class="badges">${mainBadges || (hasData ? '' : '<span style="font-size:10px;color:#c8d8e8">미입력</span>')}</div>
      ${weightHtml}
    </div>
    ${hasDetail ? `<div class="wr-detail">${commentHtml}${exHtml}${memoHtml}</div>` : ''}
  </div>`;
}

function renderMember(member, data) {
  const weeks = data.weeks || [];
  const latestW = weeks.flatMap(w => (w.bodyData?.weight || []).filter(v => v != null)).at(-1);
  const header = `<div class="member-header">
    <div class="mh-top">
      <span class="mh-name">${data.name}</span>
      <span class="mh-month">${data.month || ''}</span>
    </div>
    ${goalRow(data.bodyGoals, latestW)}
  </div>`;
  return `<div class="member-block">${header}${weeks.map(renderWeek).join('')}</div>`;
}

fetch(`data/members.json?v=${Date.now()}`)
  .then(r => r.json())
  .then(members => Promise.all(
    members.map(m =>
      fetch(`data/${m.id}.json?v=${Date.now()}`).then(r => r.json()).then(data => ({ member: m, data })).catch(() => null)
    )
  ))
  .then(results => {
    document.getElementById('loading').style.display = 'none';
    const valid = results.filter(Boolean);
    document.getElementById('page-sub').textContent =
      `${valid.length}명 · ${new Date().toLocaleDateString('ko-KR', { month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' })} 기준`;
    document.getElementById('log').innerHTML = valid
      .map(({ member, data }) => renderMember(member, data)).join('');
  })
  .catch(() => { document.getElementById('loading').textContent = '불러오기 실패'; });
</script>
</body>
</html>
