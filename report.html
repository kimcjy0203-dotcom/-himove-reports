<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HiMove 월간 리포트</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html { background: #e8f0fb; }
body {
  font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
  background: #f7faff; color: #1a1a2e;
  max-width: 430px; margin: 0 auto;
  padding: 40px 18px 72px; position: relative;
}
body > * { position: relative; z-index: 1; }

/* ── 로딩 ── */
#loading {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  height: 60vh; gap: 16px; color: #a0b8d0;
}
.spinner {
  width: 36px; height: 36px; border: 3px solid rgba(160,190,230,0.3);
  border-top-color: rgba(90,154,210,0.8); border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
#error-msg { display: none; text-align: center; padding: 60px 24px; color: #a0b8d0; font-size: 14px; line-height: 1.8; }

/* V2: 컴팩트 헤더 */
.header {
  background: linear-gradient(145deg, #ffffff 0%, #f0f6ff 100%);
  border-radius: 28px; padding: 26px 24px 22px; margin-bottom: 14px;
  border: 1px solid rgba(140,180,230,0.4);
  box-shadow: 0 4px 24px rgba(100,150,230,0.10);
}
.header h1 {
  font-size: 32px; font-weight: 800; letter-spacing: -1.5px;
  background: linear-gradient(135deg, #4a9ae0 0%, #2a7fc8 50%, #60bef0 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  margin-bottom: 2px; line-height: 1;
}
.header .subtitle { font-size: 12px; color: #a0b2c8; font-weight: 400; margin-bottom: 16px; }
.header .meta { display: flex; flex-wrap: wrap; gap: 6px; }
.header .meta span {
  background: rgba(100,155,220,0.08); border: 1px solid rgba(160,190,230,0.25);
  border-radius: 100px; padding: 4px 12px; font-size: 11px; color: #5a7a9a; font-weight: 600;
}
.card {
  background: #ffffff;
  border-radius: 28px; padding: 28px 24px; margin-bottom: 12px;
  border: 1px solid rgba(140,180,230,0.45);
  box-shadow: 0 4px 20px rgba(100,150,230,0.10);
}
.card:has(.card-title.gold) { background: #ffffff; border-color: rgba(140,180,230,0.5); }
.notice-banner {
  background: rgba(255,243,224,0.92); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(230,160,60,0.5); border-radius: 18px; padding: 14px 16px;
  margin-bottom: 12px; display: flex; align-items: flex-start; gap: 10px;
  box-shadow: 0 4px 16px rgba(230,140,30,0.1);
}
.notice-icon { font-size: 18px; flex-shrink: 0; line-height: 1.4; }
.notice-text { font-size: 13px; line-height: 1.7; color: #7a4a10; font-weight: 500; }
.card-title {
  font-size: 13px; font-weight: 700; letter-spacing: 0.5px; color: #7a95b8;
  margin-bottom: 18px; display: flex; align-items: center; justify-content: space-between;
}
.card-title.gold::after {
  content: '트레이너'; font-size: 9px; font-weight: 700; letter-spacing: 0.5px; color: #6a9ac4;
  background: rgba(100,160,220,0.1); border: 1px solid rgba(100,160,220,0.2);
  border-radius: 100px; padding: 2px 9px;
}
.msg {
  background: rgba(255,255,255,0.78); backdrop-filter: blur(32px); -webkit-backdrop-filter: blur(32px);
  border: 1px solid rgba(195,218,255,0.6); border-radius: 20px; padding: 16px 18px;
  font-size: 14px; line-height: 1.9; color: #2a3a50; white-space: pre-line; font-weight: 400;
  box-shadow: 0 4px 20px rgba(100,150,230,0.08), inset 0 1px 0 rgba(255,255,255,1);
}
.note { font-size: 13px; color: #a0b2c8; line-height: 1.8; white-space: pre-line; }
.sub-label { font-size: 10px; font-weight: 700; margin-bottom: 8px; letter-spacing: 1.5px; text-transform: uppercase; color: #b8c8da; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { padding: 0 0 10px; text-align: left; font-size: 10px; font-weight: 700; color: #c0ccd8; letter-spacing: 1.5px; text-transform: uppercase; border-bottom: 1px solid rgba(160,190,230,0.2); }
td { padding: 13px 0; border-bottom: 1px solid rgba(160,190,230,0.15); color: #2a3a50; vertical-align: top; line-height: 1.7; }
tr:last-child td { border-bottom: none; }
.check-row { display: flex; flex-wrap: nowrap; gap: 7px; margin-bottom: 14px; }
/* V2: 더 크고 탭하기 쉬운 칩 */
.chip { flex: 1; min-width: 0; text-align: center; background: rgba(255,255,255,0.6); border: 1px solid rgba(160,190,230,0.3); border-radius: 12px; padding: 7px 4px; font-size: 11px; color: #8aaccf; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: all 0.15s; -webkit-tap-highlight-color: transparent; }
.chip.on { background: rgba(90,140,220,0.14); border-color: rgba(90,140,220,0.5); color: #2a5a9a; font-weight: 800; box-shadow: 0 2px 8px rgba(90,140,220,0.15); }
.stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat-box { background: rgba(255,255,255,0.78); backdrop-filter: blur(32px); -webkit-backdrop-filter: blur(32px); border-radius: 22px; padding: 20px 10px; text-align: center; border: 1px solid rgba(195,218,255,0.6); box-shadow: 0 4px 20px rgba(100,150,230,0.10), inset 0 1px 0 rgba(255,255,255,1); }
.stat-box .lbl { font-size: 10px; color: #b0c0d4; margin-bottom: 6px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; }
.stat-box .val { font-size: 28px; font-weight: 700; color: #1a2a40; letter-spacing: -1.5px; line-height: 1; }
.stat-box .unt { font-size: 11px; color: #b0c0d4; margin-top: 4px; }
.delta-row { margin-top: 14px; display: flex; gap: 10px; flex-wrap: wrap; }
.delta-box { display: flex; flex-direction: column; background: rgba(255,255,255,0.55); border: 1px solid rgba(255,255,255,0.8); border-radius: 14px; padding: 10px 14px; flex: 1; min-width: 80px; text-align: center; }
.dlbl { font-size: 10px; color: #b0c0d4; font-weight: 700; letter-spacing: 0.5px; margin-bottom: 4px; }
.dval { font-size: 15px; font-weight: 700; color: #2a3a50; }
.dval.up { color: #e07070; } .dval.down { color: #5a9a7a; }
.rpt-feedback-card {
  background: #ffffff; border-radius: 22px; padding: 16px 20px; margin-bottom: 12px;
  border: 1px solid rgba(140,180,230,0.35); box-shadow: 0 2px 12px rgba(100,150,230,0.07);
}
.rpt-fb-top { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.rpt-fb-label { font-size: 10px; font-weight: 700; letter-spacing: 1px; color: #a0b8d0; text-transform: uppercase; }
.rpt-fb-date  { font-size: 10px; color: #b0c4d8; margin-left: auto; }
.rpt-fb-summary { font-size: 13px; color: #2a3a50; line-height: 1.75; margin-bottom: 8px; white-space: pre-line; }
.rpt-fb-note { font-size: 12px; color: #6a8aaa; line-height: 1.65; padding-left: 10px; border-left: 2px solid rgba(100,155,220,0.3); white-space: pre-line; }
.rpt-fb-empty { font-size: 12px; color: #c8d8e8; padding: 4px 0; }
.countdown-wrap { background: rgba(255,255,255,0.5); border: 1px solid rgba(255,255,255,0.8); border-radius: 16px; padding: 14px 16px; }
.countdown-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.countdown-label { font-size: 11px; font-weight: 700; letter-spacing: 1px; color: #a0b8d0; text-transform: uppercase; }
.countdown-days { font-size: 13px; font-weight: 700; color: #3a6a9a; }
.countdown-days.urgent { color: #d07070; }
.countdown-bar-bg { background: rgba(160,190,230,0.2); border-radius: 100px; height: 6px; overflow: hidden; }
.countdown-bar-fill { height: 100%; border-radius: 100px; background: linear-gradient(90deg, rgba(90,154,210,0.6), rgba(120,180,240,0.9)); }
.countdown-bar-fill.urgent { background: linear-gradient(90deg, rgba(210,120,110,0.6), rgba(230,150,140,0.9)); }
.countdown-sub { font-size: 11px; color: #b0c0d4; margin-top: 7px; }
.exercise-grid { display: flex; flex-direction: column; gap: 10px; }
.exercise-item { background: rgba(255,255,255,0.78); backdrop-filter: blur(32px); -webkit-backdrop-filter: blur(32px); border: 1px solid rgba(195,218,255,0.6); border-radius: 20px; padding: 16px 18px; box-shadow: 0 4px 20px rgba(100,150,230,0.10), inset 0 1px 0 rgba(255,255,255,1); }
.ei-name { font-size: 13px; font-weight: 800; color: #2a3a50; letter-spacing: -0.3px; margin-bottom: 6px; }
.ei-feedback { font-size: 13px; font-weight: 400; color: #6a80a0; line-height: 1.65; margin-bottom: 6px; }
.ei-next { font-size: 12px; font-weight: 400; color: #a0b8d0; }
.ei-next::before { content: '→  '; }
.lift-grid { display: flex; flex-direction: column; gap: 10px; }
.lift-box { background: rgba(255,255,255,0.78); backdrop-filter: blur(32px); -webkit-backdrop-filter: blur(32px); border: 1px solid rgba(195,218,255,0.6); border-radius: 20px; padding: 16px 18px; display: flex; align-items: center; gap: 14px; box-shadow: 0 4px 20px rgba(100,150,230,0.10), inset 0 1px 0 rgba(255,255,255,1); }
.lb-name { font-size: 11px; font-weight: 800; color: #2a3a50; flex-shrink: 0; white-space: nowrap; }
.lb-current { font-size: 24px; font-weight: 700; color: #1a2a40; letter-spacing: -1px; flex: 1; line-height: 1; }
.lb-current span { font-size: 12px; font-weight: 400; color: #b0c0d4; margin-left: 1px; }
.lb-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.lb-goal { font-size: 11px; color: #b0c0d4; }
.lb-gap { font-size: 12px; font-weight: 700; color: #6a9ac4; }
.lb-timer { font-size: 10px; font-weight: 700; border-radius: 6px; padding: 2px 6px; white-space: nowrap; margin-top: 2px; }
.lb-timer.ready  { background: rgba(80,180,100,0.12); color: #2e7d52; }
.lb-timer.soon   { background: rgba(255,160,50,0.12); color: #c06010; }
.lb-timer.waiting{ background: rgba(100,150,210,0.10); color: #5a7aa8; }
.weekly-cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-bottom: 14px; }
.cal-day { background: rgba(255,255,255,0.45); border: 1px solid rgba(160,190,230,0.3); border-radius: 14px; padding: 12px 4px 10px; text-align: center; cursor: pointer; user-select: none; }
.cd-weekday { font-size: 10px; font-weight: 700; color: #b0c0d4; letter-spacing: 0.5px; margin-bottom: 1px; }
.cd-date { font-size: 14px; font-weight: 800; color: #2a3a50; line-height: 1; margin-bottom: 3px; }
.cd-workout { font-size: 9px; color: #a0b8d0; font-weight: 600; margin-top: 2px; }
.cd-check { font-size: 12px; margin-top: 3px; color: #3a6a9a; opacity: 0; }
.cal-day.checked { background: rgba(100,155,220,0.14); border-color: rgba(100,155,220,0.45); }
.cal-day.checked .cd-weekday, .cal-day.checked .cd-workout, .cal-day.checked .cd-date { color: #3a6a9a; font-weight: 700; }
.cal-day.checked .cd-check { opacity: 1; }
.cal-day.rest-day { opacity: 0.5; cursor: default; }
.cal-day.today:not(.rest-day) { border-color: rgba(100,155,220,0.6); box-shadow: 0 0 0 2px rgba(100,155,220,0.25); }
.cal-day.today .cd-date { color: #3a7ad4; }
.reminder-bar { display:flex; align-items:center; gap:10px; background:rgba(100,155,220,0.1); border:1px solid rgba(100,155,220,0.3); border-radius:14px; padding:11px 14px; margin-bottom:14px; }
.reminder-bar-text { font-size:12px; color:#3a6a9a; font-weight:600; flex:1; }
.reminder-bar-btn { background:rgba(100,155,220,0.2); border:none; border-radius:10px; padding:6px 14px; font-size:12px; font-weight:700; color:#2a5a8a; cursor:pointer; white-space:nowrap; flex-shrink:0; }
.wk-count { font-size: 11px; font-weight: 600; color: #6a9ac4; background: rgba(100,155,220,0.1); border: 1px solid rgba(100,155,220,0.2); border-radius: 100px; padding: 2px 10px; }
.body-map-container { display: flex; gap: 6px; justify-content: center; margin-bottom: 4px; }
.body-map-wrap { display: flex; flex-direction: column; align-items: center; }
.body-map-svg { width: 100%; max-width: 58px; display: block; }
.body-map-lbl { font-size: 9px; font-weight: 700; letter-spacing: 1px; color: #b8c8da; text-align: center; margin-top: 4px; }
.plan-overlay { display:none; position:fixed; inset:0; background:rgba(30,50,80,0.25); backdrop-filter:blur(4px); z-index:300; align-items:center; justify-content:center; }
.plan-overlay.show { display:flex; }
.plan-popup { background:rgba(255,255,255,0.97); backdrop-filter:blur(32px); -webkit-backdrop-filter:blur(32px); border:1px solid rgba(195,218,255,0.8); border-radius:24px; padding:22px 22px 18px; box-shadow:0 16px 60px rgba(100,150,230,0.22); width:300px; max-width:90vw; position:relative; }
.plan-popup-title { font-size:15px; font-weight:800; color:#2a3a50; margin-bottom:4px; padding-right:24px; }
.plan-popup-sub { font-size:11px; color:#a0b8d0; margin-bottom:16px; font-weight:600; letter-spacing:0.3px; }
.plan-row { display:flex; align-items:center; justify-content:space-between; padding:9px 0; border-bottom:1px solid rgba(160,190,230,0.15); }
.plan-row:last-child { border-bottom:none; }
.plan-name { font-size:13px; font-weight:700; color:#2a3a50; }
.plan-detail { font-size:12px; color:#6a9ac4; font-weight:600; }
.plan-note { font-size:11px; color:#6a8aaa; line-height:1.65; padding:10px 12px; background:rgba(100,155,220,0.07); border-radius:10px; margin-bottom:14px; white-space:pre-line; }
.plan-check-btn { width:100%; margin-top:16px; padding:12px; border:none; border-radius:14px; font-size:13px; font-weight:800; cursor:pointer; transition:all 0.2s; background:rgba(100,155,220,0.12); color:#3a6a9a; }
.plan-check-btn.done { background:rgba(90,175,130,0.15); color:#3a8a6a; }
.routine-detail { margin-top:2px; }
.routine-day-block { margin-bottom:14px; padding:12px 14px; background:rgba(255,255,255,0.4); border:1px solid rgba(160,190,230,0.25); border-radius:14px; }
.routine-day-block:last-child { margin-bottom:0; }
.rdb-head { font-size:13px; font-weight:800; color:#3a6a9a; margin-bottom:2px; }
.plan-close { position:absolute; top:14px; right:16px; font-size:18px; color:#c0d0e0; cursor:pointer; background:none; border:none; line-height:1; }
.muscle-area { cursor: pointer; transition: filter 0.15s; }
.muscle-popup { position: fixed; background: rgba(255,255,255,0.97); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border: 1px solid rgba(195,218,255,0.8); border-radius: 18px; padding: 14px 16px 12px; box-shadow: 0 10px 40px rgba(100,150,230,0.2); z-index: 200; min-width: 160px; max-width: 200px; }
.popup-close { position: absolute; top: 9px; right: 13px; font-size: 17px; color: #b0c0d4; cursor: pointer; }
.popup-name { font-size: 13px; font-weight: 800; color: #2a3a50; margin-bottom: 8px; padding-right: 18px; }
.popup-exercises { font-size: 12px; color: #6a80a0; line-height: 1.9; }
.final-card { background: rgba(232,241,255,0.65); border: 1px solid rgba(180,210,250,0.55); border-radius: 28px; padding: 32px 26px; margin-bottom: 12px; box-shadow: 0 6px 36px rgba(100,150,230,0.10), inset 0 1px 0 rgba(255,255,255,0.9); }
.final-card > div:first-child { font-size: 10px; letter-spacing: 2px; color: #8aabcc; margin-bottom: 12px; font-weight: 700; }
.final-card > div:last-child { font-size: 16px; line-height: 1.85; font-weight: 500; color: #2a3a50; }
.footer { text-align: center; font-size: 11px; color: #b0c0d8; margin-top: 10px; padding-bottom: 20px; line-height: 2; letter-spacing: 0.5px; }
.mini-sum { font-size: 11px; color: #c0d0e0; margin-bottom: 6px; }
.mini-sum b { color: #7aaac8; font-weight: 700; margin-right: 8px; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: middle; margin-bottom: 1px; }
.tool-toggle { width:100%; background:none; border:none; cursor:pointer; display:flex; align-items:center; justify-content:space-between; padding:14px 18px; color:#7a95b8; font-size:12px; font-weight:700; letter-spacing:0.3px; }
.tool-toggle.open .tool-arrow { transform:rotate(180deg); }
.tool-arrow { font-size:10px; transition:transform 0.2s; display:inline-block; }
.tool-body { padding:0 18px 16px; }
.tool-body.hidden { display:none; }
.goal-bar-item { margin-bottom:12px; }
.goal-bar-item:last-child { margin-bottom:0; }
.goal-bar-label { display:flex; justify-content:space-between; font-size:11px; color:#8aaac8; margin-bottom:5px; font-weight:600; }
.goal-bar-pct { font-weight:800; color:#5a8ab0; }
.goal-bar-bg { background:rgba(160,190,230,0.18); border-radius:100px; height:6px; overflow:hidden; }
.goal-bar-fill { height:100%; border-radius:100px; transition:width 0.8s; }
.memo-badge { font-size:9px; font-weight:800; letter-spacing:1.2px; background:rgba(200,160,90,0.12); color:#b08840; border:1px solid rgba(200,160,90,0.25); border-radius:20px; padding:2px 8px; margin-left:8px; }
.purpose-grid { margin-top: 14px; display: flex; flex-wrap: nowrap; gap: 5px; }
.purpose-chip { flex: 1; min-width: 0; display: flex; align-items: center; gap: 5px; padding: 6px 8px; border-radius: 12px; font-size: 10px; font-weight: 700; color: #3a5a7a; background: #ffffff; border: 1px solid rgba(140,180,230,0.45); box-shadow: 0 2px 8px rgba(100,150,230,0.10); white-space: nowrap; overflow: hidden; }
.purpose-chip-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.purpose-chip-icon { font-size: 15px; line-height: 1; flex-shrink: 0; }
.goal-timeline { display: flex; flex-direction: column; gap: 7px; margin-top: 2px; }
.gt-item { display: flex; align-items: flex-start; gap: 8px; }
.gt-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; margin-top: 5px; }
.gt-card { flex: 1; min-width: 0; }
.gt-header { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; }
.gt-badge { font-size: 9px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; padding: 1px 6px; border-radius: 20px; flex-shrink: 0; }
.gt-period { font-size: 10px; color: #b0c4d8; margin-left: auto; flex-shrink: 0; }
.gt-text { font-size: 11px; font-weight: 500; color: #4a6a8a; line-height: 1.5; }
.gt-short .gt-dot  { background: rgba(76,175,80,0.85); }
.gt-short .gt-card { padding-left: 8px; border-left: 2px solid rgba(76,175,80,0.5); }
.gt-short .gt-badge{ background: rgba(76,175,80,0.12); color: #2e7d32; }
.gt-mid .gt-dot    { background: rgba(33,150,243,0.85); }
.gt-mid .gt-card   { padding-left: 8px; border-left: 2px solid rgba(33,150,243,0.5); }
.gt-mid .gt-badge  { background: rgba(33,150,243,0.10); color: #1565c0; }
.gt-long .gt-dot   { background: rgba(156,39,176,0.8); }
.gt-long .gt-card  { padding-left: 8px; border-left: 2px solid rgba(156,39,176,0.45); }
.gt-long .gt-badge { background: rgba(156,39,176,0.09); color: #6a1b9a; }
.diet-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.diet-badges { display: flex; gap: 6px; flex-wrap: wrap; }
.diet-badge { padding: 4px 11px; border-radius: 20px; font-size: 11px; font-weight: 700; white-space: nowrap; }
.diet-badge.kcal { background: rgba(90,154,210,0.12); color: #3a6a9a; }
.diet-badge.deficit { background: rgba(210,120,110,0.12); color: #c04a4a; }
.diet-badge.protein { background: rgba(90,175,130,0.12); color: #2e6a4a; }
.diet-meal { margin-bottom: 10px; border-radius: 14px; overflow: hidden; border: 1px solid rgba(160,190,230,0.2); }
.diet-meal-head { display: flex; justify-content: space-between; align-items: center; padding: 9px 14px; background: rgba(255,255,255,0.55); border-bottom: 1px solid rgba(160,190,230,0.15); }
.diet-meal-label { font-size: 13px; font-weight: 800; color: #2a3a50; }
.diet-meal-sub { font-size: 11px; color: #8aaac8; font-weight: 600; }
.diet-item-list { background: rgba(255,255,255,0.3); padding: 4px 14px; }
.diet-item { display: flex; align-items: center; gap: 6px; padding: 6px 0; border-bottom: 1px solid rgba(160,190,230,0.1); }
.diet-item:last-child { border-bottom: none; }

/* ════════════════════════════════
   데이터 로드
════════════════════════════════ */
const params   = new URLSearchParams(window.location.search);
const isMember = params.get('mode') === 'member' || !!params.get('token');

let currentMemberId = null;
function loadMember(memberId) {
  currentMemberId = memberId;
  fetch(`data/${memberId}.json?v=${Date.now()}`)
    .then(r => { if (!r.ok) throw new Error(); return r.json(); })
    .then(data => {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      document.title = `HiMove — ${data.name}`;
      init(data);
    })
    .catch(() => {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('error-msg').style.display = 'block';
    });
}

const directId = params.get('id');
const token    = params.get('token');

if (directId) {
  loadMember(directId);
} else if (token) {
  Promise.all([
    fetch(`data/members.json?v=${Date.now()}`).then(r => r.ok ? r.json() : []).catch(() => []),
    fetch(`data/ot-members.json?v=${Date.now()}`).then(r => r.ok ? r.json() : []).catch(() => []),
  ])
    .then(([members, otMembers]) => {
      const member = [...members, ...otMembers].find(m => m.token === token);
      if (!member) throw new Error();
      loadMember(member.id);
    })
    .catch(() => {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('error-msg').style.display = 'block';
    });
} else {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('error-msg').style.display = 'block';
}

/* ════════════════════════════════
   초기화
════════════════════════════════ */
function init(data) {
  const { name, month, purposes, goals, cardio, orm, weeks, nutritionPlan, hideLesson, isOT } = data;

  if (isMember) {
    document.querySelectorAll('.trainer-only').forEach(el => el.style.display = 'none');
    document.getElementById('report-subtitle').textContent = `${name} 리포트`;
  }

  /* 헤더 */
  if (!isMember) document.getElementById('report-subtitle').textContent = `${name} 월간 리포트`;

  /* 공지 배너 */
  const noticeEl = document.getElementById('notice-section');
  if (data.notice) {
    noticeEl.innerHTML = `<div class="notice-banner"><span class="notice-icon">📢</span><span class="notice-text">${data.notice}</span></div>`;
  }

  /* 이번 달 누적 운동 횟수 (sessionDates + 캘린더 체크, 날짜 중복 제거) */
  function calcMonthlyCount() {
    const now = new Date();
    const cy = now.getFullYear(), cm = now.getMonth();
    const allDates = new Set();
    weeks.forEach((w, idx) => {
      // 트레이너 기록
      (w.sessionDates || []).forEach(d => {
        const dt = new Date(d);
        if (dt.getFullYear() === cy && dt.getMonth() === cm) allDates.add(d);
      });
      // 회원 캘린더 체크 (날짜로 deduplicate)
      const r = w.weeklyRoutine;
      if (!r?.weekKey || !w.date?.includes('/')) return;
      const [mm, dd] = w.date.split('/').map(Number);
      const weekStart = new Date(cy, mm - 1, dd);
      const checked = JSON.parse(localStorage.getItem(`hm_${r.weekKey}_${idx}`) || '[]');
      checked.forEach(di => {
        if (r.days?.[di]?.rest) return;
        const dayDate = new Date(weekStart.getTime() + di * 86400000);
        if (dayDate.getFullYear() === cy && dayDate.getMonth() === cm)
          allDates.add(dayDate.toISOString().slice(0, 10));
      });
    });
    return allDates.size;
  }
  function refreshMonthlyCount() {
    const cnt = calcMonthlyCount();
    const pct = monthGoal > 0 ? Math.min(Math.round((cnt / monthGoal) * 100), 100) : 0;
    const numEl = document.querySelector('#monthly-progress .month-num');
    const barEl = document.querySelector('#monthly-progress .month-bar');
    const pctEl = document.querySelector('#monthly-progress .month-pct');
    if (numEl) numEl.textContent = cnt;
    if (barEl) barEl.style.width = pct + '%';
    if (pctEl) pctEl.textContent = pct + '% 달성';
  }
  const monthCount = calcMonthlyCount();
  const monthLabel = new Date().toLocaleDateString('ko-KR', {month: 'long'});
  document.getElementById('report-meta').innerHTML = `<span>${month}</span><span>${name}</span>`;

  /* 이번 달 목표 횟수 (weeklyRoutine 비휴식일 합산) */
  const monthGoal = weeks.reduce((sum, w) => sum + (w.weeklyRoutine?.days||[]).filter(d=>!d.rest).length, 0);
  const pct = monthGoal > 0 ? Math.min(Math.round((monthCount / monthGoal) * 100), 100) : 0;
  const progressEl = document.getElementById('monthly-progress');
  if (progressEl && monthGoal > 0) {
    progressEl.innerHTML = `
      <div style="margin-top:18px;padding-top:16px;border-top:1px solid rgba(160,190,230,0.2)">
        <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px">
          <span style="font-size:12px;font-weight:700;color:#7a95b8;letter-spacing:0.3px">${monthLabel} 운동</span>
          <span style="font-size:18px;font-weight:800;color:#1a2a40;letter-spacing:-0.5px"><span class="month-num">${monthCount}</span><span style="font-size:11px;font-weight:500;color:#b0c0d4;margin-left:3px">/ ${monthGoal}회</span></span>
        </div>
        <div style="background:rgba(160,190,230,0.18);border-radius:100px;height:7px;overflow:hidden">
          <div class="month-bar" style="height:100%;border-radius:100px;background:linear-gradient(90deg,rgba(90,154,210,0.75),rgba(120,190,245,0.95));width:${pct}%;transition:width 1s ease"></div>
        </div>
        <div class="month-pct" style="font-size:10px;color:#b0c0d4;margin-top:5px;text-align:right;font-weight:600">${pct}% 달성</div>
      </div>`;
  }

  const pgEl = document.getElementById('purpose-grid');
  if (purposes && purposes.length) {
    pgEl.innerHTML = purposes.map(label => {
      const m = PURPOSE_META[label] || { bg: 'rgba(240,240,240,0.85)', color: '#555', icon: '•' };
      return `<div class="purpose-chip"><span class="purpose-chip-dot" style="background:${m.color}"></span><span>${label}</span></div>`;
    }).join('');
  } else { pgEl.style.display = 'none'; }

  const goalsCard = document.getElementById('goals-card');
  const goalItems = [
    { key: 'short', badge: '단기', label: '단기 목표', cls: 'gt-short' },
    { key: 'mid',   badge: '중기', label: '중기 목표', cls: 'gt-mid'   },
    { key: 'long',  badge: '장기', label: '장기 목표', cls: 'gt-long'  }
  ];
  const timeline = goalItems.map(it => {
    const d = goals[it.key]; if (!d || !d.text) return '';
    return `<div class="gt-item ${it.cls}"><div class="gt-dot"></div><div class="gt-card"><div class="gt-header"><span class="gt-badge">${it.badge}</span><span style="font-size:11px;font-weight:700;color:#4a6a8a">${it.label}</span>${d.period ? `<span class="gt-period">${d.period}</span>` : ''}</div><div class="gt-text">${d.text}</div></div></div>`;
  }).join('');

  /* ── D-day 칩을 헤더 이름 옆에 (매월 2째·4째 수요일) ── */
  (function injectDdayChip() {
    const today = new Date(); today.setHours(0,0,0,0);
    function getNthWeekday(y, m, wd, nth) {
      const fd = new Date(y, m, 1).getDay();
      let diff = wd - fd; if (diff < 0) diff += 7;
      return new Date(y, m, 1 + diff + (nth-1)*7);
    }
    function nextFixed(from) {
      let y = from.getFullYear(), mo = from.getMonth();
      for (let i = 0; i < 6; i++) {
        const ry = y + Math.floor(mo/12), rm = mo % 12;
        for (const nth of [2,4]) {
          const d = getNthWeekday(ry, rm, 3, nth); d.setHours(0,0,0,0);
          if (d >= from) return d;
        }
        mo++;
      }
      return null;
    }
    const nd = nextFixed(today);
    if (!nd) return;
    const dd = Math.round((nd - today) / 86400000);
    const ddTxt = dd === 0 ? 'D-Day' : `D-${dd}`;
    const color  = dd === 0 ? '#e06020' : dd <= 3 ? '#c85030' : dd <= 7 ? '#5a9ad0' : '#a0b8d0';
    const bg     = dd <= 3 ? 'rgba(230,100,80,0.08)' : 'rgba(100,155,220,0.08)';
    const border = dd <= 3 ? 'rgba(220,120,90,0.28)' : 'rgba(100,155,220,0.25)';
    const chip = `<span style="font-size:11px;font-weight:700;padding:4px 11px;border-radius:20px;background:${bg};border:1px solid ${border};color:${color}">인바디 ${ddTxt}</span>`;
    const metaEl = document.getElementById('report-meta');
    if (metaEl) metaEl.insertAdjacentHTML('beforeend', chip);
    /* nextConsult 도 있으면 추가 */
    if (data.nextConsult) {
      const ct = new Date(data.nextConsult); ct.setHours(0,0,0,0);
      const cd = Math.round((ct - today) / 86400000);
      const ctTxt = cd === 0 ? 'D-Day' : cd < 0 ? `D+${Math.abs(cd)}` : `D-${cd}`;
      const cc = cd < 0 ? '#c05040' : cd <= 3 ? '#c85030' : '#6a8aaa';
      if (metaEl) metaEl.insertAdjacentHTML('beforeend',
        `<span style="font-size:11px;font-weight:700;padding:4px 11px;border-radius:20px;background:rgba(100,130,220,0.08);border:1px solid rgba(100,130,220,0.22);color:${cc}">상담 ${ctTxt}</span>`);
    }
  })();

  function buildCountdown(lastMeasured) {
    if (!lastMeasured) return '';
    const last = new Date(lastMeasured), next = new Date(last);
    next.setDate(next.getDate() + 14);
    const today = new Date(); today.setHours(0,0,0,0);
    const daysLeft = Math.ceil((next - today) / 86400000);
    const pct = Math.min(Math.round(((14 - Math.max(daysLeft, 0)) / 14) * 100), 100);
    const isUrgent = daysLeft <= 3;
    return `<div class="countdown-wrap"><div class="countdown-top"><span class="countdown-label">다음 인바디 측정</span><span class="countdown-days${isUrgent ? ' urgent' : ''}">${daysLeft <= 0 ? '측정이 필요해요' : `${daysLeft}일 남음`}</span></div><div class="countdown-bar-bg"><div class="countdown-bar-fill${isUrgent ? ' urgent' : ''}" style="width:${pct}%"></div></div><div class="countdown-sub">2주 주기 &nbsp;·&nbsp; 다음 예정: ${next.toLocaleDateString('ko-KR', { month: 'long', day: 'numeric' })}</div></div>`;
  }

  function miniSum(key, opts) {
    const cnt = {};
    opts.forEach(o => cnt[o] = 0);
    weeks.forEach(wk => {
      if ((wk.mainMessage || wk.sessionDates?.length) && wk[key])
        cnt[wk[key]] = (cnt[wk[key]] || 0) + 1;
    });
    const parts = opts.filter(o => cnt[o] > 0).map(o => `<b>${o} ${cnt[o]}</b>`).join('');
    return parts ? `<div class="mini-sum">${parts}</div>` : '';
  }

  function initDailyStatus(idx) {
    const sec = document.getElementById(`ds-${idx}`);
    if (!sec) return;
    const sk    = `daily-status-${currentMemberId}-${todayKey}-${idx}`;
    const wk    = `hm-week-${weeks[idx]?.weeklyRoutine?.weekKey || idx}`;
    const wmKey = `hm-wmemo-${weeks[idx]?.weeklyRoutine?.weekKey || idx}`;
    const saved    = JSON.parse(localStorage.getItem(sk) || '{}');
    const weekData = JSON.parse(localStorage.getItem(wk) || '{}');

    function getCounts(field) {
      const cnt = {};
      const wd = JSON.parse(localStorage.getItem(wk) || '{}');
      Object.values(wd).forEach(day => {
        if (day[field]) cnt[day[field]] = (cnt[day[field]] || 0) + 1;
      });
      return cnt;
    }
    function renderCounts(field) {
      const el = sec.querySelector(`.day-count[data-field="${field}"]`);
      if (!el) return;
      const cnt = getCounts(field);
      const parts = Object.entries(cnt).map(([k,v]) => `<b>${k} ${v}</b>`).join('');
      el.innerHTML = parts ? `<div class="mini-sum">${parts}</div>` : '';
    }
    ['condition','sleep','pain','nutrition'].forEach(renderCounts);

    sec.querySelectorAll('.daily-chip').forEach(chip => {
      chip.classList.toggle('on', saved[chip.dataset.field] === chip.dataset.value);
      chip.onclick = () => {
        const f = chip.dataset.field, v = chip.dataset.value;
        const cur = JSON.parse(localStorage.getItem(sk) || '{}');
        cur[f] = cur[f] === v ? null : v;
        localStorage.setItem(sk, JSON.stringify(cur));
        sec.querySelectorAll(`.daily-chip[data-field="${f}"]`).forEach(c =>
          c.classList.toggle('on', c.dataset.value === cur[f])
        );
        const wd = JSON.parse(localStorage.getItem(wk) || '{}');
        if (!wd[todayKey]) wd[todayKey] = {};
        if (cur[f]) wd[todayKey][f] = cur[f];
        else delete wd[todayKey][f];
        localStorage.setItem(wk, JSON.stringify(wd));
        renderCounts(f);
      };
    });
    sec.querySelectorAll('.daily-note').forEach(ta => {
      const f = ta.dataset.note;
      ta.value = saved[f] || '';
      ta.addEventListener('input', () => {
        const cur = JSON.parse(localStorage.getItem(sk) || '{}');
        cur[f] = ta.value;
        localStorage.setItem(sk, JSON.stringify(cur));
        // 주간 키에도 메모 저장 → 세션 로그 반영
        const wd = JSON.parse(localStorage.getItem(wk) || '{}');
        if (!wd[todayKey]) wd[todayKey] = {};
        if (ta.value.trim()) wd[todayKey][f] = ta.value.trim();
        else delete wd[todayKey][f];
        localStorage.setItem(wk, JSON.stringify(wd));
      });
    });

    // 개인 운동 메모 (주간 누적)
    const wmoEl = sec.querySelector(`#wmemo-${idx}`);

    // 전송 버튼
    const sendBtn = sec.querySelector('.send-btn');
    if (sendBtn) sendBtn.onclick = () => {
      const cur = JSON.parse(localStorage.getItem(sk) || '{}');
      const wd  = JSON.parse(localStorage.getItem(wk) || '{}');
      const today = wd[todayKey] || {};
      const LABELS = {condition:'컨디션', sleep:'수면', pain:'신체 불편', nutrition:'영양 상태',
                      condition_note:'', sleep_note:'', pain_note:'', nutrition_note:''};
      const lines = [];
      if (cur.condition) lines.push(`컨디션: ${cur.condition}${today.condition_note ? ' — ' + today.condition_note : ''}`);
      if (cur.sleep)     lines.push(`수면: ${cur.sleep}${today.sleep_note ? ' — ' + today.sleep_note : ''}`);
      if (cur.pain)      lines.push(`신체 불편: ${cur.pain}${today.pain_note ? ' — ' + today.pain_note : ''}`);
      if (cur.nutrition) lines.push(`영양: ${cur.nutrition}${today.nutrition_note ? ' — ' + today.nutrition_note : ''}`);
      // 이번 주 운동 완료 기록 읽기
      const weekKey  = weeks[idx]?.weeklyRoutine?.weekKey;
      const calKey   = `hm_${weekKey}_${idx}`;
      const calDays  = weeks[idx]?.weeklyRoutine?.days || [];
      const checked  = JSON.parse(localStorage.getItem(calKey) || '[]');
      const doneList = checked
        .map(di => calDays[di])
        .filter(d => d && !d.rest)
        .map(d => d.day);
      if (doneList.length) lines.push(`운동 완료: ${doneList.join(' · ')}`);
      const wmText = (localStorage.getItem(wmKey) || '').trim();
      if (wmText) lines.push(`개인 운동 메모:\n${wmText}`);

      if (!lines.length) { alert('먼저 오늘 상태를 체크해주세요!'); return; }
      // 세션 로그 자동 업데이트 링크 생성
      const ciData = {

      const base    = window.location.href.split('?')[0].replace(/[^/]*$/, '');

      if (navigator.share) {

        navigator.clipboard?.writeText(text).then(() => alert('클립보드에 복사됐어요! 카카오톡에 붙여넣기 해주세요.'));

    }).join(HR3);
    return `<div style="margin-bottom:14px;padding:12px 14px;background:rgba(90,160,120,0.08);border-radius:12px;border:1px solid rgba(90,160,120,0.2)">

      </div>
      <div style="font-size:10px;color:#b0c8b8">기초대사량 ${plan.bmr} kcal + 활동 에너지 + 증량 여유분 (+${plan.targetCalories - plan.bmr} kcal)</div>
      ${plan.muscleGainGoal ? `<div style="margin-top:6px;font-size:10px;color:#8ab8a0">🎯 목표: 근육 +${plan.muscleGainGoal}kg · 지방 +${plan.fatGainGoal}kg</div>` : ''}

    </div>`;
  }

  function _buildSumItems(sumList) {
    return sumList.map((sess,si)=>`<div style="font-size:11px;color:#a0b8d0;font-weight:600;margin:${si>0?'16px':'0'} 0 8px">${sess.date}</div><div style="display:flex;flex-direction:column;gap:5px">${(sess.items||[]).map(it=>`<div style="padding:7px 11px;background:rgba(255,255,255,0.55);border-radius:10px;border:1px solid rgba(160,190,230,0.2)"><div style="font-size:13px;font-weight:700;color:#2a3a50">${it.name}</div>${it.detail?`<div style="font-size:11px;color:#8aaac8;font-weight:500;margin-top:2px">${it.detail}</div>`:''}</div>`).join('')}</div>`).join('');
  }

  window._gToggle = function(type, idx) {
    ['train','card'].forEach(t => {
      const el = document.getElementById('gd-'+t+'-'+idx);
      const btn = document.getElementById('gb-'+t+'-'+idx);
      if (!el || !btn) return;
      if (t === type) {
        const hidden = el.style.display === 'none';
        el.style.display = hidden ? 'block' : 'none';
        btn.classList.toggle('open', hidden);
      } else {
        el.style.display = 'none';
        btn.classList.remove('open');
      }
    });
  };

  function buildDietCard() {
    const dp = data.dietPlan;

    const mealsHtml = (dp.meals || []).map(m => `<div class="diet-meal"><div class="diet-meal-head"><span class="diet-meal-label">${m.label}</span><span class="diet-meal-sub">${m.kcal} kcal &nbsp;·&nbsp; 단백질 ${m.protein}g</span></div><div class="diet-item-list">${(m.items || []).map(it => `<div class="diet-item"><span class="diet-item-name">${it.name}</span><span class="diet-item-amount">${it.amount}</span><span class="diet-item-kcal">${it.kcal}</span></div>`).join('')}</div></div>`).join('');
    return `<div class="card"><div class="card-title blue">식단표</div><div class="diet-header"><div class="diet-badges"><span class="diet-badge kcal">하루 ${dp.targetKcal} kcal</span><span class="diet-badge deficit">목표 적자 ${dp.deficit} kcal</span><span class="diet-badge protein">단백질 ${totalProtein}g</span></div></div>${mealsHtml}${dp.note ? `<div class="diet-note">${dp.note}</div>` : ''}</div>`;
  }

  function buildPanel(w, idx) {
    const hasRoutine = w.weeklyRoutine?.days?.some(d => d.plan?.length);
    if (false) return `<div class="week-panel" data-idx="${idx}"><div class="week-empty"><div class="we-num">${w.week}주차</div><div class="we-msg">아직 입력 전입니다.<br>수업 후 트레이너가 업데이트해요.</div></div>${collapsible('운동 처방 가이드', 'blue', '<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px"><span style="font-size:11px;color:#a0b8d0;white-space:nowrap">기준 중량 (1RM)</span><input id="train-kg-'+idx+'" type="number" min="1" max="500" value="60" style="width:52px;background:rgba(255,255,255,0.6);border:1px solid rgba(160,190,230,0.4);border-radius:8px;padding:4px 6px;font-size:13px;font-weight:700;color:#2a3a50;text-align:center;outline:none;font-family:inherit"><span style="font-size:11px;color:#a0b8d0">kg</span></div><div style="display:flex;align-items:center;gap:5px;margin-bottom:10px;padding:6px 8px;background:rgba(255,255,255,0.35);border-radius:8px;border:1px solid rgba(160,190,230,0.2)"><span style="font-size:10px;color:#b0c8e0;white-space:nowrap">1RM 모를 때</span><input id="est-w-'+idx+'" type="number" min="1" max="400" placeholder="무게" style="width:46px;background:rgba(255,255,255,0.6);border:1px solid rgba(160,190,230,0.3);border-radius:6px;padding:3px 4px;font-size:11px;font-weight:600;color:#2a3a50;text-align:center;outline:none;font-family:inherit"><span style="font-size:10px;color:#c0d0e0">kg</span><input id="est-r-'+idx+'" type="number" min="1" max="30" placeholder="횟수" style="width:38px;background:rgba(255,255,255,0.6);border:1px solid rgba(160,190,230,0.3);border-radius:6px;padding:3px 4px;font-size:11px;font-weight:600;color:#2a3a50;text-align:center;outline:none;font-family:inherit"><span style="font-size:10px;color:#c0d0e0">회</span><span style="font-size:10px;color:#c0d0e0">→</span><span id="est-result-'+idx+'" style="font-size:11px;font-weight:700;color:#5a8ab8;min-width:28px">—</span><span style="font-size:10px;color:#c0d0e0">kg</span></div><div id="train-table-'+idx+'"></div>')}${collapsible('유산소 강도 가이드', 'blue', '<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px"><span style="font-size:11px;color:#a0b8d0;white-space:nowrap">오늘 안정시 심박수</span><input id="card-rhr-'+idx+'" type="number" min="40" max="120" style="width:52px;background:rgba(255,255,255,0.6);border:1px solid rgba(160,190,230,0.4);border-radius:8px;padding:4px 6px;font-size:13px;font-weight:700;color:#2a3a50;text-align:center;outline:none;font-family:inherit"><span style="font-size:11px;color:#a0b8d0">bpm</span></div><div id="card-formula-'+idx+'" style="font-size:10px;color:#c0d0e0;margin-bottom:8px;padding:0 2px"></div><div id="card-zones-'+idx+'" style="display:flex;flex-direction:column;gap:5px"></div>')}</div>`;
    const bd = w.bodyData || {weight:[],fat:[],muscle:[],labels:[],lastMeasured:null,comment:''};
    const lW = bd.weight.filter(v=>v!=null).at(-1), lF = bd.fat.filter(v=>v!=null).at(-1), lM = bd.muscle.filter(v=>v!=null).at(-1);
    const pW = bd.weight.filter(v=>v!=null).at(-2)??null, pF = bd.fat.filter(v=>v!=null).at(-2)??null, pM = bd.muscle.filter(v=>v!=null).at(-2)??null;
    function dl(c,p){ if(c==null||p==null) return{text:'—',cls:''}; const d=(c-p).toFixed(1); return{text:(d>0?'+':'')+d+' kg',cls:d>0?'up':d<0?'down':''}; }
    const dW=dl(lW,pW), dF=dl(lF,pF), dM=dl(lM,pM);
    function chips(opts,active){ return opts.map(o=>`<div class="chip${o===active?' on':''}">${o}</div>`).join(''); }
    const allSummaries = w.summaries || (w.summary ? [w.summary] : []);
    const summaryItems = allSummaries.length ? _buildSumItems(allSummaries) : '<div style="font-size:13px;color:#c0d0e0;padding:8px 0">수업 후 트레이너가 입력합니다.</div>';
    const exMap = {}; (w.exercises||[]).forEach(e => { exMap[e.name] = e; });
    const exBase = allSummaries.flatMap(s=>(s.items||[]).map(it=>it.name));
    const exAll = exBase.length ? exBase : (w.exercises||[]).map(e=>e.name);
    const exItems = exAll.map(name => { const fb = exMap[name]; return `<div class="exercise-item"><div class="ei-name">${name}</div>${fb ? `<div class="ei-feedback">${fb.note}</div>${fb.next?`<div class="ei-next">${fb.next}</div>`:''}` : `<div class="ei-feedback" style="color:#c8d8e8;font-style:italic">피드백 작성 전</div>`}</div>`; }).join('') || '<div class="exercise-item"><div class="ei-name">—</div><div class="ei-feedback">수업 내용을 입력해 주세요.</div></div>';
    function liftTimer(l) {

      const today = new Date(); today.setHours(0,0,0,0);
      const diff = Math.round((next - today) / 86400000);
      if (diff <= 0) return `<div class="lb-timer ready">증량 타이밍! 🔥</div>`;
      if (diff <= 7) return `<div class="lb-timer soon">D-${diff} 증량 예정</div>`;

      `<div class="routine-day-block"><div class="rdb-head">${d.day} · ${d.workout||''}</div>${d.note?`<div class="plan-note" style="margin-top:6px">${d.note}</div>`:''}<div style="margin-top:${d.note?'2px':'8px'}">${d.plan.map(p=>`<div class="plan-row"><span class="plan-name">${p.name}</span><span class="plan-detail">${p.sets}세트 × ${p.reps}회${p.weight&&p.weight!=='-'?' / '+p.weight:''}</span></div>`).join('')}</div></div>`
    ).join('');
    const calKey = `hm_${r.weekKey}_${idx}`;
    const today = new Date(); today.setHours(0,0,0,0);
    function parseWeekStart(dateStr) {
      if (!dateStr || !dateStr.includes('/')) return null;

      const yr = today.getFullYear();
      const dt = new Date(yr, m-1, d);
      if (dt < new Date(yr, 0, 1)) dt.setFullYear(yr+1);
      return dt;
    }
    const weekStart = parseWeekStart(w.date);
    const calDays = r.days.map((d,i) => {
      const dayDate = weekStart ? new Date(weekStart.getTime() + i*86400000) : null;
      const dateNum = dayDate ? dayDate.getDate() : '';

      ${isOT ? '' : collapsible('📋 이번 주 상태', 'blue', `<div id="ds-${idx}"><div style="font-size:11px;color:#a0b8d0;font-weight:600;margin-bottom:6px">📅 ${new Date().toLocaleDateString('ko-KR',{month:'long',day:'numeric'})} 기준 · 이번 주 누적</div><div class="sub-label"><span class="dot" style="background:#f4a07e"></span>컨디션</div><div class="day-count" data-field="condition"></div><div class="check-row">${dailyChips('condition',['매우 좋음','좋음','보통','피곤함','매우 피곤함'])}</div><textarea class="daily-note" data-note="condition_note" placeholder="메모..." rows="1"></textarea>${HRS}<div class="sub-label"><span class="dot" style="background:#a78bde"></span>수면</div><div class="day-count" data-field="sleep"></div><div class="check-row">${dailyChips('sleep',['매우 나쁨','나쁨','보통','좋음','매우 좋음'])}</div><textarea class="daily-note" data-note="sleep_note" placeholder="메모..." rows="1"></textarea>${HRS}<div class="sub-label"><span class="dot" style="background:#6dc99c"></span>신체 불편</div><div class="day-count" data-field="pain"></div><div class="check-row">${dailyChips('pain',['없음','있음'])}</div><textarea class="daily-note" data-note="pain_note" placeholder="메모..." rows="1"></textarea>${HRS}<div class="sub-label"><span class="dot" style="background:#f0c96a"></span>영양 상태</div><div class="day-count" data-field="nutrition"></div><div class="check-row">${dailyChips('nutrition',['매우 나쁨','나쁨','보통','좋음','매우 좋음'])}</div><textarea class="daily-note" data-note="nutrition_note" placeholder="메모..." rows="1"></textarea>${HRS}<div class="sub-label" style="margin-bottom:4px">✏️ 개인 운동 메모</div><div style="font-size:11px;color:#a0b8d0;margin-bottom:8px">홈트·자유 운동 내용 — 주간 누적 기록</div><textarea id="wmemo-${idx}" class="daily-note" placeholder="예) 유산소 30분, 스쿼트 3×15, 플랭크 1분..." rows="2" style="min-height:40px"></textarea>${HRS}<button class="send-btn" style="width:100%;padding:15px;border:none;border-radius:16px;background:linear-gradient(135deg,rgba(100,155,220,0.18),rgba(80,130,200,0.22));color:#2a5a9a;font-size:14px;font-weight:800;cursor:pointer;letter-spacing:0.3px;border:1px solid rgba(100,155,220,0.3)">💬 트레이너에게 오늘 상태 전송</button></div>`, true)}

      ${collapsible('📊 체성분', 'green', `${buildCountdown(bd.lastMeasured)}<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:${bd.lastMeasured?'14px':'0'}"><div style="background:linear-gradient(145deg,#fff,#f5f8ff);border-radius:20px;padding:18px 10px;text-align:center;border:1px solid rgba(90,175,130,0.2);box-shadow:0 2px 12px rgba(90,175,130,0.08)"><div style="font-size:10px;color:#90b8a0;font-weight:700;letter-spacing:0.5px;margin-bottom:4px">체중</div><div style="font-size:30px;font-weight:800;color:#1a2a40;letter-spacing:-2px;line-height:1">${lW??'—'}</div><div style="font-size:10px;color:#b0c0d4;margin-top:3px">kg</div></div><div style="background:linear-gradient(145deg,#fff,#f8f5ff);border-radius:20px;padding:18px 10px;text-align:center;border:1px solid rgba(210,120,110,0.2);box-shadow:0 2px 12px rgba(210,120,110,0.06)"><div style="font-size:10px;color:#c09090;font-weight:700;letter-spacing:0.5px;margin-bottom:4px">체지방</div><div style="font-size:30px;font-weight:800;color:#1a2a40;letter-spacing:-2px;line-height:1">${lF??'—'}</div><div style="font-size:10px;color:#b0c0d4;margin-top:3px">kg</div></div><div style="background:linear-gradient(145deg,#fff,#f5f7ff);border-radius:20px;padding:18px 10px;text-align:center;border:1px solid rgba(90,154,210,0.2);box-shadow:0 2px 12px rgba(90,154,210,0.08)"><div style="font-size:10px;color:#8aaac8;font-weight:700;letter-spacing:0.5px;margin-bottom:4px">근육</div><div style="font-size:30px;font-weight:800;color:#1a2a40;letter-spacing:-2px;line-height:1">${lM??'—'}</div><div style="font-size:10px;color:#b0c0d4;margin-top:3px">kg</div></div></div><div class="delta-row"><div class="delta-box"><span class="dlbl">체중 변화</span><span class="dval ${dW.cls}">${dW.text}</span></div><div class="delta-box"><span class="dlbl">체지방 변화</span><span class="dval ${dF.cls}">${dF.text}</span></div><div class="delta-box"><span class="dlbl">근육 변화</span><span class="dval ${dM.cls}">${dM.text}</span></div></div>${HR}<div class="sub-label">변화 추이</div><div style="font-size:10px;font-weight:700;color:#90c8a8;letter-spacing:0.5px;margin-bottom:4px">체중</div><div style="position:relative;height:130px;margin-bottom:12px"><canvas id="bodyChart-${idx}"></canvas></div><div style="font-size:10px;font-weight:700;color:#7aaad4;letter-spacing:0.5px;margin-bottom:4px">골격근량 · 체지방량</div><div style="position:relative;height:130px;margin-bottom:14px"><canvas id="bodyChart2-${idx}"></canvas></div><div class="msg">${bd.comment}</div>`)}
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">

  }

  const navEl   = document.getElementById('week-nav');
  const panelEl = document.getElementById('week-panels');
  const todayStr = new Date().toLocaleDateString('ko-KR',{month:'numeric',day:'numeric'}).replace(/\s/g,'').replace('월','\/').replace('일','');
  const _year = new Date().getFullYear();
  function _parseWkDate(s){ if(!s||!s.includes('/')) return null; const [m,d]=s.split('/'); try{return new Date(_year,+m-1,+d);}catch(e){return null;} }
  const _today = new Date(); _today.setHours(0,0,0,0);
  const _wkStarts = weeks.map(w=>_parseWkDate(w.date));
  let defaultIdx = 0;
  for(let i=_wkStarts.length-1;i>=0;i--){ if(_wkStarts[i] && _today >= _wkStarts[i]){ defaultIdx=i; break; } }
  /* V2: 화살표 네비게이션 렌더 */
  const dots = weeks.map((_,i) => `<div class="wk-dot${i===defaultIdx?' on':''}"></div>`).join('');
  navEl.innerHTML = `
    <button class="wk-arrow" id="wk-prev" ${defaultIdx===0?'disabled':''}>‹</button>
    <div class="wk-nav-center">
      <span class="wk-nav-label" id="wk-nav-label">${weeks[defaultIdx].label}</span>
      <div class="wk-nav-dot" id="wk-nav-dots">${dots}</div>
    </div>
    <button class="wk-arrow" id="wk-next" ${defaultIdx===weeks.length-1?'disabled':''}>›</button>`;
  document.getElementById('wk-prev').addEventListener('click', () => { if (_curIdx > 0) switchWeek(_curIdx - 1); });
  document.getElementById('wk-next').addEventListener('click', () => { if (_curIdx < weeks.length - 1) switchWeek(_curIdx + 1); });
  /* 스와이프 지원 */
  let _tx0 = 0;
  panelEl.addEventListener('touchstart', e => { _tx0 = e.touches[0].clientX; }, { passive: true });
  panelEl.addEventListener('touchend',   e => {
    const dx = e.changedTouches[0].clientX - _tx0;
    if (Math.abs(dx) > 50) { if (dx < 0 && _curIdx < weeks.length-1) switchWeek(_curIdx+1); else if (dx > 0 && _curIdx > 0) switchWeek(_curIdx-1); }
  });
  panelEl.innerHTML = weeks.map((w,i) => buildPanel(w,i)).join('');

  /* 운동 처방 가이드 + 유산소 강도 가이드 초기화 */
  const TG_THINPUT = `width:52px;background:rgba(255,255,255,0.6);border:1px solid rgba(160,190,230,0.4);border-radius:8px;padding:3px 5px;font-size:11px;font-weight:700;color:#2a3a50;text-align:center;outline:none;font-family:inherit`;
  const TG_ROW = `display:grid;grid-template-columns:56px 44px 1fr 36px 44px;align-items:center;gap:4px;padding:5px 8px;background:rgba(255,255,255,0.45);border-radius:9px;border:1px solid rgba(255,255,255,0.75)`;
  const TG_HDR = `display:grid;grid-template-columns:56px 44px 1fr 36px 44px;gap:4px;padding:2px 8px;font-size:9px;font-weight:700;color:#b0c8e0;letter-spacing:0.4px;text-transform:uppercase`;
  weeks.forEach((w, idx) => {
    const kgEl = document.getElementById('train-kg-' + idx);
    if (kgEl) {
      function renderTrain(i) {
        const kg = parseFloat(document.getElementById('train-kg-' + i).value) || 60;
        const tbl = document.getElementById('train-table-' + i);
        tbl.innerHTML = '<div style="' + TG_HDR + '"><span>목표</span><span>횟수</span><span style="text-align:center">중량</span><span>RPE</span><span>TUT</span></div>'
          + TRAIN_GOALS.map(g => {
              const lo = Math.round(kg * g.pctLo), hi = Math.round(kg * g.pctHi);
              return '<div style="' + TG_ROW + '"><span style="font-size:11px;font-weight:700;color:#3a5a80">' + g.name + '</span>'
                + '<span style="font-size:10px;color:#8aa8c8">' + g.reps + '</span>'
                + '<span style="font-size:11px;font-weight:700;color:#1a2a40;text-align:center">' + lo + '–' + hi + '<span style="font-size:9px;color:#b0c0d4;margin-left:2px">kg</span></span>'
                + '<span style="font-size:10px;color:#8aa8c8">' + g.rpe + '</span>'
                + '<span style="font-size:10px;color:#8aa8c8">' + g.tut + '</span></div>';
            }).join('');
      }
      kgEl.addEventListener('input', () => renderTrain(idx));
      renderTrain(idx);
      const estW = document.getElementById('est-w-' + idx);
      const estR = document.getElementById('est-r-' + idx);
      const estResult = document.getElementById('est-result-' + idx);
      function calcEst(i) {
        const w = parseFloat(document.getElementById('est-w-' + i).value);
        const r = parseInt(document.getElementById('est-r-' + i).value);
        if (!w || !r) { document.getElementById('est-result-' + i).textContent = '—'; return; }
        const orm = Math.round(w * (1 + r / 30));
        document.getElementById('est-result-' + i).textContent = orm;
        document.getElementById('train-kg-' + i).value = orm;
        renderTrain(i);
      }
      estW.addEventListener('input', () => calcEst(idx));
      estR.addEventListener('input', () => calcEst(idx));
    }
    if (cardio?.age) {
      const rhrEl = document.getElementById('card-rhr-' + idx);
      if (rhrEl) {
        const maxHR = Math.round(207 - 0.7 * cardio.age);
        rhrEl.value = cardio.restingHR || 65;
        function renderZones(i) {
          const rhr = parseInt(document.getElementById('card-rhr-' + i).value) || 65;
          const hrr = maxHR - rhr;
          document.getElementById('card-formula-' + i).textContent = '최대 심박수 ' + maxHR + ' bpm · 심박 여유도 ' + hrr + ' bpm (카르보넨 공식)';
          document.getElementById('card-zones-' + i).innerHTML = ZONES.map(z => {
            const lo = Math.round(z.pctLo * hrr + rhr), hi = Math.round(z.pctHi * hrr + rhr);
            return '<div class="zone-row"><div class="zone-dot" style="background:' + z.color + '"></div><div class="zone-label" style="color:' + z.color + '">' + z.label + '</div><div class="zone-range">' + lo + '–' + hi + '<span>bpm</span></div><div class="zone-desc">' + z.desc + '</div></div>';
          }).join('');
        }
        rhrEl.addEventListener('input', () => renderZones(idx));
        renderZones(idx);
      }
    }
  });

  /* 식사 기록 초기화 */
  if (nutritionPlan) {
    const today = new Date().toDateString();
    weeks.forEach((w, idx) => {
      (nutritionPlan.mealGuide || []).forEach((m, mi) => {
        const ta = document.getElementById(`hm_ntr_${idx}_${mi}`);
        if (!ta) return;
        const sk = `hm_ntr_${idx}_${mi}_${today}`;

        ta.addEventListener('input', () => localStorage.setItem(sk, ta.value));
      });

  }

  navEl.querySelectorAll('.wt-btn').forEach(btn => btn.addEventListener('click', function(){ switchWeek(parseInt(this.dataset.idx)); }));
  switchWeek(defaultIdx);

  /* 달력 */
  document.querySelectorAll('.weekly-cal').forEach(cal => {
    const calKey = cal.querySelector('.cal-day')?.dataset.cal;
    if (!calKey) return;
    let checked = JSON.parse(localStorage.getItem(calKey)||'[]');
    function renderCal(){ cal.querySelectorAll('.cal-day').forEach((el,i)=>el.classList.toggle('checked',checked.includes(i))); const ci=parseInt(cal.id.replace('weekly-cal-','')); const ce=document.getElementById(`wk-count-${ci}`); if(ce) ce.textContent=`주 ${checked.length}회`; refreshMonthlyCount(); }
    renderCal();

      const todayIdx = parseInt(todayEl.dataset.idx);

        bar.innerHTML = `<span class="reminder-bar-text">💪 오늘 운동 완료했나요? 체크해주세요!</span><button class="reminder-bar-btn" onclick="document.getElementById('${remId}').style.display='none'">닫기</button>`;
        cal.parentElement.insertBefore(bar, cal);
      }

    cal.querySelectorAll('.cal-day:not(.rest-day)').forEach(el => el.addEventListener('click', function(){
      const i = parseInt(this.dataset.idx);

        const pos = checked.indexOf(i);

  /* 바디맵 */
  weeks.forEach((w,idx) => {

      const distHtml = obj => Object.entries(obj || {})

  /* 오늘의 명언 — 항상 맨 아래 */

    return weeks[0]?.finalMessage || '';
  })();
  if (quoteText) {
    document.getElementById('quote-section').innerHTML =
      `<div class="final-card"><div>오늘의 명언</div><div>${quoteText}</div></div>`;
  }

  /* 지난 기록 (archiveWeeks) */
  const archWeeks = (data.archiveWeeks || []).filter(w =>
    w.mainMessage || (w.summaries||[]).length || w.trainerComment
  );
  if (archWeeks.length) {
    const archEl = document.createElement('div');
    archEl.style.marginTop = '8px';
    const archInner = archWeeks.map(w => {
      const wSums = _buildSumItems(w.summaries||[]);
      const _archHR = '<hr style="border:none;border-top:1px solid rgba(160,190,230,0.2);margin:12px 0">';
      const wContent = `${w.mainMessage?`<div class="msg" style="margin-bottom:12px">${w.mainMessage}</div>`:''}${wSums?`<div class="sub-label">운동 기록</div><div class="summary-list">${wSums}</div>`:''}${w.trainerComment?`${wSums||w.mainMessage?_archHR:''}<div class="sub-label">트레이너 코멘트</div><div class="msg gold">${w.trainerComment}</div>`:''}`;
      return collapsible(w.label, 'blue', wContent);
    }).join('');
    archEl.innerHTML = collapsible('📋 지난 기록 보기', 'blue', archInner);
    document.getElementById('week-panels').after(archEl);
  }
}

/* ── 운동 계획 팝업 ── */
let _planCtx = {};
function openPlanPopup(day, workout, plan, note, idx, checked, calKey, renderCal) {
  _planCtx = { idx, checked, calKey, renderCal };
  document.getElementById('plan-title').textContent = `${day}요일 · ${workout}`;
  document.getElementById('plan-sub').textContent = plan.length ? `총 ${plan.length}개 운동` : '세부 계획 없음';
  const noteEl = document.getElementById('plan-note');
  if (note) { noteEl.textContent = note; noteEl.style.display = ''; }
  else { noteEl.style.display = 'none'; }
  document.getElementById('plan-rows').innerHTML = plan.length
    ? plan.map(p=>`<div class="plan-row"><span class="plan-name">${p.name}</span><span class="plan-detail">${p.sets}세트 × ${p.reps}회${p.weight?' / '+p.weight:''}</span></div>`).join('')
    : '<div style="font-size:13px;color:#c0d0e0;padding:8px 0">이 날 세부 계획이 없어요.</div>';
  updatePlanBtn();
  document.getElementById('plan-overlay').classList.add('show');
}
function updatePlanBtn() {
  const btn = document.getElementById('plan-check-btn');
  const done = _planCtx.checked.includes(_planCtx.idx);
  btn.textContent = done ? '✓ 완료됨' : '완료 체크';
  btn.classList.toggle('done', done);
}
document.getElementById('plan-check-btn').addEventListener('click', () => {
  const { idx, checked, calKey, renderCal } = _planCtx;
  const pos = checked.indexOf(idx);
  if (pos !== -1) checked.splice(pos, 1);
  else checked.push(idx);
  localStorage.setItem(calKey, JSON.stringify(checked));
  renderCal();
  updatePlanBtn();
});
document.getElementById('plan-close').addEventListener('click', () => document.getElementById('plan-overlay').classList.remove('show'));
document.getElementById('plan-overlay').addEventListener('click', e => { if(e.target===e.currentTarget) e.currentTarget.classList.remove('show'); });
</script>
<!-- THEME SWITCHER -->
<div class="hm-theme-bar" id="hmBar">
  <span class="hm-theme-bar-label">THEME</span>
  <div class="hm-tdot" data-t="original" title="오리지널"></div>
  <div class="hm-tdot" data-t="apple"    title="애플 클린"></div>
  <div class="hm-tdot" data-t="navy"     title="미드나이트 네이비"></div>
  <div class="hm-tdot" data-t="charcoal" title="챠콜 & 앰버"></div>
  <div class="hm-tdot" data-t="forest"   title="딥 포레스트"></div>
  <div class="hm-tdot" data-t="plum"     title="딥 플럼"></div>
</div>
<script>
(function(){
  const KEY='hm_theme';
  const bar=document.getElementById('hmBar');
  const dots=bar.querySelectorAll('.hm-tdot');
  function apply(t){
    if(t==='original') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme',t);
    dots.forEach(d=>d.classList.toggle('active',d.dataset.t===t));
    localStorage.setItem(KEY,t);
  }
  const saved=localStorage.getItem(KEY)||'apple';
  apply(saved);
  dots.forEach(d=>d.addEventListener('click',function(){ apply(this.dataset.t); }));
})();
</script>
