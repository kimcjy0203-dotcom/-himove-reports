<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HiMove 월간 리포트</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html { background: #e8f0fb; }
body {
  font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
  background: #f7faff; color: #1a1a2e;
  max-width: 430px; margin: 0 auto;
  padding: 40px 18px 72px; position: relative;
}
body > * { position: relative; z-index: 1; }

/* ── 로딩 ── */
#loading {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  height: 60vh; gap: 16px; color: #a0b8d0;
}
.spinner {
  width: 36px; height: 36px; border: 3px solid rgba(160,190,230,0.3);
  border-top-color: rgba(90,154,210,0.8); border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
#error-msg { display: none; text-align: center; padding: 60px 24px; color: #a0b8d0; font-size: 14px; line-height: 1.8; }

.header {
  background: #ffffff;
  border-radius: 32px; padding: 36px 28px 30px; margin-bottom: 18px;
  border: 1px solid rgba(140,180,230,0.45);
  box-shadow: 0 4px 20px rgba(100,150,230,0.10);
}
.header h1 {
  font-size: 42px; font-weight: 800; letter-spacing: -2px;
  background: linear-gradient(135deg, #5aaae8 0%, #3a8fd4 45%, #7acef5 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  margin-bottom: 4px; line-height: 1;
}
.header .subtitle { font-size: 13px; color: #a0b2c8; font-weight: 400; margin-bottom: 22px; }
.header .meta { display: flex; flex-wrap: wrap; gap: 8px; }
.header .meta span {
  background: rgba(160,190,230,0.15); border: 1px solid rgba(160,190,230,0.3);
  border-radius: 100px; padding: 5px 14px; font-size: 12px; color: #5a7a9a; font-weight: 500;
}
.card {
  background: #ffffff;
  border-radius: 28px; padding: 28px 24px; margin-bottom: 12px;
  border: 1px solid rgba(140,180,230,0.45);
  box-shadow: 0 4px 20px rgba(100,150,230,0.10);
}
.card:has(.card-title.gold) { background: #ffffff; border-color: rgba(140,180,230,0.5); }
.card-title {
  font-size: 13px; font-weight: 700; letter-spacing: 0.5px; color: #7a95b8;
  margin-bottom: 18px; display: flex; align-items: center; justify-content: space-between;
}
.card-title.gold::after {
  content: '트레이너'; font-size: 9px; font-weight: 700; letter-spacing: 0.5px; color: #6a9ac4;
  background: rgba(100,160,220,0.1); border: 1px solid rgba(100,160,220,0.2);
  border-radius: 100px; padding: 2px 9px;
}
.msg {
  background: rgba(255,255,255,0.78); backdrop-filter: blur(32px); -webkit-backdrop-filter: blur(32px);
  border: 1px solid rgba(195,218,255,0.6); border-radius: 20px; padding: 16px 18px;
  font-size: 14px; line-height: 1.9; color: #2a3a50; white-space: pre-line; font-weight: 400;
  box-shadow: 0 4px 20px rgba(100,150,230,0.08), inset 0 1px 0 rgba(255,255,255,1);
}
.note { font-size: 13px; color: #a0b2c8; line-height: 1.8; white-space: pre-line; }
.sub-label { font-size: 10px; font-weight: 700; margin-bottom: 8px; letter-spacing: 1.5px; text-transform: uppercase; color: #b8c8da; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { padding: 0 0 10px; text-align: left; font-size: 10px; font-weight: 700; color: #c0ccd8; letter-spacing: 1.5px; text-transform: uppercase; border-bottom: 1px solid rgba(160,190,230,0.2); }
td { padding: 13px 0; border-bottom: 1px solid rgba(160,190,230,0.15); color: #2a3a50; vertical-align: top; line-height: 1.7; }
tr:last-child td { border-bottom: none; }
.check-row { display: flex; flex-wrap: nowrap; gap: 6px; margin-bottom: 14px; }
.chip { flex: 1; min-width: 0; text-align: center; background: rgba(255,255,255,0.45); border: 1px solid rgba(160,190,230,0.3); border-radius: 100px; padding: 7px 4px; font-size: 11px; color: #a0b8d0; font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip.on { background: rgba(100,155,220,0.15); border-color: rgba(100,155,220,0.45); color: #3a6a9a; font-weight: 700; }
.stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat-box { background: rgba(255,255,255,0.78); backdrop-filter: blur(32px); -webkit-backdrop-filter: blur(32px); border-radius: 22px; padding: 20px 10px; text-align: center; border: 1px solid rgba(195,218,255,0.6); box-shadow: 0 4px 20px rgba(100,150,230,0.10), inset 0 1px 0 rgba(255,255,255,1); }
.stat-box .lbl { font-size: 10px; color: #b0c0d4; margin-bottom: 6px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; }
.stat-box .val { font-size: 28px; font-weight: 700; color: #1a2a40; letter-spacing: -1.5px; line-height: 1; }
.stat-box .unt { font-size: 11px; color: #b0c0d4; margin-top: 4px; }
.delta-row { margin-top: 14px; display: flex; gap: 10px; flex-wrap: wrap; }
.delta-box { display: flex; flex-direction: column; background: rgba(255,255,255,0.55); border: 1px solid rgba(255,255,255,0.8); border-radius: 14px; padding: 10px 14px; flex: 1; min-width: 80px; text-align: center; }
.dlbl { font-size: 10px; color: #b0c0d4; font-weight: 700; letter-spacing: 0.5px; margin-bottom: 4px; }
.dval { font-size: 15px; font-weight: 700; color: #2a3a50; }
.dval.up { color: #e07070; } .dval.down { color: #5a9a7a; }
.countdown-wrap { background: rgba(255,255,255,0.5); border: 1px solid rgba(255,255,255,0.8); border-radius: 16px; padding: 14px 16px; }
.countdown-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.countdown-label { font-size: 11px; font-weight: 700; letter-spacing: 1px; color: #a0b8d0; text-transform: uppercase; }
.countdown-days { font-size: 13px; font-weight: 700; color: #3a6a9a; }
.countdown-days.urgent { color: #d07070; }
.countdown-bar-bg { background: rgba(160,190,230,0.2); border-radius: 100px; height: 6px; overflow: hidden; }
.countdown-bar-fill { height: 100%; border-radius: 100px; background: linear-gradient(90deg, rgba(90,154,210,0.6), rgba(120,180,240,0.9)); }
.countdown-bar-fill.urgent { background: linear-gradient(90deg, rgba(210,120,110,0.6), rgba(230,150,140,0.9)); }
.countdown-sub { font-size: 11px; color: #b0c0d4; margin-top: 7px; }
.exercise-grid { display: flex; flex-direction: column; gap: 10px; }
.exercise-item { background: rgba(255,255,255,0.78); backdrop-filter: blur(32px); -webkit-backdrop-filter: blur(32px); border: 1px solid rgba(195,218,255,0.6); border-radius: 20px; padding: 16px 18px; box-shadow: 0 4px 20px rgba(100,150,230,0.10), inset 0 1px 0 rgba(255,255,255,1); }
.ei-name { font-size: 13px; font-weight: 800; color: #2a3a50; letter-spacing: -0.3px; margin-bottom: 6px; }
.ei-feedback { font-size: 13px; font-weight: 400; color: #6a80a0; line-height: 1.65; margin-bottom: 6px; }
.ei-next { font-size: 12px; font-weight: 400; color: #a0b8d0; }
.ei-next::before { content: '→  '; }
.lift-grid { display: flex; flex-direction: column; gap: 10px; }
.lift-box { background: rgba(255,255,255,0.78); backdrop-filter: blur(32px); -webkit-backdrop-filter: blur(32px); border: 1px solid rgba(195,218,255,0.6); border-radius: 20px; padding: 16px 18px; display: flex; align-items: center; gap: 14px; box-shadow: 0 4px 20px rgba(100,150,230,0.10), inset 0 1px 0 rgba(255,255,255,1); }
.lb-name { font-size: 11px; font-weight: 800; color: #2a3a50; flex-shrink: 0; white-space: nowrap; }
.lb-current { font-size: 24px; font-weight: 700; color: #1a2a40; letter-spacing: -1px; flex: 1; line-height: 1; }
.lb-current span { font-size: 12px; font-weight: 400; color: #b0c0d4; margin-left: 1px; }
.lb-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.lb-goal { font-size: 11px; color: #b0c0d4; }
.lb-gap { font-size: 12px; font-weight: 700; color: #6a9ac4; }
.lb-timer { font-size: 10px; font-weight: 700; border-radius: 6px; padding: 2px 6px; white-space: nowrap; margin-top: 2px; }
.lb-timer.ready  { background: rgba(80,180,100,0.12); color: #2e7d52; }
.lb-timer.soon   { background: rgba(255,160,50,0.12); color: #c06010; }
.lb-timer.waiting{ background: rgba(100,150,210,0.10); color: #5a7aa8; }
.weekly-cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-bottom: 14px; }
.cal-day { background: rgba(255,255,255,0.45); border: 1px solid rgba(160,190,230,0.3); border-radius: 14px; padding: 12px 4px 10px; text-align: center; cursor: pointer; user-select: none; }
.cd-weekday { font-size: 10px; font-weight: 700; color: #b0c0d4; letter-spacing: 0.5px; margin-bottom: 1px; }
.cd-date { font-size: 14px; font-weight: 800; color: #2a3a50; line-height: 1; margin-bottom: 3px; }
.cd-workout { font-size: 9px; color: #a0b8d0; font-weight: 600; margin-top: 2px; }
.cd-check { font-size: 12px; margin-top: 3px; color: #3a6a9a; opacity: 0; }
.cal-day.checked { background: rgba(100,155,220,0.14); border-color: rgba(100,155,220,0.45); }
.cal-day.checked .cd-weekday, .cal-day.checked .cd-workout, .cal-day.checked .cd-date { color: #3a6a9a; font-weight: 700; }
.cal-day.checked .cd-check { opacity: 1; }
.cal-day.rest-day { opacity: 0.5; cursor: default; }
.cal-day.today:not(.rest-day) { border-color: rgba(100,155,220,0.6); box-shadow: 0 0 0 2px rgba(100,155,220,0.25); }
.cal-day.today .cd-date { color: #3a7ad4; }
.reminder-bar { display:flex; align-items:center; gap:10px; background:rgba(100,155,220,0.1); border:1px solid rgba(100,155,220,0.3); border-radius:14px; padding:11px 14px; margin-bottom:14px; }
.reminder-bar-text { font-size:12px; color:#3a6a9a; font-weight:600; flex:1; }
.reminder-bar-btn { background:rgba(100,155,220,0.2); border:none; border-radius:10px; padding:6px 14px; font-size:12px; font-weight:700; color:#2a5a8a; cursor:pointer; white-space:nowrap; flex-shrink:0; }
.wk-count { font-size: 11px; font-weight: 600; color: #6a9ac4; background: rgba(100,155,220,0.1); border: 1px solid rgba(100,155,220,0.2); border-radius: 100px; padding: 2px 10px; }
.body-map-container { display: flex; gap: 6px; justify-content: center; margin-bottom: 4px; }
.body-map-wrap { display: flex; flex-direction: column; align-items: center; }
.body-map-svg { width: 100%; max-width: 58px; display: block; }
.body-map-lbl { font-size: 9px; font-weight: 700; letter-spacing: 1px; color: #b8c8da; text-align: center; margin-top: 4px; }
.plan-overlay { display:none; position:fixed; inset:0; background:rgba(30,50,80,0.25); backdrop-filter:blur(4px); z-index:300; align-items:center; justify-content:center; }
.plan-overlay.show { display:flex; }
.plan-popup { background:rgba(255,255,255,0.97); backdrop-filter:blur(32px); -webkit-backdrop-filter:blur(32px); border:1px solid rgba(195,218,255,0.8); border-radius:24px; padding:22px 22px 18px; box-shadow:0 16px 60px rgba(100,150,230,0.22); width:300px; max-width:90vw; position:relative; }
.plan-popup-title { font-size:15px; font-weight:800; color:#2a3a50; margin-bottom:4px; padding-right:24px; }
.plan-popup-sub { font-size:11px; color:#a0b8d0; margin-bottom:16px; font-weight:600; letter-spacing:0.3px; }
.plan-row { display:flex; align-items:center; justify-content:space-between; padding:9px 0; border-bottom:1px solid rgba(160,190,230,0.15); }
.plan-row:last-child { border-bottom:none; }
.plan-name { font-size:13px; font-weight:700; color:#2a3a50; }
.plan-detail { font-size:12px; color:#6a9ac4; font-weight:600; }
.plan-check-btn { width:100%; margin-top:16px; padding:12px; border:none; border-radius:14px; font-size:13px; font-weight:800; cursor:pointer; transition:all 0.2s; background:rgba(100,155,220,0.12); color:#3a6a9a; }
.plan-check-btn.done { background:rgba(90,175,130,0.15); color:#3a8a6a; }
.plan-close { position:absolute; top:14px; right:16px; font-size:18px; color:#c0d0e0; cursor:pointer; background:none; border:none; line-height:1; }
.muscle-area { cursor: pointer; transition: filter 0.15s; }
.muscle-popup { position: fixed; background: rgba(255,255,255,0.97); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border: 1px solid rgba(195,218,255,0.8); border-radius: 18px; padding: 14px 16px 12px; box-shadow: 0 10px 40px rgba(100,150,230,0.2); z-index: 200; min-width: 160px; max-width: 200px; }
.popup-close { position: absolute; top: 9px; right: 13px; font-size: 17px; color: #b0c0d4; cursor: pointer; }
.popup-name { font-size: 13px; font-weight: 800; color: #2a3a50; margin-bottom: 8px; padding-right: 18px; }
.popup-exercises { font-size: 12px; color: #6a80a0; line-height: 1.9; }
.final-card { background: rgba(232,241,255,0.65); border: 1px solid rgba(180,210,250,0.55); border-radius: 28px; padding: 32px 26px; margin-bottom: 12px; box-shadow: 0 6px 36px rgba(100,150,230,0.10), inset 0 1px 0 rgba(255,255,255,0.9); }
.final-card > div:first-child { font-size: 10px; letter-spacing: 2px; color: #8aabcc; margin-bottom: 12px; font-weight: 700; }
.final-card > div:last-child { font-size: 16px; line-height: 1.85; font-weight: 500; color: #2a3a50; }
.footer { text-align: center; font-size: 11px; color: #b0c0d8; margin-top: 10px; padding-bottom: 20px; line-height: 2; letter-spacing: 0.5px; }
.mini-sum { font-size: 11px; color: #c0d0e0; margin-bottom: 6px; }
.mini-sum b { color: #7aaac8; font-weight: 700; margin-right: 8px; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: middle; margin-bottom: 1px; }
.tool-toggle { width:100%; background:none; border:none; cursor:pointer; display:flex; align-items:center; justify-content:space-between; padding:14px 18px; color:#7a95b8; font-size:12px; font-weight:700; letter-spacing:0.3px; }
.tool-toggle.open .tool-arrow { transform:rotate(180deg); }
.tool-arrow { font-size:10px; transition:transform 0.2s; display:inline-block; }
.tool-body { padding:0 18px 16px; }
.tool-body.hidden { display:none; }
.goal-bar-item { margin-bottom:12px; }
.goal-bar-item:last-child { margin-bottom:0; }
.goal-bar-label { display:flex; justify-content:space-between; font-size:11px; color:#8aaac8; margin-bottom:5px; font-weight:600; }
.goal-bar-pct { font-weight:800; color:#5a8ab0; }
.goal-bar-bg { background:rgba(160,190,230,0.18); border-radius:100px; height:6px; overflow:hidden; }
.goal-bar-fill { height:100%; border-radius:100px; transition:width 0.8s; }
.memo-badge { font-size:9px; font-weight:800; letter-spacing:1.2px; background:rgba(200,160,90,0.12); color:#b08840; border:1px solid rgba(200,160,90,0.25); border-radius:20px; padding:2px 8px; margin-left:8px; }
.purpose-grid { margin-top: 14px; display: flex; flex-wrap: nowrap; gap: 5px; }
.purpose-chip { flex: 1; min-width: 0; display: flex; align-items: center; gap: 5px; padding: 6px 8px; border-radius: 12px; font-size: 10px; font-weight: 700; color: #3a5a7a; background: #ffffff; border: 1px solid rgba(140,180,230,0.45); box-shadow: 0 2px 8px rgba(100,150,230,0.10); white-space: nowrap; overflow: hidden; }
.purpose-chip-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.purpose-chip-icon { font-size: 15px; line-height: 1; flex-shrink: 0; }
.goal-timeline { display: flex; flex-direction: column; gap: 7px; margin-top: 2px; }
.gt-item { display: flex; align-items: flex-start; gap: 8px; }
.gt-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; margin-top: 5px; }
.gt-card { flex: 1; min-width: 0; }
.gt-header { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; }
.gt-badge { font-size: 9px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; padding: 1px 6px; border-radius: 20px; flex-shrink: 0; }
.gt-period { font-size: 10px; color: #b0c4d8; margin-left: auto; flex-shrink: 0; }
.gt-text { font-size: 11px; font-weight: 500; color: #4a6a8a; line-height: 1.5; }
.gt-short .gt-dot  { background: rgba(76,175,80,0.85); }
.gt-short .gt-card { padding-left: 8px; border-left: 2px solid rgba(76,175,80,0.5); }
.gt-short .gt-badge{ background: rgba(76,175,80,0.12); color: #2e7d32; }
.gt-mid .gt-dot    { background: rgba(33,150,243,0.85); }
.gt-mid .gt-card   { padding-left: 8px; border-left: 2px solid rgba(33,150,243,0.5); }
.gt-mid .gt-badge  { background: rgba(33,150,243,0.10); color: #1565c0; }
.gt-long .gt-dot   { background: rgba(156,39,176,0.8); }
.gt-long .gt-card  { padding-left: 8px; border-left: 2px solid rgba(156,39,176,0.45); }
.gt-long .gt-badge { background: rgba(156,39,176,0.09); color: #6a1b9a; }
.summary-list { display: flex; flex-direction: column; }
.summary-item { display: flex; gap: 8px; padding: 10px 0; border-bottom: 1px solid rgba(160,190,230,0.15); align-items: baseline; }
.summary-item:last-child { border-bottom: none; padding-bottom: 0; }
.si-name   { font-size: 12px; font-weight: 800; color: #3a6a9a; min-width: 80px; flex-shrink: 0; }
.si-sep    { font-size: 12px; color: #c0d0e0; flex-shrink: 0; }
.si-detail { font-size: 13px; color: #2a3a50; line-height: 1.6; }
.week-nav { position: sticky; top: 0; z-index: 100; display: flex; gap: 8px; padding: 12px 0 10px; background: rgba(255,255,255,0.95); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); margin-bottom: 4px; overflow-x: auto; scrollbar-width: none; -ms-overflow-style: none; }
.week-nav::-webkit-scrollbar { display: none; }
.wt-btn { flex: 0 0 auto; min-width: 64px; padding: 10px 6px; border-radius: 16px; border: 1px solid rgba(160,190,230,0.3); background: rgba(255,255,255,0.45); font-size: 12px; font-weight: 700; color: #a0b8d0; cursor: pointer; text-align: center; transition: all 0.2s; -webkit-tap-highlight-color: transparent; }
.wt-btn .wt-week { display: block; font-size: 13px; font-weight: 800; margin-bottom: 2px; }
.wt-btn .wt-date { display: block; font-size: 10px; font-weight: 400; opacity: 0.8; }
.wt-btn.active { background: rgba(100,155,220,0.18); border-color: rgba(100,155,220,0.5); color: #3a6a9a; box-shadow: 0 3px 14px rgba(100,150,230,0.12); }
.wt-btn.empty { opacity: 0.38; cursor: default; }
.week-panel { display: none; }
.week-panel.active { display: block; }
.week-empty { background: rgba(255,255,255,0.4); border-radius: 24px; padding: 48px 24px; text-align: center; color: #b0c0d4; border: 1px dashed rgba(160,190,230,0.4); margin-top: 8px; }
.week-empty .we-num { font-size: 32px; font-weight: 800; color: #d0dcea; margin-bottom: 8px; }
.week-empty .we-msg { font-size: 13px; line-height: 1.8; }
.tool-inputs { display: flex; gap: 10px; margin-bottom: 18px; }
.ti-group { flex: 1; display: flex; flex-direction: column; gap: 5px; }
.ti-group label { font-size: 10px; font-weight: 700; color: #a0b8d0; letter-spacing: 0.5px; text-transform: uppercase; }
.ti-row { display: flex; align-items: center; gap: 6px; }
.ti-input { width: 100%; background: rgba(255,255,255,0.6); border: 1px solid rgba(160,190,230,0.35); border-radius: 10px; padding: 8px 12px; font-size: 15px; font-weight: 700; color: #2a3a50; text-align: center; outline: none; font-family: -apple-system, 'Apple SD Gothic Neo', sans-serif; }
.ti-unit { font-size: 12px; color: #a0b8d0; white-space: nowrap; }
.zone-table { display: flex; flex-direction: column; gap: 7px; }
.zone-row { display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.5); border-radius: 10px; padding: 7px 12px; border: 1px solid rgba(255,255,255,0.8); }
.zone-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.zone-label { font-size: 11px; font-weight: 800; letter-spacing: 0.5px; width: 44px; flex-shrink: 0; }
.zone-range { font-size: 14px; font-weight: 700; color: #1a2a40; flex: 1; letter-spacing: -0.3px; }
.zone-range span { font-size: 11px; font-weight: 400; color: #b0c0d4; margin-left: 2px; }
.zone-desc { font-size: 11px; color: #a0b8d0; text-align: right; }

/* ════════════════════════════════
   데이터 로드
════════════════════════════════ */
const params   = new URLSearchParams(window.location.search);
const isMember = params.get('mode') === 'member' || !!params.get('token');

function loadMember(memberId) {
  fetch(`data/${memberId}.json?v=${Date.now()}`)
    .then(r => { if (!r.ok) throw new Error(); return r.json(); })
    .then(data => {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      document.title = `HiMove — ${data.name}`;
      init(data);
    })
    .catch(() => {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('error-msg').style.display = 'block';
    });
}

const directId = params.get('id');
const token    = params.get('token');

if (directId) {
  loadMember(directId);
} else if (token) {
  fetch(`data/members.json?v=${Date.now()}`)
    .then(r => { if (!r.ok) throw new Error(); return r.json(); })
    .then(members => {
      const member = members.find(m => m.token === token);
      if (!member) throw new Error();
      loadMember(member.id);
    })
    .catch(() => {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('error-msg').style.display = 'block';
    });
} else {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('error-msg').style.display = 'block';
}

/* ════════════════════════════════
   초기화
════════════════════════════════ */
function init(data) {
  const { name, month, purposes, goals, cardio, orm, weeks } = data;

  if (isMember) {
    document.querySelectorAll('.trainer-only').forEach(el => el.style.display = 'none');
    document.getElementById('report-subtitle').textContent = `${name} 리포트`;
  }

  /* 헤더 */
  if (!isMember) document.getElementById('report-subtitle').textContent = `${name} 월간 리포트`;
  document.getElementById('report-meta').innerHTML = `<span>${month}</span><span>${name}</span>`;

  const pgEl = document.getElementById('purpose-grid');
  if (purposes && purposes.length) {
    pgEl.innerHTML = purposes.map(label => {
      const m = PURPOSE_META[label] || { bg: 'rgba(240,240,240,0.85)', color: '#555', icon: '•' };
      return `<div class="purpose-chip"><span class="purpose-chip-dot" style="background:${m.color}"></span><span>${label}</span></div>`;
    }).join('');
  } else { pgEl.style.display = 'none'; }

  const goalsCard = document.getElementById('goals-card');
  const goalItems = [
    { key: 'short', badge: '단기', label: '단기 목표', cls: 'gt-short' },
    { key: 'mid',   badge: '중기', label: '중기 목표', cls: 'gt-mid'   },
    { key: 'long',  badge: '장기', label: '장기 목표', cls: 'gt-long'  }
  ];
  const timeline = goalItems.map(it => {
    const d = goals[it.key]; if (!d || !d.text) return '';
    return `<div class="gt-item ${it.cls}"><div class="gt-dot"></div><div class="gt-card"><div class="gt-header"><span class="gt-badge">${it.badge}</span><span style="font-size:11px;font-weight:700;color:#4a6a8a">${it.label}</span>${d.period ? `<span class="gt-period">${d.period}</span>` : ''}</div><div class="gt-text">${d.text}</div></div></div>`;
  }).join('');
  goalsCard.innerHTML = `<div class="card-title blue">목표</div>${timeline.trim() ? `<div class="goal-timeline">${timeline}</div>` : '<div class="note" style="padding:4px 0">아직 목표가 입력되지 않았습니다.</div>'}`;
  goalsCard.style.display = '';

  /* 목표 달성률 */
  if (data.bodyGoals) {
    const bg = data.bodyGoals;
    const latestW = weeks.flatMap(w => (w.bodyData?.weight||[]).filter(v=>v!=null)).at(-1) ?? null;
    const latestM = weeks.flatMap(w => (w.bodyData?.muscle||[]).filter(v=>v!=null)).at(-1) ?? null;
    const latestF = weeks.flatMap(w => (w.bodyData?.fat||[]).filter(v=>v!=null)).at(-1) ?? null;
    const bars = [
      { label:'체중', val:latestW, s:bg.weight?.start, g:bg.weight?.goal, color:'rgba(210,120,110,0.75)', invert:true },
      { label:'골격근량', val:latestM, s:bg.muscle?.start, g:bg.muscle?.goal, color:'rgba(90,154,210,0.8)', invert:false },
      { label:'체지방량', val:latestF, s:bg.fat?.start,    g:bg.fat?.goal,    color:'rgba(255,180,80,0.8)', invert:true },
    ].filter(b => b.val != null && b.s != null && b.g != null);
    if (bars.length) {
      const barsHtml = bars.map(b => {
        const total = Math.abs(b.g - b.s);
        const moved = b.invert ? b.s - b.val : b.val - b.s;
        const pct = total === 0 ? 0 : Math.min(Math.max(Math.round((moved / total) * 100), 0), 100);
        return `<div class="goal-bar-item">
          <div class="goal-bar-label"><span>${b.label}</span><span class="goal-bar-pct">${pct}%</span></div>
          <div class="goal-bar-bg"><div class="goal-bar-fill" style="width:${pct}%;background:${b.color}"></div></div>
          <div style="display:flex;justify-content:space-between;font-size:10px;color:#b0c0d4;margin-top:3px"><span>시작 ${b.s}kg</span><span>현재 ${b.val}kg</span><span>목표 ${b.g}kg</span></div>
        </div>`;
      }).join('');
      const pgCard = document.createElement('div');
      pgCard.className = 'card';
      pgCard.innerHTML = `<div class="card-title blue">목표 달성률</div>${barsHtml}`;
      goalsCard.after(pgCard);
    }
  }

  /* 주차 탭 & 패널 */
  let activeChart = {};
  function switchWeek(idx) {
    document.querySelectorAll('.wt-btn').forEach((b, i) => b.classList.toggle('active', i === idx));
    document.querySelectorAll('.week-panel').forEach((p, i) => p.classList.toggle('active', i === idx));
    initDailyStatus(idx);
    const w = weeks[idx];
    if (w && w.bodyData && !activeChart[idx]) {
      const canvas = document.getElementById(`bodyChart-${idx}`);
      const canvas2 = document.getElementById(`bodyChart2-${idx}`);
      if (canvas) {
        const bd = w.bodyData;
        const fmt = v => parseFloat(v).toFixed(1) + 'kg';
        const chartOpts = (datasets, vals) => {
          const mn = vals.length ? Math.floor(Math.min(...vals)) - 1 : 0;
          const mx = vals.length ? Math.ceil(Math.max(...vals))  + 1 : 30;
          return {
            type: 'line',
            data: { labels: bd.labels, datasets },
            options: { responsive: true, maintainAspectRatio: false,
              plugins: { legend: { labels: { font: { size: 11 }, color: '#8aa0ba', boxWidth: 10, usePointStyle: true } }, tooltip: { mode: 'index', intersect: false } },
              scales: {
                x: { grid: { display: false }, ticks: { color: '#b0c0d4', font: { size: 11 } }, border: { display: false } },
                y: { min: mn, max: mx, grid: { color: 'rgba(160,190,230,0.12)' }, ticks: { color: '#b0c0d4', font: { size: 11 }, callback: fmt }, border: { display: false } }
              }
            }
          };
        };
        const wVals = (bd.weight||[]).filter(v=>v!=null);
        const cVals = [...(bd.muscle||[]),...(bd.fat||[])].filter(v=>v!=null);
        activeChart[idx] = new Chart(canvas.getContext('2d'), chartOpts(
          [{ label: '체중', data: bd.weight, borderColor: 'rgba(90,175,130,0.8)', backgroundColor: 'rgba(90,175,130,0.08)', borderWidth: 2.5, pointBackgroundColor: 'rgba(90,175,130,1)', pointRadius: 4, tension: 0.4, fill: true, spanGaps: true }],
          wVals
        ));
        if (canvas2) new Chart(canvas2.getContext('2d'), chartOpts(
          [
            { label: '골격근량', data: bd.muscle, borderColor: 'rgba(90,154,210,0.85)', backgroundColor: 'rgba(90,154,210,0.08)', borderWidth: 2.5, pointBackgroundColor: 'rgba(90,154,210,1)', pointRadius: 4, tension: 0.4, fill: true, spanGaps: true },
            { label: '체지방량', data: bd.fat,    borderColor: 'rgba(210,120,110,0.75)', backgroundColor: 'rgba(210,120,110,0.06)', borderWidth: 2.5, pointBackgroundColor: 'rgba(210,120,110,1)', pointRadius: 4, tension: 0.4, fill: true, spanGaps: true }
          ],
          cVals
        ));
      }
    }
  }

  function buildCountdown(lastMeasured) {
    if (!lastMeasured) return '';
    const last = new Date(lastMeasured), next = new Date(last);
    next.setDate(next.getDate() + 14);
    const today = new Date(); today.setHours(0,0,0,0);
    const daysLeft = Math.ceil((next - today) / 86400000);
    const pct = Math.min(Math.round(((14 - Math.max(daysLeft, 0)) / 14) * 100), 100);
    const isUrgent = daysLeft <= 3;
    return `<div class="countdown-wrap"><div class="countdown-top"><span class="countdown-label">다음 인바디 측정</span><span class="countdown-days${isUrgent ? ' urgent' : ''}">${daysLeft <= 0 ? '측정이 필요해요' : `${daysLeft}일 남음`}</span></div><div class="countdown-bar-bg"><div class="countdown-bar-fill${isUrgent ? ' urgent' : ''}" style="width:${pct}%"></div></div><div class="countdown-sub">2주 주기 &nbsp;·&nbsp; 다음 예정: ${next.toLocaleDateString('ko-KR', { month: 'long', day: 'numeric' })}</div></div>`;
  }

  function miniSum(key, opts) {
    const cnt = {};
    opts.forEach(o => cnt[o] = 0);
    weeks.forEach(wk => {
      if ((wk.mainMessage || wk.sessionDates?.length) && wk[key])
        cnt[wk[key]] = (cnt[wk[key]] || 0) + 1;
    });
    const parts = opts.filter(o => cnt[o] > 0).map(o => `<b>${o} ${cnt[o]}</b>`).join('');
    return parts ? `<div class="mini-sum">${parts}</div>` : '';
  }

  function collapsible(title, color, content, open=false) {
    return `<div class="card" style="padding:0;overflow:hidden">
      <button class="tool-toggle${open?'':''}" onclick="this.classList.toggle('open');this.nextElementSibling.classList.toggle('hidden')" style="color:${color==='gold'?'#9a7a40':color==='green'?'#3a8a6a':'#7a95b8'}">
        ${title} <span class="tool-arrow"${open?' style="transform:rotate(180deg)"':''}>▾</span>
      </button>
      <div class="tool-body${open?'':' hidden'}">${content}</div>
    </div>`;
  }

  const todayKey = new Date().toISOString().slice(0,10); // "2026-05-31"
  function dailyChips(field, opts) {
    return opts.map(o => `<div class="chip daily-chip" data-field="${field}" data-value="${o}">${o}</div>`).join('');
  }
  function initDailyStatus(idx) {
    const sec = document.getElementById(`ds-${idx}`);
    if (!sec) return;
    const sk = `daily-status-${todayKey}-${idx}`;
    const saved = JSON.parse(localStorage.getItem(sk) || '{}');
    sec.querySelectorAll('.daily-chip').forEach(chip => {
      chip.classList.toggle('on', saved[chip.dataset.field] === chip.dataset.value);
      chip.onclick = () => {
        const f = chip.dataset.field, v = chip.dataset.value;
        const cur = JSON.parse(localStorage.getItem(sk) || '{}');
        cur[f] = cur[f] === v ? null : v;
        localStorage.setItem(sk, JSON.stringify(cur));
        sec.querySelectorAll(`.daily-chip[data-field="${f}"]`).forEach(c =>
          c.classList.toggle('on', c.dataset.value === cur[f])
        );
      };
    });
  }

  function buildPanel(w, idx) {
    const hasRoutine = w.weeklyRoutine?.days?.some(d => d.plan?.length);
    if (!w.mainMessage && !hasRoutine) return `<div class="week-panel" data-idx="${idx}"><div class="week-empty"><div class="we-num">${w.week}주차</div><div class="we-msg">아직 입력 전입니다.<br>수업 후 트레이너가 업데이트해요.</div></div>${collapsible('운동 처방 가이드', 'blue', '<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px"><span style="font-size:11px;color:#a0b8d0;white-space:nowrap">기준 중량 (1RM)</span><input id="train-kg-'+idx+'" type="number" min="1" max="500" value="60" style="width:52px;background:rgba(255,255,255,0.6);border:1px solid rgba(160,190,230,0.4);border-radius:8px;padding:4px 6px;font-size:13px;font-weight:700;color:#2a3a50;text-align:center;outline:none;font-family:inherit"><span style="font-size:11px;color:#a0b8d0">kg</span></div><div style="display:flex;align-items:center;gap:5px;margin-bottom:10px;padding:6px 8px;background:rgba(255,255,255,0.35);border-radius:8px;border:1px solid rgba(160,190,230,0.2)"><span style="font-size:10px;color:#b0c8e0;white-space:nowrap">1RM 모를 때</span><input id="est-w-'+idx+'" type="number" min="1" max="400" placeholder="무게" style="width:46px;background:rgba(255,255,255,0.6);border:1px solid rgba(160,190,230,0.3);border-radius:6px;padding:3px 4px;font-size:11px;font-weight:600;color:#2a3a50;text-align:center;outline:none;font-family:inherit"><span style="font-size:10px;color:#c0d0e0">kg</span><input id="est-r-'+idx+'" type="number" min="1" max="30" placeholder="횟수" style="width:38px;background:rgba(255,255,255,0.6);border:1px solid rgba(160,190,230,0.3);border-radius:6px;padding:3px 4px;font-size:11px;font-weight:600;color:#2a3a50;text-align:center;outline:none;font-family:inherit"><span style="font-size:10px;color:#c0d0e0">회</span><span style="font-size:10px;color:#c0d0e0">→</span><span id="est-result-'+idx+'" style="font-size:11px;font-weight:700;color:#5a8ab8;min-width:28px">—</span><span style="font-size:10px;color:#c0d0e0">kg</span></div><div id="train-table-'+idx+'"></div>')}${collapsible('유산소 강도 가이드', 'blue', '<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px"><span style="font-size:11px;color:#a0b8d0;white-space:nowrap">오늘 안정시 심박수</span><input id="card-rhr-'+idx+'" type="number" min="40" max="120" style="width:52px;background:rgba(255,255,255,0.6);border:1px solid rgba(160,190,230,0.4);border-radius:8px;padding:4px 6px;font-size:13px;font-weight:700;color:#2a3a50;text-align:center;outline:none;font-family:inherit"><span style="font-size:11px;color:#a0b8d0">bpm</span></div><div id="card-formula-'+idx+'" style="font-size:10px;color:#c0d0e0;margin-bottom:8px;padding:0 2px"></div><div id="card-zones-'+idx+'" style="display:flex;flex-direction:column;gap:5px"></div>')}</div>`;
    const bd = w.bodyData;
    const lW = bd.weight.filter(v=>v!=null).at(-1), lF = bd.fat.filter(v=>v!=null).at(-1), lM = bd.muscle.filter(v=>v!=null).at(-1);
    const pW = bd.weight.filter(v=>v!=null).at(-2)??null, pF = bd.fat.filter(v=>v!=null).at(-2)??null, pM = bd.muscle.filter(v=>v!=null).at(-2)??null;
    function dl(c,p){ if(c==null||p==null) return{text:'—',cls:''}; const d=(c-p).toFixed(1); return{text:(d>0?'+':'')+d+' kg',cls:d>0?'up':d<0?'down':''}; }
    const dW=dl(lW,pW), dF=dl(lF,pF), dM=dl(lM,pM);
    function chips(opts,active){ return opts.map(o=>`<div class="chip${o===active?' on':''}">${o}</div>`).join(''); }
    const summaryItems = (w.summary?.items||[]).map(it=>`<div class="summary-item"><span class="si-name">${it.name}</span><span class="si-sep">=</span><span class="si-detail">${it.detail}</span></div>`).join('') || '<div style="font-size:13px;color:#c0d0e0;padding:8px 0">수업 후 트레이너가 입력합니다.</div>';
    const exMap = {}; (w.exercises||[]).forEach(e => { exMap[e.name] = e; });
    const exBase = (w.summary?.items||[]).map(it=>it.name);
    const exAll = exBase.length ? exBase : (w.exercises||[]).map(e=>e.name);
    const exItems = exAll.map(name => { const fb = exMap[name]; return `<div class="exercise-item"><div class="ei-name">${name}</div>${fb ? `<div class="ei-feedback">${fb.note}</div>${fb.next?`<div class="ei-next">${fb.next}</div>`:''}` : `<div class="ei-feedback" style="color:#c8d8e8;font-style:italic">피드백 작성 전</div>`}</div>`; }).join('') || '<div class="exercise-item"><div class="ei-name">—</div><div class="ei-feedback">수업 내용을 입력해 주세요.</div></div>';
    function liftTimer(l) {
      if (!l.lastIncrease || !l.intervalWeeks) return '';
      const last = new Date(l.lastIncrease); last.setHours(0,0,0,0);
      const next = new Date(last.getTime() + l.intervalWeeks * 7 * 86400000);
      const today = new Date(); today.setHours(0,0,0,0);
      const diff = Math.round((next - today) / 86400000);
      if (diff <= 0) return `<div class="lb-timer ready">증량 타이밍! 🔥</div>`;
      if (diff <= 7) return `<div class="lb-timer soon">D-${diff} 증량 예정</div>`;
      return `<div class="lb-timer waiting">D-${diff} 증량 예정</div>`;
    }
    const liftItems = (w.lifts||[]).map(l=>`<div class="lift-box"><div class="lb-name">${l.name}</div><div class="lb-current">${l.current}<span>kg</span></div><div class="lb-meta"><div class="lb-goal">목표 ${l.goal}kg</div><div class="lb-gap">−${l.goal-l.current}kg</div>${liftTimer(l)}</div></div>`).join('') || '<div style="font-size:13px;color:#c0d0e0;padding:4px 0">리프트 데이터를 입력해 주세요.</div>';
    const r = w.weeklyRoutine, calKey = `hm_${r.weekKey}_${idx}`;
    const today = new Date(); today.setHours(0,0,0,0);
    function parseWeekStart(dateStr) {
      if (!dateStr || !dateStr.includes('/')) return null;
      const [m, d] = dateStr.split('/').map(Number);
      const yr = today.getFullYear();
      const dt = new Date(yr, m-1, d);
      if (dt < new Date(yr, 0, 1)) dt.setFullYear(yr+1);
      return dt;
    }
    const weekStart = parseWeekStart(w.date);
    const calDays = r.days.map((d,i) => {
      const dayDate = weekStart ? new Date(weekStart.getTime() + i*86400000) : null;
      const dateNum = dayDate ? dayDate.getDate() : '';
      const isToday = dayDate && dayDate.getTime() === today.getTime();
      const workoutShort = d.rest ? '휴식' : (d.workout||'').split('-')[0] || '-';
      return `<div class="cal-day${d.rest?' rest-day':''}${isToday?' today':''}" data-idx="${i}" data-cal="${calKey}" data-day="${d.day}" data-workout="${d.workout||''}" data-plan='${JSON.stringify(d.plan||[])}' data-istoday="${isToday?'1':'0'}" data-isrest="${d.rest?'1':'0'}"><div class="cd-weekday">${d.day}</div>${dateNum?`<div class="cd-date">${dateNum}</div>`:''}<div class="cd-workout">${workoutShort}</div><div class="cd-check">✓</div></div>`;
    }).join('');
    const HR = '<hr style="border:none;border-top:1px solid rgba(160,190,230,0.2);margin:20px 0">';
    return `<div class="week-panel" data-idx="${idx}">
      ${!isMember && w.nextSessionMemo ? `<div class="card" style="border-left:3px solid rgba(200,160,90,0.5)"><div class="card-title gold">다음 수업 준비<span class="memo-badge">트레이너</span></div><div class="note">${w.nextSessionMemo}</div></div>` : ''}
      <div class="card"><div class="card-title gold">이번 주 핵심 메시지</div><div class="msg gold">${w.mainMessage}</div></div>
      <div class="card"><div class="card-title blue">수업 내용</div><div class="sub-label">요약</div><div style="font-size:12px;color:#a8bcd0;margin-bottom:12px">수업일: ${w.summary?.date||''}</div><div class="summary-list">${summaryItems}</div>${HR}<div class="sub-label">운동 피드백</div><div class="exercise-grid">${exItems}</div>${w.musclesWorked?.length?`${HR}<div class="sub-label">운동 부위</div><div class="muscle-tag-row">${w.musclesWorked.map(m=>`<span class="muscle-tag">${MUSCLE_DATA[m]?.name||m}</span>`).join("")}</div>`:""}</div>
      <div class="card"><div class="card-title blue">운동 현황</div><div class="sub-label">주요 리프트</div><div class="lift-grid">${liftItems}</div>${HR}<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px"><div class="sub-label" style="margin-bottom:0">이번 주 트레이닝</div><span class="wk-count" id="wk-count-${idx}">주 0회</span></div><div class="weekly-cal" id="weekly-cal-${idx}">${calDays}</div><div class="note">${r.note||''}</div></div>
      ${collapsible('이번 주 상태', 'blue', `<div id="ds-${idx}"><div style="font-size:11px;color:#a0b8d0;font-weight:600;margin-bottom:14px">📅 오늘 ${new Date().toLocaleDateString('ko-KR',{month:'long',day:'numeric'})} 기준 — 매일 초기화</div><div class="sub-label"><span class="dot" style="background:#f4a07e"></span>컨디션</div>${miniSum('condition',['매우 좋음','좋음','보통','피곤함','매우 피곤함'])}<div class="check-row">${dailyChips('condition',['매우 좋음','좋음','보통','피곤함','매우 피곤함'])}</div>${HR}<div class="sub-label"><span class="dot" style="background:#a78bde"></span>수면</div>${miniSum('sleep',['매우 나쁨','나쁨','보통','좋음','매우 좋음'])}<div class="check-row">${dailyChips('sleep',['매우 나쁨','나쁨','보통','좋음','매우 좋음'])}</div>${HR}<div class="sub-label"><span class="dot" style="background:#6dc99c"></span>신체 불편</div>${miniSum('pain',['없음','있음'])}<div class="check-row">${dailyChips('pain',['없음','있음'])}</div>${HR}<div class="sub-label"><span class="dot" style="background:#f0c96a"></span>영양 상태</div>${miniSum('nutrition',['매우 나쁨','나쁨','보통','좋음','매우 좋음'])}<div class="check-row">${dailyChips('nutrition',['매우 나쁨','나쁨','보통','좋음','매우 좋음'])}</div></div>`)}
      ${collapsible('운동 처방 가이드', 'blue', '<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px"><span style="font-size:11px;color:#a0b8d0;white-space:nowrap">기준 중량 (1RM)</span><input id="train-kg-'+idx+'" type="number" min="1" max="500" value="60" style="width:52px;background:rgba(255,255,255,0.6);border:1px solid rgba(160,190,230,0.4);border-radius:8px;padding:4px 6px;font-size:13px;font-weight:700;color:#2a3a50;text-align:center;outline:none;font-family:inherit"><span style="font-size:11px;color:#a0b8d0">kg</span></div><div style="display:flex;align-items:center;gap:5px;margin-bottom:10px;padding:6px 8px;background:rgba(255,255,255,0.35);border-radius:8px;border:1px solid rgba(160,190,230,0.2)"><span style="font-size:10px;color:#b0c8e0;white-space:nowrap">1RM 모를 때</span><input id="est-w-'+idx+'" type="number" min="1" max="400" placeholder="무게" style="width:46px;background:rgba(255,255,255,0.6);border:1px solid rgba(160,190,230,0.3);border-radius:6px;padding:3px 4px;font-size:11px;font-weight:600;color:#2a3a50;text-align:center;outline:none;font-family:inherit"><span style="font-size:10px;color:#c0d0e0">kg</span><input id="est-r-'+idx+'" type="number" min="1" max="30" placeholder="횟수" style="width:38px;background:rgba(255,255,255,0.6);border:1px solid rgba(160,190,230,0.3);border-radius:6px;padding:3px 4px;font-size:11px;font-weight:600;color:#2a3a50;text-align:center;outline:none;font-family:inherit"><span style="font-size:10px;color:#c0d0e0">회</span><span style="font-size:10px;color:#c0d0e0">→</span><span id="est-result-'+idx+'" style="font-size:11px;font-weight:700;color:#5a8ab8;min-width:28px">—</span><span style="font-size:10px;color:#c0d0e0">kg</span></div><div id="train-table-'+idx+'"></div>')}
      ${collapsible('유산소 강도 가이드', 'blue', '<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px"><span style="font-size:11px;color:#a0b8d0;white-space:nowrap">오늘 안정시 심박수</span><input id="card-rhr-'+idx+'" type="number" min="40" max="120" style="width:52px;background:rgba(255,255,255,0.6);border:1px solid rgba(160,190,230,0.4);border-radius:8px;padding:4px 6px;font-size:13px;font-weight:700;color:#2a3a50;text-align:center;outline:none;font-family:inherit"><span style="font-size:11px;color:#a0b8d0">bpm</span></div><div id="card-formula-'+idx+'" style="font-size:10px;color:#c0d0e0;margin-bottom:8px;padding:0 2px"></div><div id="card-zones-'+idx+'" style="display:flex;flex-direction:column;gap:5px"></div>')}
      ${collapsible('체성분', 'green', `${buildCountdown(bd.lastMeasured)}<div class="stat-grid" style="margin-top:${bd.lastMeasured?'14px':'0'}"><div class="stat-box"><div class="lbl">체중</div><div class="val">${lW??'—'}</div><div class="unt">kg</div></div><div class="stat-box"><div class="lbl">체지방량</div><div class="val">${lF??'—'}</div><div class="unt">kg</div></div><div class="stat-box"><div class="lbl">골격근량</div><div class="val">${lM??'—'}</div><div class="unt">kg</div></div></div><div class="delta-row"><div class="delta-box"><span class="dlbl">체중 변화</span><span class="dval ${dW.cls}">${dW.text}</span></div><div class="delta-box"><span class="dlbl">체지방 변화</span><span class="dval ${dF.cls}">${dF.text}</span></div><div class="delta-box"><span class="dlbl">근육 변화</span><span class="dval ${dM.cls}">${dM.text}</span></div></div>${HR}<div class="sub-label">변화 추이</div><div style="font-size:10px;font-weight:700;color:#90c8a8;letter-spacing:0.5px;margin-bottom:4px">체중</div><div style="position:relative;height:130px;margin-bottom:12px"><canvas id="bodyChart-${idx}"></canvas></div><div style="font-size:10px;font-weight:700;color:#7aaad4;letter-spacing:0.5px;margin-bottom:4px">골격근량 · 체지방량</div><div style="position:relative;height:130px;margin-bottom:14px"><canvas id="bodyChart2-${idx}"></canvas></div><div class="msg">${bd.comment}</div>`)}
      ${(w.review?.good || w.review?.caution || w.review?.suggest || w.trainerComment) ? collapsible('트레이너 평가', 'gold', `<div style="margin-bottom:14px"><div class="sub-label">✓ 잘 하고 있는 점</div><div class="msg green">${w.review.good}</div></div><div style="margin-bottom:14px"><div class="sub-label" style="color:#e05050">⚠ 주의할 점</div><div class="msg gold">${w.review.caution}</div></div><div style="margin-bottom:14px"><div class="sub-label">→ 권장 사항</div><div class="msg">${w.review.suggest}</div></div>${w.trainerComment ? `${HR}<div class="sub-label">트레이너 코멘트</div><div class="msg gold">${w.trainerComment}</div>` : ''}${!isMember && w.trainerDirection ? `${HR}<div class="sub-label">트레이닝 방향</div><div class="msg">${w.trainerDirection}</div>` : ''}`) : ''}
    </div>`;
  }

  const navEl   = document.getElementById('week-nav');
  const panelEl = document.getElementById('week-panels');
  navEl.innerHTML   = weeks.map((w,i) => `<button class="wt-btn${!w.mainMessage?' empty':''}${i===0?' active':''}" data-idx="${i}"><span class="wt-week">${w.label}</span><span class="wt-date">${!w.mainMessage?'미입력':w.date}</span></button>`).join('');
  panelEl.innerHTML = weeks.map((w,i) => buildPanel(w,i)).join('');

  /* 운동 처방 가이드 + 유산소 강도 가이드 초기화 */
  const TG_THINPUT = `width:52px;background:rgba(255,255,255,0.6);border:1px solid rgba(160,190,230,0.4);border-radius:8px;padding:3px 5px;font-size:11px;font-weight:700;color:#2a3a50;text-align:center;outline:none;font-family:inherit`;
  const TG_ROW = `display:grid;grid-template-columns:56px 44px 1fr 36px 44px;align-items:center;gap:4px;padding:5px 8px;background:rgba(255,255,255,0.45);border-radius:9px;border:1px solid rgba(255,255,255,0.75)`;
  const TG_HDR = `display:grid;grid-template-columns:56px 44px 1fr 36px 44px;gap:4px;padding:2px 8px;font-size:9px;font-weight:700;color:#b0c8e0;letter-spacing:0.4px;text-transform:uppercase`;
  weeks.forEach((w, idx) => {
    const kgEl = document.getElementById('train-kg-' + idx);
    if (kgEl) {
      function renderTrain(i) {
        const kg = parseFloat(document.getElementById('train-kg-' + i).value) || 60;
        const tbl = document.getElementById('train-table-' + i);
        tbl.innerHTML = '<div style="' + TG_HDR + '"><span>목표</span><span>횟수</span><span style="text-align:center">중량</span><span>RPE</span><span>TUT</span></div>'
          + TRAIN_GOALS.map(g => {
              const lo = Math.round(kg * g.pctLo), hi = Math.round(kg * g.pctHi);
              return '<div style="' + TG_ROW + '"><span style="font-size:11px;font-weight:700;color:#3a5a80">' + g.name + '</span>'
                + '<span style="font-size:10px;color:#8aa8c8">' + g.reps + '</span>'
                + '<span style="font-size:11px;font-weight:700;color:#1a2a40;text-align:center">' + lo + '–' + hi + '<span style="font-size:9px;color:#b0c0d4;margin-left:2px">kg</span></span>'
                + '<span style="font-size:10px;color:#8aa8c8">' + g.rpe + '</span>'
                + '<span style="font-size:10px;color:#8aa8c8">' + g.tut + '</span></div>';
            }).join('');
      }
      kgEl.addEventListener('input', () => renderTrain(idx));
      renderTrain(idx);
      const estW = document.getElementById('est-w-' + idx);
      const estR = document.getElementById('est-r-' + idx);
      const estResult = document.getElementById('est-result-' + idx);
      function calcEst(i) {
        const w = parseFloat(document.getElementById('est-w-' + i).value);
        const r = parseInt(document.getElementById('est-r-' + i).value);
        if (!w || !r) { document.getElementById('est-result-' + i).textContent = '—'; return; }
        const orm = Math.round(w * (1 + r / 30));
        document.getElementById('est-result-' + i).textContent = orm;
        document.getElementById('train-kg-' + i).value = orm;
        renderTrain(i);
      }
      estW.addEventListener('input', () => calcEst(idx));
      estR.addEventListener('input', () => calcEst(idx));
    }
    if (cardio?.age) {
      const rhrEl = document.getElementById('card-rhr-' + idx);
      if (rhrEl) {
        const maxHR = Math.round(207 - 0.7 * cardio.age);
        rhrEl.value = cardio.restingHR || 65;
        function renderZones(i) {
          const rhr = parseInt(document.getElementById('card-rhr-' + i).value) || 65;
          const hrr = maxHR - rhr;
          document.getElementById('card-formula-' + i).textContent = '최대 심박수 ' + maxHR + ' bpm · 심박 여유도 ' + hrr + ' bpm (카르보넨 공식)';
          document.getElementById('card-zones-' + i).innerHTML = ZONES.map(z => {
            const lo = Math.round(z.pctLo * hrr + rhr), hi = Math.round(z.pctHi * hrr + rhr);
            return '<div class="zone-row"><div class="zone-dot" style="background:' + z.color + '"></div><div class="zone-label" style="color:' + z.color + '">' + z.label + '</div><div class="zone-range">' + lo + '–' + hi + '<span>bpm</span></div><div class="zone-desc">' + z.desc + '</div></div>';
          }).join('');
        }
        rhrEl.addEventListener('input', () => renderZones(idx));
        renderZones(idx);
      }
    }
  });

  navEl.querySelectorAll('.wt-btn').forEach(btn => btn.addEventListener('click', function(){ switchWeek(parseInt(this.dataset.idx)); }));
  switchWeek(0);

  /* 달력 */
  document.querySelectorAll('.weekly-cal').forEach(cal => {
    const calKey = cal.querySelector('.cal-day')?.dataset.cal;
    if (!calKey) return;
    let checked = JSON.parse(localStorage.getItem(calKey)||'[]');
    function renderCal(){ cal.querySelectorAll('.cal-day').forEach((el,i)=>el.classList.toggle('checked',checked.includes(i))); const ci=parseInt(cal.id.replace('weekly-cal-','')); const ce=document.getElementById(`wk-count-${ci}`); if(ce) ce.textContent=`주 ${checked.length}회`; }
    renderCal();

    // 오늘 미체크 알림
    const todayEl = cal.querySelector('.cal-day.today');
    if (todayEl && todayEl.dataset.isrest !== '1') {
      const todayIdx = parseInt(todayEl.dataset.idx);
      const remId = `reminder-${calKey}`;
      if (!checked.includes(todayIdx) && !document.getElementById(remId)) {
        const bar = document.createElement('div');
        bar.className = 'reminder-bar'; bar.id = remId;
        bar.innerHTML = `<span class="reminder-bar-text">💪 오늘 운동 완료했나요? 체크해주세요!</span><button class="reminder-bar-btn" onclick="document.getElementById('${remId}').style.display='none'">닫기</button>`;
        cal.parentElement.insertBefore(bar, cal);
      }
    }

    cal.querySelectorAll('.cal-day:not(.rest-day)').forEach(el => el.addEventListener('click', function(){
      const i = parseInt(this.dataset.idx);
      const plan = JSON.parse(this.dataset.plan || '[]');
      const day = this.dataset.day, workout = this.dataset.workout;
      openPlanPopup(day, workout, plan, i, checked, calKey, renderCal);
    }));
  });

  /* 바디맵 */
  weeks.forEach((w,idx) => {
    const container = document.getElementById(`body-map-${idx}`);
    if (!container || !w.musclesWorked) return;
    const worked = new Set(w.musclesWorked);
    container.querySelectorAll('.muscle-area').forEach(el => {
      const m = el.dataset.muscle;
      if (worked.has(m)) { el.setAttribute('fill','rgba(210,60,60,0.45)'); el.setAttribute('stroke','rgba(185,30,30,0.9)'); el.setAttribute('stroke-width','1.5'); }
      else               { el.setAttribute('fill','rgba(210,224,238,0.55)'); el.setAttribute('stroke','rgba(175,200,225,0.6)'); el.setAttribute('stroke-width','1'); }
    });
  });
  const popup = document.getElementById('muscle-popup');
  let lastMuscle = null;
  document.getElementById('popup-close-btn').addEventListener('click', e => { e.stopPropagation(); popup.style.display='none'; lastMuscle=null; });
  document.querySelectorAll('.muscle-area').forEach(el => {
    el.addEventListener('click', function(e) {
      e.stopPropagation();
      const m=this.dataset.muscle, d=MUSCLE_DATA[m]; if(!d) return;
      if(lastMuscle===m&&popup.style.display!=='none'){popup.style.display='none';lastMuscle=null;return;}
      lastMuscle=m; popup.querySelector('.popup-name').textContent=d.name; popup.querySelector('.popup-exercises').innerHTML=d.exercises.map(x=>'· '+x).join('<br>');
      popup.style.display='block';
      const r=this.getBoundingClientRect(),pw=175,left=Math.max(10,Math.min(r.left+r.width/2-pw/2,window.innerWidth-pw-10));
      popup.style.left=left+'px'; popup.style.top=(r.top>74?r.top-74:r.bottom+10)+'px';
    });
  });
  document.addEventListener('click',()=>{popup.style.display='none';lastMuscle=null;});

  /* 월간 요약 */
  const mssEl = document.getElementById('monthly-summary-section');
  const summaries = (data.monthlySummary || []).slice().reverse();
  if (summaries.length) {
    const titleEl = document.createElement('div');
    titleEl.className = 'ms-section-title';
    titleEl.textContent = '월간 요약';
    mssEl.appendChild(titleEl);

    summaries.forEach((ms, idx) => {
      const isOpen = idx === 0;
      const bc = ms.bodyChange || {};
      const w = bc.weight || {}, m = bc.muscle || {}, f = bc.fat || {};

      const fmtChange = (val, invert) => {
        if (val === null || val === undefined) return '';
        const cls = val === 0 ? 'zero' : (val < 0 ? (invert ? 'pos' : 'neg') : (invert ? 'neg' : 'pos'));
        const sign = val > 0 ? '+' : '';
        return `<div class="ms-stat-change ${cls}">${sign}${val}kg</div>`;
      };

      const distHtml = obj => Object.entries(obj || {})
        .map(([k, v]) => `<span class="ms-dist-chip">${k} ${v}회</span>`).join('');

      const exHtml = arr => (arr || [])
        .map(e => `<span class="ms-ex-chip">${e}</span>`).join('');

      const statRow = (w.start !== null && w.start !== undefined) ? `
        <div class="ms-stat-row">
          <div class="ms-stat"><div class="ms-stat-label">체중</div><div class="ms-stat-val">${w.end}<span>kg</span></div>${fmtChange(w.change, false)}</div>
          ${m.start !== null && m.start !== undefined ? `<div class="ms-stat"><div class="ms-stat-label">골격근량</div><div class="ms-stat-val">${m.end}<span>kg</span></div>${fmtChange(m.change, true)}</div>` : ''}
          ${f.start !== null && f.start !== undefined ? `<div class="ms-stat"><div class="ms-stat-label">체지방량</div><div class="ms-stat-val">${f.end}<span>kg</span></div>${fmtChange(f.change, false)}</div>` : ''}
        </div>` : '';

      const condDist  = Object.keys(ms.condition||{}).length  ? `<div class="ms-sub-label">컨디션</div><div class="ms-dist">${distHtml(ms.condition)}</div>` : '';
      const sleepDist = Object.keys(ms.sleep||{}).length     ? `<div class="ms-sub-label">수면</div><div class="ms-dist">${distHtml(ms.sleep)}</div>` : '';
      const exList    = (ms.topExercises||[]).length          ? `<div class="ms-sub-label">주요 운동</div><div class="ms-exercises">${exHtml(ms.topExercises)}</div>` : '';

      const card = document.createElement('div');
      card.className = 'ms-card';
      card.innerHTML = `
        <button class="ms-toggle${isOpen ? ' open' : ''}" onclick="this.classList.toggle('open');this.nextElementSibling.classList.toggle('open')">
          <div class="ms-toggle-left">
            <span class="ms-label">${ms.label}</span>
            <span class="ms-count">${ms.sessions}회 수업</span>
          </div>
          <span class="ms-arrow">▾</span>
        </button>
        <div class="ms-body${isOpen ? ' open' : ''}">
          ${statRow}${condDist}${sleepDist}${exList}
          <div class="ms-comment">${ms.autoComment}</div>
        </div>`;
      mssEl.appendChild(card);
    });
  }

  /* 오늘의 명언 — 항상 맨 아래 */
  const quoteText = (() => {
    if (data.quotes?.length) {
      const day = Math.floor((new Date() - new Date(new Date().getFullYear(), 0, 0)) / 864e5);
      return '"' + data.quotes[day % data.quotes.length] + '"';
    }
    return weeks[0]?.finalMessage || '';
  })();
  if (quoteText) {
    document.getElementById('quote-section').innerHTML =
      `<div class="final-card"><div>오늘의 명언</div><div>${quoteText}</div></div>`;
  }
}

/* ── 운동 계획 팝업 ── */
let _planCtx = {};
function openPlanPopup(day, workout, plan, idx, checked, calKey, renderCal) {
  _planCtx = { idx, checked, calKey, renderCal };
  document.getElementById('plan-title').textContent = `${day}요일 · ${workout}`;
  document.getElementById('plan-sub').textContent = plan.length ? `총 ${plan.length}개 운동` : '세부 계획 없음';
  document.getElementById('plan-rows').innerHTML = plan.length
    ? plan.map(p=>`<div class="plan-row"><span class="plan-name">${p.name}</span><span class="plan-detail">${p.sets}세트 × ${p.reps}회${p.weight?' / '+p.weight:''}</span></div>`).join('')
    : '<div style="font-size:13px;color:#c0d0e0;padding:8px 0">이 날 세부 계획이 없어요.</div>';
  updatePlanBtn();
  document.getElementById('plan-overlay').classList.add('show');
}
function updatePlanBtn() {
  const btn = document.getElementById('plan-check-btn');
  const done = _planCtx.checked.includes(_planCtx.idx);
  btn.textContent = done ? '✓ 완료됨' : '완료 체크';
  btn.classList.toggle('done', done);
}
document.getElementById('plan-check-btn').addEventListener('click', () => {
  const { idx, checked, calKey, renderCal } = _planCtx;
  const pos = checked.indexOf(idx);
  if (pos !== -1) checked.splice(pos, 1);
  else checked.push(idx);
  localStorage.setItem(calKey, JSON.stringify(checked));
  renderCal();
  updatePlanBtn();
});
document.getElementById('plan-close').addEventListener('click', () => document.getElementById('plan-overlay').classList.remove('show'));
document.getElementById('plan-overlay').addEventListener('click', e => { if(e.target===e.currentTarget) e.currentTarget.classList.remove('show'); });
</script>
